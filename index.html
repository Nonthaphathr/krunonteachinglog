const fmtDate = (s) => { if(!s) return ""; const d=new Date(s+"T00:00:00");
  return d.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"}); };

/* แปลงคำอ่านเลขไทย / เลขไทย ๑๒๓ -> ตัวเลขอารบิก  (คืนค่าเดิมถ้าแปลงไม่ได้) */
const TH_DIGIT={ศูนย์:0,หนึ่ง:1,เอ็ด:1,สอง:2,ยี่:2,สาม:3,สี่:4,ห้า:5,หก:6,เจ็ด:7,แปด:8,เก้า:9};
const TH_UNIT={สิบ:10,ร้อย:100,พัน:1000,หมื่น:10000,แสน:100000,"ล้าน":1000000};
const TH_NUM={"๐":"0","๑":"1","๒":"2","๓":"3","๔":"4","๕":"5","๖":"6","๗":"7","๘":"8","๙":"9"};
function evalThaiTokens(text){
  text=text.replace(/\s+/g,""); if(text==="") return null;
  const words=[...Object.keys(TH_DIGIT),...Object.keys(TH_UNIT)].sort((a,b)=>b.length-a.length);
  const tokens=[]; let i=0;
  while(i<text.length){ let hit=null;
    for(const w of words){ if(text.startsWith(w,i)){ hit=w; break; } }
    if(!hit) return null; tokens.push(hit); i+=hit.length; }
  let total=0,current=0,temp=0;
  for(const w of tokens){
    if(w in TH_DIGIT){ temp=TH_DIGIT[w]; }
    else{ const u=TH_UNIT[w];
      if(u===1000000){ total=(total+current+temp)*1000000; current=0; temp=0; }
      else{ if(temp===0) temp=1; current+=temp*u; temp=0; } }
  }
  return total+current+temp;
}
function thaiToNumber(val){
  if(val==null) return val;
  let t=String(val).trim(); if(t==="") return val;
  if(/[๐-๙]/.test(t)) t=t.replace(/[๐-๙]/g,d=>TH_NUM[d]);          // เลขไทย -> อารบิก
  if(/^-?\d+(\.\d+)?$/.test(t)) return t;                            // เป็นตัวเลขอยู่แล้ว
  if(t.includes("จุด")){                                            // รองรับทศนิยม "แปดจุดห้า"
    const [ip,fp]=t.split("จุด"); const iv=ip?evalThaiTokens(ip):0;
    if(iv==null) return val;
    let frac=""; let j=0;
    const dw=Object.keys(TH_DIGIT).sort((a,b)=>b.length-a.length);
    while(j<fp.length){ let hit=null; for(const w of dw){ if(fp.startsWith(w,j)){ hit=w; break; } }
      if(!hit) return val; frac+=TH_DIGIT[hit]; j+=hit.length; }
    return String(iv)+(frac?"."+frac:"");
  }
  const n=evalThaiTokens(t);
  return n==null?val:String(n);
}

/* ---------- ไอคอน (inline SVG) ---------- */

/* ---------- Persist (เขียนลง Firestore) ---------- */
const PersistCtx = createContext(null);
const usePersist = () => useContext(PersistCtx);

function makePersist(){
  if(!FB){ // โหมดหน่วยความจำ: ทุกฟังก์ชันเป็น no-op
    const noop = async()=>{};
    return { addSubject:noop,updateSubject:noop,deleteSubject:noop,replaceStudents:noop,setStudentStatus:noop,
      deleteStudent:noop,setAttendanceDay:noop,addAssignment:noop,updateAssignment:noop,
      deleteAssignment:noop,setScoreDoc:noop,addNote:noop,updateNote:noop,deleteNote:noop,setLogo:noop,setQinfo:noop };
  }
  const col = (n)=>db.collection(n);
  const deleteWhere = async(name,subjId)=>{
    const snap = await col(name).where("subjectId","==",subjId).get();
    await Promise.all(snap.docs.map(d=>d.ref.delete()));
  };
  return {
    addSubject:(s)=>col("subjects").doc(s.id).set({name:s.name,code:s.code,room:s.room,color:s.color,createdAt:s.createdAt||Date.now()}),
    updateSubject:(id,s)=>col("subjects").doc(id).set({name:s.name,code:s.code,room:s.room,color:s.color},{merge:true}),
    deleteSubject:async(id)=>{ await col("subjects").doc(id).delete();
      await Promise.all(["students","assignments","notes","attendance","scores","qinfo"].map(n=>deleteWhere(n,id))); },
    replaceStudents:async(subjId,list)=>{ await deleteWhere("students",subjId);
      const batch=db.batch(); list.forEach(s=>batch.set(col("students").doc(s.id),{subjectId:subjId,number:s.number,name:s.name,status:s.status||"normal"})); await batch.commit(); },
    deleteStudent:(id)=>col("students").doc(id).delete(),
    setStudentStatus:(id,status)=>col("students").doc(id).set({status},{merge:true}),
    setAttendanceDay:(subjId,date,marks)=>col("attendance").doc(subjId+"_"+date).set({subjectId:subjId,date,marks}),
    addAssignment:(subjId,a)=>col("assignments").doc(a.id).set({subjectId:subjId,title:a.title,max:a.max,order:a.order}),
    updateAssignment:(id,a)=>col("assignments").doc(id).set({title:a.title,max:a.max},{merge:true}),
    deleteAssignment:(id)=>col("assignments").doc(id).delete(),
    setScoreDoc:(subjId,studentId,values)=>col("scores").doc(subjId+"_"+studentId).set({subjectId:subjId,studentId,values}),
    addNote:(subjId,n)=>col("notes").doc(n.id).set({subjectId:subjId,date:n.date,text:n.text}),
    updateNote:(id,n)=>col("notes").doc(id).set({date:n.date,text:n.text},{merge:true}),
    deleteNote:(id)=>col("notes").doc(id).delete(),
    setLogo:(url)=>col("settings").doc("app").set({logoUrl:url}),
    setQinfo:(docId,data)=>col("qinfo").doc(docId).set(data),
  };
}

function Btn({children,onClick,variant="primary",size="md",style,title,disabled}){
  const base={display:"inline-flex",alignItems:"center",justifyContent:"center",gap:6,borderRadius:8,
    cursor:disabled?"not-allowed":"pointer",fontWeight:600,border:"1px solid transparent",fontFamily:"inherit",
    transition:"all .15s",opacity:disabled?.5:1,whiteSpace:"nowrap",
    padding:size==="sm"?"6px 10px":"9px 16px",fontSize:size==="sm"?13:14.5};
  const v={ primary:{background:C.navy,color:"#fff"}, accent:{background:C.accent,color:"#fff"},
    ghost:{background:"transparent",color:C.navy,border:"1px solid "+C.border},
    danger:{background:"transparent",color:"#c0392b",border:"1px solid #f0c9c4"},
    soft:{background:C.navySoft,color:C.navy} };
  return <button title={title} disabled={disabled} onClick={onClick} style={{...base,...v[variant],...style}}>{children}</button>;
}
function Modal({open,onClose,title,children,width=460}){
  if(!open) return null;
  return <div className="tl-modal-wrap" onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(22,43,70,.45)",zIndex:60,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
    <div className="tl-modal" onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:"16px 16px 0 0",width:"100%",maxWidth:width,maxHeight:"88vh",overflow:"auto",border:"1px solid "+C.border}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 18px",borderBottom:"1px solid "+C.border,position:"sticky",top:0,background:"#fff",zIndex:1}}>
        <h3 style={{margin:0,fontSize:17,color:C.navy,fontWeight:700}}>{title}</h3>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:SUB}}><X size={22}/></button>
      </div>
      <div style={{padding:18}}>{children}</div>
    </div>
  </div>;
}
function Field({label,children}){ return <label style={{display:"block",marginBottom:14}}>
  <span style={{display:"block",fontSize:13,fontWeight:600,color:SUB,marginBottom:6}}>{label}</span>{children}</label>; }
/* สถานะนักเรียน: ไม่มีค่า/normal = ปกติ */
const STU_STATUS=[{v:"normal",label:"ปกติ",color:"#2e7d52",bg:"#e6f4ec"},{v:"suspended",label:"แขวนลอย",color:"#b7791f",bg:"#fdf3dc"},{v:"moved",label:"ย้าย",color:"#2b6cb0",bg:"#e5eefa"},{v:"left",label:"ลาออก",color:"#c0392b",bg:"#fbeae8"}];
const stuStatusOf=(s)=>STU_STATUS.find(x=>x.v===(s&&s.status))||STU_STATUS[0];
const isNormalStu=(s)=>!s||!s.status||s.status==="normal";
const STU_XL={suspended:{fill:"FFF3DC",font:"B7791F"},moved:{fill:"E5EEFA",font:"2B6CB0"},left:{fill:"FBEAE8",font:"C0392B"}};
/* ใส่สีไฮไลท์แถวนักเรียนสถานะไม่ปกติใน Excel (แถวข้อมูลเริ่มที่แถว 2) */
function markStatusRows(ws,studs,ncol){ studs.forEach((s,i)=>{ if(isNormalStu(s)) return; const c0=STU_XL[s.status]||STU_XL.left;
  for(let c=0;c<ncol;c++){ const ref=XLSX.utils.encode_cell({r:i+1,c}); if(!ws[ref]) ws[ref]={t:"s",v:""};
    ws[ref].s={fill:{patternType:"solid",fgColor:{rgb:c0.fill}},font:{color:{rgb:c0.font},bold:c===ncol-1}}; } }); }
const inputStyle={width:"100%",boxSizing:"border-box",padding:"10px 12px",borderRadius:8,border:"1px solid "+C.border,fontSize:14.5,fontFamily:"inherit",color:C.text,outline:"none",background:"#fff"};
const tableWrap={background:"#fff",border:"1px solid "+C.border,borderRadius:12,overflow:"auto"};
const tableStyle={width:"100%",borderCollapse:"collapse",fontSize:14.5};
const th={background:C.navy,color:"#fff",padding:"11px 12px",textAlign:"center",fontWeight:600,fontSize:13.5,position:"sticky",top:0};
const td={padding:"10px 12px",borderTop:"1px solid "+C.border,verticalAlign:"middle"};
const miniIcon={background:"rgba(255,255,255,.15)",border:"none",color:"#fff",borderRadius:5,padding:3,cursor:"pointer",display:"flex"};
const cardActBtn={flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:5,padding:"9px 0",background:"none",border:"none",cursor:"pointer",fontSize:13.5,color:C.navy,fontWeight:600,fontFamily:"inherit"};
const panel={background:"#fff",border:"1px solid "+C.border,borderRadius:12,padding:16};
const panelHead={display:"flex",alignItems:"center",gap:8,fontSize:16,fontWeight:700,color:C.navy,marginBottom:14};
function SectionHead({title,right}){ return <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,gap:10,flexWrap:"wrap"}}>
  <h2 style={{margin:0,fontSize:19,color:C.navy}}>{title}</h2>{right}</div>; }
function EmptyHint({text}){ return <div style={{gridColumn:"1/-1",textAlign:"center",color:SUB,padding:36,background:"#fff",border:"1px dashed "+C.border,borderRadius:12,fontSize:14.5}}>{text}</div>; }

/* ==================== APP ==================== */
function App(){
  const [subjects,setSubjects]=useState([]);
  const [students,setStudents]=useState({});
  const [attendance,setAttendance]=useState({});
  const [assignments,setAssignments]=useState({});
  const [scores,setScores]=useState({});
  const [notes,setNotes]=useState({});
  const [logoUrl,setLogoUrl]=useState("");
  const [qinfo,setQinfo]=useState({});
  const [loading,setLoading]=useState(true);
  const [view,setView]=useState("home");
  const [activeSubj,setActiveSubj]=useState(null);
  const persist = useMemo(()=>makePersist(),[]);

  // โหลดข้อมูลครั้งแรกจาก Firestore
  useEffect(()=>{
    let alive=true;
    async function load(){
      if(!FB){ // seed ตัวอย่างในโหมดหน่วยความจำ
        setSubjects([{id:"s1",name:"วิทยาการคำนวณ",code:"ว21104",room:"ม.1/1",color:CARD_COLORS[0],createdAt:1}]);
        const demoNames=["เด็กชายกิตติ ใจดี","เด็กหญิงนภา ศรีสุข","เด็กชายธนพล หินเงิน","เด็กหญิงพิมพ์ชนก แก้วใส","เด็กชายภูมิ รักไทย","เด็กหญิงสุดา มีสุข","เด็กชายอนันต์ ทองดี","เด็กหญิงกานดา ใจงาม"];
        setStudents({s1:demoNames.map((n,i)=>({id:"a"+(i+1),number:i+1,name:n}))});
        setAssignments({s1:[{id:"w1",title:"ใบงานจับใจความสำคัญ",max:10,order:1},{id:"w2",title:"แบบฝึกคำที่มีหลายความหมาย",max:10,order:2},{id:"w3",title:"งานเขียนจดหมาย",max:20,order:3},{id:"w4",title:"สอบกลางภาค",max:40,order:4}]});
        setLoading(false); return;
      }
      try{
        const [sub,stu,att,asg,sco,note,setDoc]=await Promise.all([
          db.collection("subjects").get(),db.collection("students").get(),
          db.collection("attendance").get(),db.collection("assignments").get(),
          db.collection("scores").get(),db.collection("notes").get(),
          db.collection("settings").doc("app").get(),
        ]);
        if(!alive) return;
        setSubjects(sub.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)));
        const stuObj={}; stu.docs.forEach(d=>{const x={id:d.id,...d.data()}; (stuObj[x.subjectId]=stuObj[x.subjectId]||[]).push(x);});
        Object.keys(stuObj).forEach(k=>stuObj[k].sort((a,b)=>(a.number||0)-(b.number||0))); setStudents(stuObj);
        const attObj={}; att.docs.forEach(d=>{const x=d.data(); attObj[x.subjectId]=attObj[x.subjectId]||{}; attObj[x.subjectId][x.date]=x.marks||{};}); setAttendance(attObj);
        const asgObj={}; asg.docs.forEach(d=>{const x={id:d.id,...d.data()}; (asgObj[x.subjectId]=asgObj[x.subjectId]||[]).push(x);});
        Object.keys(asgObj).forEach(k=>asgObj[k].sort((a,b)=>(a.order||0)-(b.order||0))); setAssignments(asgObj);
        const scoObj={}; sco.docs.forEach(d=>{const x=d.data(); scoObj[x.subjectId]=scoObj[x.subjectId]||{}; scoObj[x.subjectId][x.studentId]=x.values||{};}); setScores(scoObj);
        const noteObj={}; note.docs.forEach(d=>{const x={id:d.id,...d.data()}; (noteObj[x.subjectId]=noteObj[x.subjectId]||[]).push(x);}); setNotes(noteObj);
        if(setDoc.exists) setLogoUrl(setDoc.data().logoUrl||"");
        // Q-Info mapping (แยกโหลด — ถ้าพังจะไม่กระทบข้อมูลส่วนอื่น)
        try{ const qi=await db.collection("qinfo").get(); const qiObj={}; qi.docs.forEach(d=>qiObj[d.id]=d.data()); if(alive) setQinfo(qiObj); }
        catch(e){ console.warn("โหลด qinfo ไม่ได้",e); }
      }catch(e){ console.error("โหลดข้อมูลล้มเหลว:",e); }
      if(alive) setLoading(false);
    }
    load(); return ()=>{alive=false;};
  },[]);

  useEffect(()=>{ if(!logoUrl) return; const l=document.getElementById("favicon"); if(l) l.href=logoUrl; },[logoUrl]);

  const subj = subjects.find(s=>s.id===activeSubj);
  const openSubject=(id)=>{ setActiveSubj(id); setView("class"); };

  if(loading) return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",color:SUB,gap:14}}>
    <div className="spin" style={{color:C.accent}}><Cloud size={40}/></div><div>กำลังโหลดข้อมูล...</div></div>;

  return <PersistCtx.Provider value={persist}>
  <div style={{minHeight:"100vh",color:C.text}}>
    <header style={{background:C.navy,color:"#fff",position:"sticky",top:0,zIndex:40,borderBottom:"3px solid "+C.accent}}>
      <div style={{maxWidth:920,margin:"0 auto",padding:"11px 16px",display:"flex",alignItems:"center",gap:12}}>
        {view!=="home" && <button onClick={()=>setView(view==="class"?"home":"class")} style={{background:"rgba(255,255,255,.12)",border:"none",color:"#fff",borderRadius:8,padding:7,cursor:"pointer",display:"flex"}}><ChevronLeft size={20}/></button>}
        {logoUrl ? <img src={logoUrl} alt="logo" style={{width:34,height:34,borderRadius:8,objectFit:"cover",background:"#fff"}}/> :
          <div style={{width:34,height:34,borderRadius:8,background:C.accent,display:"flex",alignItems:"center",justifyContent:"center"}}><BookOpen size={19}/></div>}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:16,lineHeight:1.15}}>บันทึกการสอนครูนนท์</div>
          <div style={{fontSize:12,color:"#b9c6d6"}}>{view==="home"?"รายวิชาที่รับผิดชอบ":subj?subj.name+" · "+subj.room:"ตั้งค่าระบบ"}</div>
        </div>
        <button onClick={()=>setView("settings")} title="ตั้งค่า" style={{background:view==="settings"?C.accent:"rgba(255,255,255,.12)",border:"none",color:"#fff",borderRadius:8,padding:8,cursor:"pointer",display:"flex"}}><Settings size={20}/></button>
      </div>
    </header>
    {!FB && <div style={{background:"#fbf4e0",color:"#8a6d1b",fontSize:13,textAlign:"center",padding:"7px 12px"}}>โหมดทดลอง (ยังไม่ได้ต่อ Firestore) — ข้อมูลจะไม่ถูกบันทึก เมื่อ deploy บน GitHub Pages จะบันทึกอัตโนมัติ</div>}
    <main style={{maxWidth:920,margin:"0 auto",padding:16,paddingBottom:60}}>
      {view==="home" && <HomeView subjects={subjects} setSubjects={setSubjects} openSubject={openSubject} students={students} setStudents={setStudents}/>}
      {view==="class" && subj && <ClassView subj={subj} setView={setView} students={students[subj.id]||[]}/>}
      {view==="attendance" && subj && <AttendanceView subj={subj} students={students[subj.id]||[]} attendance={attendance} setAttendance={setAttendance}/>}
      {view==="scores" && subj && <ScoresView subj={subj} setView={setView} students={students[subj.id]||[]} assignments={assignments} setAssignments={setAssignments} scores={scores} setScores={setScores}/>}
      {view==="notes" && subj && <NotesView subj={subj} notes={notes} setNotes={setNotes}/>}
      {view==="pending" && subj && <PendingView subj={subj} students={(students[subj.id]||[]).filter(isNormalStu)} assignments={assignments} scores={scores} logoUrl={logoUrl}/>}
      {view==="qinfo" && subj && <QinfoView subj={subj} students={students[subj.id]||[]} assignments={assignments} scores={scores} qinfo={qinfo} setQinfo={setQinfo}/>}
      {view==="settings" && <SettingsView subjects={subjects} students={students} setStudents={setStudents} logoUrl={logoUrl} setLogoUrl={setLogoUrl}/>}
    </main>
  </div>
  </PersistCtx.Provider>;
}

/* ---------- HOME ---------- */
function HomeView({subjects,setSubjects,openSubject,students,setStudents}){
  const persist=usePersist();
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({name:"",code:"",room:"",color:CARD_COLORS[0]});
  const openAdd=()=>{ setForm({name:"",code:"",room:"",color:CARD_COLORS[subjects.length%CARD_COLORS.length]}); setModal({mode:"add"}); };
  const openEdit=(s)=>{ setForm({...s}); setModal({mode:"edit",id:s.id}); };
  const save=()=>{
    if(!form.name.trim()) return;
    if(modal.mode==="add"){ const id=uid(); const rec={...form,id,createdAt:Date.now()};
      setSubjects([...subjects,rec]); setStudents(p=>({...p,[id]:[]})); persist.addSubject(rec);
    } else { setSubjects(subjects.map(s=>s.id===modal.id?{...s,...form}:s)); persist.updateSubject(modal.id,form); }
    setModal(null);
  };
  const remove=(id)=>{ if(!window.confirm("ลบรายวิชานี้และข้อมูลทั้งหมด?")) return;
    setSubjects(subjects.filter(s=>s.id!==id)); persist.deleteSubject(id); };
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <h2 style={{margin:0,fontSize:19,color:C.navy}}>รายวิชาที่รับผิดชอบ</h2>
      <Btn variant="accent" onClick={openAdd}><Plus size={17}/>เพิ่มวิชา</Btn>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:12}}>
      {subjects.map(s=><div key={s.id} style={{background:"#fff",border:"1px solid "+C.border,borderRadius:12,overflow:"hidden"}}>
        <div onClick={()=>openSubject(s.id)} style={{cursor:"pointer"}}>
          <div style={{height:6,background:s.color}}/>
          <div style={{padding:"14px 16px"}}>
            <div style={{fontSize:12,color:SUB,fontWeight:600}}>{s.code||"—"}</div>
            <div style={{fontSize:17,fontWeight:700,color:C.navy,margin:"2px 0 6px"}}>{s.name}</div>
            <div style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:13,color:SUB,background:C.navySoft,padding:"3px 9px",borderRadius:20}}>ห้อง {s.room||"—"} · {(students[s.id]||[]).length} คน</div>
          </div>
        </div>
        <div style={{display:"flex",borderTop:"1px solid "+C.border}}>
          <button onClick={()=>openEdit(s)} style={cardActBtn}><Pencil size={15}/>แก้ไข</button>
          <button onClick={()=>remove(s.id)} style={{...cardActBtn,color:"#c0392b",borderLeft:"1px solid "+C.border}}><Trash2 size={15}/>ลบ</button>
        </div>
      </div>)}
      {subjects.length===0 && <EmptyHint text="ยังไม่มีรายวิชา กดปุ่ม “เพิ่มวิชา”"/>}
    </div>
    <Modal open={!!modal} onClose={()=>setModal(null)} title={modal&&modal.mode==="add"?"เพิ่มรายวิชา":"แก้ไขรายวิชา"}>
      <Field label="ชื่อวิชา"><input style={inputStyle} value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="เช่น วิทยาการคำนวณ"/></Field>
      <Field label="รหัสวิชา"><input style={inputStyle} value={form.code} onChange={e=>setForm({...form,code:e.target.value})} placeholder="เช่น ว21104"/></Field>
      <Field label="ห้องเรียน"><input style={inputStyle} value={form.room} onChange={e=>setForm({...form,room:e.target.value})} placeholder="เช่น ม.1/1"/></Field>
      <Field label="สีประจำวิชา"><div style={{display:"flex",gap:8}}>
        {CARD_COLORS.map(c=><button key={c} onClick={()=>setForm({...form,color:c})} style={{width:30,height:30,borderRadius:8,background:c,cursor:"pointer",border:form.color===c?"3px solid "+C.navy:"2px solid #fff",outline:form.color===c?"1px solid "+C.navy:"none"}}/>)}
      </div></Field>
      <Btn variant="primary" onClick={save} style={{width:"100%"}}><Save size={16}/>บันทึก</Btn>
    </Modal>
  </div>;
}

/* ---------- ATTENDANCE ---------- */
function AttendanceView({subj,students,attendance,setAttendance}){
  const persist=usePersist();
  const [date,setDate]=useState(todayStr());
  const dayData = (attendance[subj.id]&&attendance[subj.id][date])||{};
  const setStatus=(studentId,status)=>{
    const cur=(attendance[subj.id]&&attendance[subj.id][date])||{};
    const day={...cur};
    if(day[studentId]===status) delete day[studentId]; else day[studentId]=status;
    setAttendance(p=>({...p,[subj.id]:{...(p[subj.id]||{}),[date]:day}}));
    persist.setAttendanceDay(subj.id,date,day);
  };
  const markAll=(status)=>{ const day={}; students.forEach(s=>day[s.id]=status);
    setAttendance(p=>({...p,[subj.id]:{...(p[subj.id]||{}),[date]:day}})); persist.setAttendanceDay(subj.id,date,day); };
  const counts=useMemo(()=>{ const c={present:0,absent:0,personal:0,sick:0,skip:0};
    Object.values(dayData).forEach(v=>{ if(c[v]!=null) c[v]++; }); return c; },[dayData]);
  const exportXlsx=()=>{
    const subjA=attendance[subj.id]||{}; const dates=Object.keys(subjA).sort();
    const header=["เลขที่","ชื่อ-สกุล",...dates.map(fmtDate),"สถานะนักเรียน"];
    const rows=students.map(s=>[s.number,s.name,...dates.map(d=>(subjA[d]&&subjA[d][s.id])?STATUS[subjA[d][s.id]].label:""),stuStatusOf(s).label]);
    const ws=XLSX.utils.aoa_to_sheet([header,...rows]);
    ws["!cols"]=[{wch:7},{wch:26},...dates.map(()=>({wch:10})),{wch:14}];
    markStatusRows(ws,students,header.length);
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"เช็คชื่อ");
    XLSX.writeFile(wb,"เช็คชื่อ_"+subj.name+"_"+subj.room+".xlsx");
  };
  return <div>
    <SectionHead title="เช็คชื่อ" right={<Btn variant="accent" size="sm" onClick={exportXlsx}><Download size={15}/>Export .xlsx</Btn>}/>
    <div style={{background:"#fff",border:"1px solid "+C.border,borderRadius:12,padding:14,marginBottom:12}}>
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:13,fontWeight:600,color:SUB}}>วันที่</span>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...inputStyle,width:"auto",padding:"8px 10px"}}/>
      </div>

/* ---------- ค้นหานักเรียน (ใช้ร่วมกัน: โหมดกรอกเร็ว / กรองตาราง / เทียบ Q-Info) ---------- */
const NAME_PREFIX=/^(เด็กชาย|เด็กหญิง|นางสาว|นาย|นาง|ด\.ช\.|ด\.ญ\.|น\.ส\.)\s*/;
const normName=(s)=>String(s||"").trim().replace(NAME_PREFIX,"").replace(/\s+/g,"").toLowerCase();
const isNum=(v)=>/^-?\d+(\.\d+)?$/.test(String(v).trim());
const numOf=(v)=>{ if(v==null||v==="") return null; const t=String(thaiToNumber(String(v).trim())); return isNum(t)?Number(t):null; };
/* แยก "คำค้น + คะแนน" เช่น "12 8" → เลขที่ 12 ได้ 8 , "สมชาย 7.5" , "เลขที่ห้า แปด" */
function parseQuick(text){
  const t=String(text||"").replace(/เลขที่|คะแนน|ได้/g," ").trim(); if(!t) return {query:"",score:null};
  const parts=t.split(/\s+/);
  if(parts.length>=2){ const last=String(thaiToNumber(parts[parts.length-1])); if(isNum(last)) return {query:parts.slice(0,-1).join(" "),score:last}; }
  return {query:t,score:null};
}
function findStudents(students,query){
  const q=String(query||"").trim(); if(!q) return students;
  const qn=String(thaiToNumber(q));
  if(/^\d+$/.test(qn)) return students.filter(s=>String(s.number)===qn);       // พิมพ์ตัวเลข = ค้นเลขที่ (ตรงตัว)
  const nq=normName(q); const first=[],other=[];
  students.forEach(s=>{
    const n=normName(s.name); const i=n.indexOf(nq); if(i<0) return;
    const words=String(s.name).replace(NAME_PREFIX,"").trim().toLowerCase().split(/\s+/);
    if(i===0 || words.some(w=>w.startsWith(nq))) first.push(s); else other.push(s);   // ขึ้นต้นชื่อ/นามสกุล มาก่อน
  });
  return [...first,...other];
}

/* ---------- โหมดกรอกเร็ว: ค้นชื่อ/เลขที่ → กรอกคะแนน → Enter ---------- */
function QuickScore({students,list,subjScores,setScore,onAddAssignment}){
  const [aid,setAid]=useState(()=>{ try{ return localStorage.getItem("tl_qs_aid")||""; }catch(e){ return ""; } });
  useEffect(()=>{ if(list.length && !list.find(a=>a.id===aid)) setAid(list[list.length-1].id); },[list,aid]);
  useEffect(()=>{ try{ localStorage.setItem("tl_qs_aid",aid); }catch(e){} },[aid]);
  const asg=list.find(a=>a.id===aid);
  const [q,setQ]=useState(""); const [hi,setHi]=useState(0);
  const [sel,setSel]=useState(null); const [val,setVal]=useState("");
  const [onlyEmpty,setOnlyEmpty]=useState(false);
  const [autoNext,setAutoNextRaw]=useState(()=>{ try{ return localStorage.getItem("tl_qs_next")==="1"; }catch(e){ return false; } });
  const setAutoNext=(v)=>{ setAutoNextRaw(v); try{ localStorage.setItem("tl_qs_next",v?"1":"0"); }catch(e){} };
  const [msg,setMsg]=useState(null); const [recent,setRecent]=useState([]);
  const [listening,setListening]=useState(false);
  const searchRef=useRef(null), valRef=useRef(null), listRef=useRef(null);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  const curOf=(sid,a=aid)=>{ const r=subjScores[sid]; const v=r&&r[a]; return (v==null||v==="")?null:v; };
  const countDone=(a)=>students.filter(s=>curOf(s.id,a)!=null).length;
  const done=asg?countDone(aid):0;
  const parsed=useMemo(()=>parseQuick(q),[q]);
  const matches=useMemo(()=>{
    if(!parsed.query) return onlyEmpty?students.filter(s=>curOf(s.id)==null&&isNormalStu(s)):students;
    return findStudents(students,parsed.query);
  },[students,parsed.query,onlyEmpty,subjScores,aid]);
  useEffect(()=>setHi(0),[parsed.query,onlyEmpty]);
  useEffect(()=>{ const el=listRef.current&&listRef.current.querySelector(".qs-row.hi"); if(el&&el.scrollIntoView) el.scrollIntoView({block:"nearest"}); },[hi]);
  useEffect(()=>{ if(!msg) return; const t=setTimeout(()=>setMsg(null),2600); return ()=>clearTimeout(t); },[msg]);
  useEffect(()=>{ if(sel) setTimeout(()=>{ if(valRef.current){ valRef.current.focus(); valRef.current.select(); } },40); },[sel]);
  const chipsRef=useRef(null);
  useEffect(()=>{ const el=chipsRef.current&&chipsRef.current.querySelector(".qs-chip.on"); if(el&&chipsRef.current) chipsRef.current.scrollLeft=el.offsetLeft-chipsRef.current.offsetLeft-8; },[aid,list.length]);

  const focusSearch=()=>setTimeout(()=>searchRef.current&&searchRef.current.focus(),40);
  const pick=(s)=>{ setSel(s.id); const c=curOf(s.id); setVal(c==null?"":String(c)); };
  const stName=(sid)=>{ const s=students.find(x=>x.id===sid); return s?(s.number+". "+s.name):""; };

  const commit=(sid,raw)=>{
    if(!asg){ setMsg({ok:false,text:"เลือกงานที่จะกรอกก่อน"}); return false; }
    const t=String(raw==null?"":raw).trim(); const prev=curOf(sid);
    if(t===""){ setScore(sid,aid,""); setMsg({ok:true,text:"ลบคะแนน "+stName(sid)});
      setRecent(r=>[{k:uid(),sid,aid,prev,v:""},...r].slice(0,6)); return true; }
    const conv=String(thaiToNumber(t));
    if(!isNum(conv)||Number(conv)<0){ setMsg({ok:false,text:"กรอกเป็นตัวเลขเท่านั้น"}); return false; }
    if(asg.max && Number(conv)>Number(asg.max)){ setMsg({ok:false,text:"เกินคะแนนเต็ม ("+asg.max+")"}); return false; }
    setScore(sid,aid,conv);
    setMsg({ok:true,text:stName(sid)+"  →  "+conv+(asg.max?" / "+asg.max:"")});
    setRecent(r=>[{k:uid(),sid,aid,prev,v:conv},...r].slice(0,6));
    return true;
  };
  const nextEmpty=(afterSid)=>{ const idx=students.findIndex(s=>s.id===afterSid);
    for(let k=1;k<students.length;k++){ const s=students[(idx+k)%students.length]; if(s.id!==afterSid && curOf(s.id)==null && isNormalStu(s)) return s; } return null; };
  const afterCommit=(sid)=>{
    setQ("");
    if(autoNext){ const n=nextEmpty(sid); if(n){ pick(n); return; } setMsg({ok:true,text:"กรอกครบทุกคนแล้ว"}); }
    setSel(null); focusSearch();
  };
  // Enter ในช่องค้นหา: "เลขที่/ชื่อ + คะแนน" และเจอคนเดียว → บันทึกทันที, ไม่งั้นเลือกคนที่ไฮไลต์
  const handleText=(text,hiIdx=0)=>{
    const p=parseQuick(text); const m=p.query?findStudents(students,p.query):matches;
    if(p.score!=null && m.length===1 && !isNormalStu(m[0])){ pick(m[0]); setVal(String(p.score)); setMsg({ok:false,text:"⚠ "+m[0].name+" สถานะ "+stuStatusOf(m[0]).label+" — ตรวจสอบก่อนบันทึก"}); return; }
    if(p.score!=null && m.length===1){ if(commit(m[0].id,p.score)){ setQ(""); focusSearch(); } return; }
    if(p.score!=null && m.length>1){ setMsg({ok:false,text:"พบ "+m.length+" คน — พิมพ์ชื่อให้ชัดขึ้น หรือใช้เลขที่"}); return; }
    if(m.length>0) pick(m[Math.min(hiIdx,m.length-1)]);
    else setMsg({ok:false,text:"ไม่พบนักเรียน"});
  };
  const onSearchKey=(e)=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); setHi(h=>Math.min(h+1,matches.length-1)); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); setHi(h=>Math.max(h-1,0)); }
    else if(e.key==="Enter"){ e.preventDefault(); handleText(q,hi); }
    else if(e.key==="Escape"){ setQ(""); }
  };
  const onValKey=(e)=>{
    if(e.key==="Enter"){ e.preventDefault(); if(commit(sel,val)) afterCommit(sel); }
    else if(e.key==="Escape"){ e.preventDefault(); setSel(null); focusSearch(); }
  };
  const listen=()=>{
    if(!SR) return; if(listening) return;
    const r=new SR(); r.lang="th-TH"; r.interimResults=false; r.maxAlternatives=1;
    r.onresult=(ev)=>{ const t=ev.results[0][0].transcript; setQ(t); handleText(t,0); };
    r.onend=()=>setListening(false); r.onerror=()=>setListening(false);
    setListening(true); try{ r.start(); }catch(e){ setListening(false); }
  };
  const undo=(it)=>{ setScore(it.sid,it.aid,it.prev==null?"":it.prev); setRecent(r=>r.filter(x=>x.k!==it.k)); setMsg({ok:true,text:"ย้อนกลับ "+stName(it.sid)}); };

  if(!list.length) return <div style={{...panel,textAlign:"center",color:SUB,padding:28}}>
    <div style={{marginBottom:12}}>ยังไม่มีหัวข้องาน — สร้างงานก่อนเริ่มกรอกคะแนน</div>
    <Btn variant="accent" onClick={onAddAssignment}><Plus size={16}/>เพิ่มงาน</Btn></div>;

  const pad = asg && Number(asg.max)>0 && Number(asg.max)<=20 && Number.isInteger(Number(asg.max)) ? Array.from({length:Number(asg.max)+1},(_,i)=>i) : null;
  const selStu = sel && students.find(s=>s.id===sel);
  const pct = students.length?Math.round(done/students.length*100):0;

  return <div>
    {/* 1) เลือกงาน */}
    <div className="qs-chips" ref={chipsRef}>
      {list.map(a=>{ const d=countDone(a.id); return <button key={a.id} className={"qs-chip"+(a.id===aid?" on":"")} onClick={()=>{ setAid(a.id); setSel(null); focusSearch(); }} title={a.title}>
        <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:176}}>{a.title}</span>
        <small>เต็ม {a.max} · กรอกแล้ว {d}/{students.length}</small></button>; })}
    </div>

    {/* 2) ช่องค้นหา (ติดขอบบนตอนเลื่อน) */}
    <div className="qs-sticky">
      <div className="qs-search">
        <Search size={20}/>
        <input ref={searchRef} value={q} onChange={e=>setQ(e.target.value)} onKeyDown={onSearchKey} autoFocus
          placeholder="พิมพ์เลขที่ หรือชื่อ (เช่น 12 หรือ สมชาย)" enterKeyHint="go" autoComplete="off"/>
        {q && <button className="qs-iconbtn" style={{background:"transparent"}} onClick={()=>{setQ("");focusSearch();}} title="ล้าง"><X size={18}/></button>}
        {SR && <button className={"qs-iconbtn"+(listening?" rec":"")} onClick={listen} title="พูดชื่อ/เลขที่ + คะแนน เช่น “เลขที่ห้า แปด”"><Mic size={19}/></button>}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8,flexWrap:"wrap"}}>
        <div style={{flex:"1 1 160px",display:"flex",alignItems:"center",gap:8}}>
          <div style={{flex:1,height:7,background:"#dde3ea",borderRadius:9,overflow:"hidden"}}><div style={{width:pct+"%",height:"100%",background:pct===100?"#2e7d52":C.accent,transition:"width .3s"}}/></div>
          <span style={{fontSize:12.5,color:SUB,fontWeight:600,whiteSpace:"nowrap"}}>{done}/{students.length}</span>
        </div>
        <label style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:C.navy,fontWeight:600,cursor:"pointer"}}><input type="checkbox" checked={onlyEmpty} onChange={e=>setOnlyEmpty(e.target.checked)}/>เฉพาะที่ยังไม่กรอก</label>
        <label style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:C.navy,fontWeight:600,cursor:"pointer"}} title="บันทึกแล้วข้ามไปคนถัดไปที่ยังไม่มีคะแนน"><input type="checkbox" checked={autoNext} onChange={e=>setAutoNext(e.target.checked)}/>ไปคนถัดไปอัตโนมัติ</label>
      </div>
      <div className="qs-hint-desk" style={{fontSize:12,color:SUB,marginTop:6}}>
        ทางลัด: พิมพ์ <b>“12 8”</b> แล้ว <kbd>Enter</kbd> = เลขที่ 12 ได้ 8 ทันที · <kbd>↑</kbd><kbd>↓</kbd> เลือกคน · <kbd>Enter</kbd> เปิดช่องคะแนน · <kbd>Esc</kbd> ยกเลิก
      </div>
    </div>

    {/* 3) แผงกรอกคะแนนของคนที่เลือก */}
    {selStu && <div className="qs-overlay" onMouseDown={e=>{ if(e.target===e.currentTarget){ setSel(null); focusSearch(); } }}><div className="qs-panel qs-modal">
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
        <div className="qs-no" style={{background:C.accent,color:"#fff"}}>{selStu.number}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:16.5,color:C.navy,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{selStu.name}</div>
          <div style={{fontSize:12.5,color:SUB}}>{asg&&asg.title} · เต็ม {asg&&asg.max}{curOf(selStu.id)!=null?" · เดิม "+curOf(selStu.id):""}</div>
        </div>
        <button className="qs-iconbtn" onClick={()=>{setSel(null);focusSearch();}} title="ปิด (Esc)"><X size={18}/></button>
      </div>
      {!isNormalStu(selStu) && <div className="qs-warn" style={{background:stuStatusOf(selStu).bg,color:stuStatusOf(selStu).color,borderColor:stuStatusOf(selStu).color}}>⚠ นักเรียนคนนี้สถานะ “{stuStatusOf(selStu).label}” — ไม่ใช่สถานะปกติ โปรดตรวจสอบก่อนกรอกคะแนน</div>}
      <div style={{display:"flex",gap:8}}>
        <input ref={valRef} className="qs-big" type="text" inputMode="decimal" enterKeyHint="done" value={val} onChange={e=>setVal(e.target.value)} onKeyDown={onValKey} placeholder="คะแนน"/>
        <Btn variant="accent" onClick={()=>{ if(commit(sel,val)) afterCommit(sel); }} style={{padding:"0 18px",fontSize:16}}><Save size={18}/>บันทึก</Btn>
      </div>
      {pad && <div className="qs-pad">{pad.map(n=><button key={n} className={String(val)===String(n)?"on":""} onClick={()=>{ if(commit(sel,n)) afterCommit(sel); }}>{n}</button>)}</div>}
      {curOf(selStu.id)!=null && <button onClick={()=>{ if(commit(sel,"")) afterCommit(sel); }} style={{marginTop:10,background:"none",border:"none",color:"#c0392b",fontFamily:"inherit",fontSize:13,fontWeight:600,cursor:"pointer",padding:0}}>ลบคะแนนของคนนี้</button>}
    </div></div>}

    {/* 4) รายชื่อที่ค้นพบ */}
    <div ref={listRef} style={{...tableWrap,overflow:"hidden"}}>
      {matches.map((s,i)=>{ const v=curOf(s.id); return <button key={s.id} className={"qs-row"+(i===hi&&!sel?" hi":"")} onClick={()=>pick(s)} style={s.id===sel?{background:C.accentSoft}:null}>
        <div className="qs-no">{s.number}</div>
        <div style={{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",opacity:isNormalStu(s)?1:.7}}>{s.name}</div>
        {!isNormalStu(s) && <span className="qs-badge" style={{background:stuStatusOf(s).bg,color:stuStatusOf(s).color}}>{stuStatusOf(s).label}</span>}
        <div className="qs-score" style={v!=null?{background:"#e6f4ec",color:"#2e7d52"}:{background:"#f1f4f8",color:"#a0aab5"}}>{v!=null?v:"–"}</div>
      </button>; })}
      {matches.length===0 && <div style={{padding:24,textAlign:"center",color:SUB,fontSize:14}}>{onlyEmpty&&!parsed.query?"กรอกครบทุกคนแล้ว":"ไม่พบนักเรียนที่ค้นหา"}</div>}
    </div>

    {/* 5) ล่าสุด + ย้อนกลับ */}
    {recent.length>0 && <div style={{...panel,marginTop:12,padding:12}}>
      <div style={{fontSize:13,fontWeight:700,color:C.navy,marginBottom:6}}>บันทึกล่าสุด</div>
      {recent.map(it=>{ const a=list.find(x=>x.id===it.aid); return <div key={it.k} style={{display:"flex",alignItems:"center",gap:8,fontSize:13.5,padding:"5px 0",borderTop:"1px solid #eef2f7"}}>
        <span style={{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{stName(it.sid)} <span style={{color:SUB}}>· {a?a.title:""}</span></span>
        <b style={{color:C.accent}}>{it.v===""?"ลบ":it.v}</b>
        <button onClick={()=>undo(it)} title="ย้อนกลับ" style={{display:"flex",alignItems:"center",gap:3,background:C.navySoft,border:"none",borderRadius:6,padding:"3px 8px",cursor:"pointer",color:C.navy,fontFamily:"inherit",fontSize:12,fontWeight:600}}><Undo size={13}/>ย้อน</button>
      </div>; })}
    </div>}

    {msg && <div className="qs-toast" style={{background:msg.ok?"#2e7d52":"#c0392b"}}>{msg.text}</div>}
  </div>;
}

/* ==================== สรุปงานค้างแจ้งนักเรียน ====================
   งานค้าง = ช่องคะแนนว่าง หรือไม่ใช่ตัวเลข (เช่น ร, มส) · เลือกนับ 0 เป็นงานค้างได้
   ส่งออก: ข้อความสำหรับไลน์ (รายบุคคล / ทั้งห้อง) และหน้าพิมพ์ A4 (บันทึกเป็น PDF ได้)
------------------------------------------------------------------ */
const escHtml=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDateLong=(s)=>{ if(!s) return ""; const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"}); };
const firstName=(name)=>String(name||"").replace(NAME_PREFIX,"").trim().split(/\s+/)[0]||name;
function pendingList(students,list,subjScores,countZero){
  return students.map(s=>{ const sc=subjScores[s.id]||{};
    const miss=list.filter(a=>{ const v=sc[a.id]; if(v==null||String(v).trim()==="") return true;
      const n=numOf(v); if(n==null) return true; return countZero && n===0; });
    return {s,miss}; });
}
function pendingNoteOf(v){ const t=String(v==null?"":v).trim(); return t&&numOf(t)==null?t:""; }   // เช่น "ร", "มส"

/* เปิดหน้าต่างพิมพ์ (ผู้ใช้เลือก "บันทึกเป็น PDF" ได้) */
function openPrint(title,bodyHtml){
  const w=window.open("","_blank");
  if(!w){ alert("เบราว์เซอร์บล็อกหน้าต่างใหม่ — อนุญาต Pop-up สำหรับเว็บนี้ก่อน"); return; }
  w.document.open();
  w.document.write(`<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escHtml(title)}</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
 @page{ size:A4; margin:14mm 15mm; }
 *{ box-sizing:border-box; }
 body{ font-family:'Sarabun','TH SarabunPSK',sans-serif; font-size:14.5pt; line-height:1.45; color:#000; margin:0; background:#fff; }
 .bar{ position:sticky; top:0; background:#1f3a5f; color:#fff; padding:10px 16px; display:flex; gap:10px; align-items:center; font-size:12pt; }
 .bar button{ font-family:inherit; font-size:12pt; padding:6px 16px; border:none; border-radius:6px; background:#c2703d; color:#fff; cursor:pointer; font-weight:600; }
 .page{ max-width:180mm; margin:0 auto; padding:10mm 0; }
 h1{ font-size:18pt; text-align:center; margin:0 0 2pt; }
 .sub{ text-align:center; margin:0 0 10pt; }
 .logo{ display:block; margin:0 auto 4pt; width:52px; height:52px; object-fit:contain; }
 table{ width:100%; border-collapse:collapse; margin:6pt 0; }
 th,td{ border:1px solid #333; padding:3pt 6pt; vertical-align:top; }
 th{ background:#eee; font-weight:700; text-align:center; }
 td.c{ text-align:center; }
 .meta{ margin:6pt 0; }
 .sign{ display:flex; justify-content:space-around; gap:10pt; margin-top:18pt; text-align:center; }
 .sign div{ min-width:52mm; }
 .slip{ border:1px solid #333; border-radius:6px; padding:8pt 12pt; margin-bottom:8mm; break-inside:avoid; page-break-inside:avoid; position:relative; }
 .slip:after{ content:"✂ - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -"; position:absolute; left:0; right:0; bottom:-6.5mm; font-size:9pt; color:#999; white-space:nowrap; overflow:hidden; }
 .slip h2{ font-size:15.5pt; margin:0; text-align:center; }
 .slip .sign{ margin-top:10pt; }
 .small{ font-size:12pt; color:#333; }
 @media print{ .bar{ display:none; } .page{ padding:0; } }
</style></head><body>
<div class="bar"><b style="flex:1">${escHtml(title)}</b><button onclick="window.print()">พิมพ์ / บันทึกเป็น PDF</button></div>
<div class="page">${bodyHtml}</div>
<script>(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){setTimeout(function(){window.print();},350);});<\/script>
</body></html>`);
  w.document.close();
}

function PendingView({subj,students,assignments,scores,logoUrl}){
  const list=assignments[subj.id]||[];
  const subjScores=scores[subj.id]||{};
  const LS=(k,d)=>{ try{ const v=localStorage.getItem("tl_pd_"+k); return v==null?d:v; }catch(e){ return d; } };
  const setLS=(k,v)=>{ try{ localStorage.setItem("tl_pd_"+k,v); }catch(e){} };
  const [mode,setMode]=useState(()=>LS("mode","class"));               // class | person
  const [groupBy,setGroupBy]=useState(()=>LS("group","student"));      // student | work
  const [picked,setPicked]=useState(()=>new Set(list.map(a=>a.id)));
  useEffect(()=>{ setPicked(p=>{ const n=new Set(p); list.forEach(a=>{ if(!known.current.has(a.id)){ n.add(a.id); known.current.add(a.id);} }); return n; }); },[list]);
  const known=useRef(new Set(list.map(a=>a.id)));
  const [countZero,setCountZero]=useState(()=>LS("zero","0")==="1");
  const [shortName,setShortName]=useState(()=>LS("short","0")==="1");
  const [due,setDue]=useState("");
  const [note,setNote]=useState(()=>LS("note","ขอให้นักเรียนติดตามส่งงานให้ครบถ้วน"));
  const [teacher,setTeacher]=useState(()=>LS("teacher","นายนนทพัทธ์ หิรัญเรือง"));
  const [school,setSchool]=useState(()=>LS("school","โรงเรียนกระดุมทองวิทยา"));
  const [q,setQ]=useState(""); const [cur,setCur]=useState(null);
  const [toast,setToast]=useState(null);
  useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(null),2600); return ()=>clearTimeout(t); },[toast]);

  const chosen=list.filter(a=>picked.has(a.id));
  const rows=useMemo(()=>pendingList(students,chosen,subjScores,countZero),[students,chosen.map(a=>a.id).join(),subjScores,countZero]);
  const late=rows.filter(r=>r.miss.length);
  const totalMiss=late.reduce((t,r)=>t+r.miss.length,0);
  const byWork=chosen.map(a=>({a,who:rows.filter(r=>r.miss.includes(a)).map(r=>r.s)})).filter(x=>x.who.length);
  const dn=(s)=>shortName?firstName(s.name):s.name;
  const today=fmtDateLong(todayStr());
  const subjLine=subj.name+(subj.code?" ("+subj.code+")":"")+" ห้อง "+subj.room;

  /* ---------- ข้อความไลน์ ---------- */
  const tail=()=>{ const t=[]; if(due) t.push("กำหนดส่งภายใน "+fmtDateLong(due)); if(note.trim()) t.push(note.trim()); if(teacher.trim()) t.push("— "+teacher.trim()); return t.length?"\n"+t.join("\n"):""; };
  const textClass=()=>{
    const head="แจ้งงานค้าง วิชา"+subjLine+"\nข้อมูล ณ วันที่ "+today+"\n";
    if(!late.length) return head+"\nนักเรียนส่งงานครบทุกคน ขอบคุณครับ/ค่ะ"+tail();
    let body="";
    if(groupBy==="work") body=byWork.map(x=>"■ "+x.a.title+" (ค้าง "+x.who.length+" คน)\n   เลขที่ "+x.who.map(s=>s.number).join(", ")+(shortName?"":"\n"+x.who.map(s=>"   - "+s.number+" "+s.name).join("\n"))).join("\n\n");
    else body=late.map(r=>"เลขที่ "+r.s.number+" "+dn(r.s)+" (ค้าง "+r.miss.length+")\n"+r.miss.map(a=>"   - "+a.title).join("\n")).join("\n\n");
    return head+"\n"+body+"\n\nสรุป: ค้างงาน "+late.length+" คน · ส่งครบ "+(rows.length-late.length)+" คน"+tail();
  };
  const textPerson=(r)=>{
    const head="แจ้งงานค้าง วิชา"+subjLine+"\nถึง เลขที่ "+r.s.number+" "+r.s.name+"\nข้อมูล ณ วันที่ "+today+"\n";
    if(!r.miss.length) return head+"\nส่งงานครบแล้ว เยี่ยมมาก"+tail();
    const sc=subjScores[r.s.id]||{};
    return head+"\nงานที่ยังค้าง "+r.miss.length+" งาน\n"+r.miss.map((a,i)=>(i+1)+". "+a.title+" (เต็ม "+a.max+")"+(pendingNoteOf(sc[a.id])?" ["+pendingNoteOf(sc[a.id])+"]":"")).join("\n")+tail();
  };
  const copy=async(text,label)=>{ const ok=await copyText(text); setToast({ok,text:ok?"คัดลอกแล้ว — "+label+" (วางในไลน์ได้เลย)":"คัดลอกไม่สำเร็จ"}); };

  /* ---------- หน้าพิมพ์ ---------- */
  const headHtml=(title)=>(logoUrl?`<img class="logo" src="${escHtml(logoUrl)}">`:"")+`<h1>${escHtml(title)}</h1><div class="sub">${escHtml(school)}<br>รายวิชา ${escHtml(subjLine)} · ข้อมูล ณ วันที่ ${escHtml(today)}</div>`;
  const footHtml=()=>`<div class="meta">${due?`<b>กำหนดส่ง</b> ภายใน ${escHtml(fmtDateLong(due))}<br>`:""}${note.trim()?`<b>หมายเหตุ</b> ${escHtml(note.trim())}`:""}</div>`;
  const signTeacher=`<div>ลงชื่อ ...................................... ครูผู้สอน<br>( ${escHtml(teacher||"......................................")} )</div>`;
  const printClass=()=>{
    let t;
    if(groupBy==="work") t=`<table><thead><tr><th style="width:8%">ที่</th><th>ชื่องาน</th><th style="width:10%">เต็ม</th><th style="width:10%">ค้าง (คน)</th><th style="width:38%">เลขที่ที่ยังไม่ส่ง</th></tr></thead><tbody>${
      byWork.map((x,i)=>`<tr><td class="c">${i+1}</td><td>${escHtml(x.a.title)}</td><td class="c">${escHtml(x.a.max)}</td><td class="c">${x.who.length}</td><td>${x.who.map(s=>s.number).join(", ")}</td></tr>`).join("")||`<tr><td colspan="5" class="c">ไม่มีงานค้าง</td></tr>`}</tbody></table>`;
    else t=`<table><thead><tr><th style="width:7%">ที่</th><th style="width:8%">เลขที่</th><th style="width:32%">ชื่อ-สกุล</th><th style="width:9%">จำนวน</th><th>งานที่ยังค้าง</th></tr></thead><tbody>${
      late.map((r,i)=>`<tr><td class="c">${i+1}</td><td class="c">${r.s.number}</td><td>${escHtml(dn(r.s))}</td><td class="c">${r.miss.length}</td><td>${r.miss.map(a=>escHtml(a.title)).join(", ")}</td></tr>`).join("")||`<tr><td colspan="5" class="c">นักเรียนส่งงานครบทุกคน</td></tr>`}</tbody></table>`;
    const sum=`<div class="meta">สรุป: นักเรียนทั้งหมด ${rows.length} คน · ค้างงาน <b>${late.length}</b> คน (รวม ${totalMiss} งาน) · ส่งครบ ${rows.length-late.length} คน · งานที่นำมาตรวจ ${chosen.length} งาน</div>`;
    openPrint("สรุปงานค้าง "+subj.name+" "+subj.room, headHtml("แบบสรุปรายชื่อนักเรียนที่มีงานค้าง")+sum+t+footHtml()+`<div class="sign">${signTeacher}</div>`);
  };
  const slipHtml=(r)=>{ const sc=subjScores[r.s.id]||{};
    return `<div class="slip"><h2>ใบแจ้งงานค้าง</h2><div class="sub small">${escHtml(school)} · รายวิชา ${escHtml(subjLine)} · ณ วันที่ ${escHtml(today)}</div>
    <div><b>ชื่อ-สกุล</b> ${escHtml(r.s.name)} &nbsp; <b>เลขที่</b> ${r.s.number} &nbsp; <b>ค้าง</b> ${r.miss.length} งาน</div>
    <table><thead><tr><th style="width:9%">ที่</th><th>งานที่ยังไม่ส่ง / ต้องแก้ไข</th><th style="width:10%">เต็ม</th><th style="width:27%">วันที่ส่ง / ครูตรวจ</th></tr></thead><tbody>${
      r.miss.map((a,i)=>`<tr><td class="c">${i+1}</td><td>${escHtml(a.title)}${pendingNoteOf(sc[a.id])?` <span class="small">[${escHtml(pendingNoteOf(sc[a.id]))}]</span>`:""}</td><td class="c">${escHtml(a.max)}</td><td></td></tr>`).join("")}</tbody></table>
    ${footHtml()}<div class="sign small"><div>ลงชื่อ ..............................<br>นักเรียน</div><div>ลงชื่อ ..............................<br>ผู้ปกครอง</div><div>ลงชื่อ ..............................<br>( ${escHtml(teacher||"..............................")} )<br>ครูผู้สอน</div></div></div>`; };
  const printSlips=(rs)=>{ const list2=rs.filter(r=>r.miss.length);
    if(!list2.length) return setToast({ok:false,text:"ไม่มีงานค้าง"});
    openPrint("ใบแจ้งงานค้างรายบุคคล "+subj.name+" "+subj.room+(list2.length>1?" ("+list2.length+" คน)":""), list2.map(slipHtml).join("")); };

  const setModeP=(m)=>{ setMode(m); setLS("mode",m); };
  const toggle=(id)=>setPicked(p=>{ const n=new Set(p); n.has(id)?n.delete(id):n.add(id); return n; });
  const found=useMemo(()=>{ const base=q.trim()?findStudents(students,q):students; return base.map(s=>rows.find(r=>r.s.id===s.id)).filter(Boolean); },[q,students,rows]);
  const curRow=cur&&rows.find(r=>r.s.id===cur);
  const lateIdx=curRow?late.findIndex(r=>r.s.id===cur):-1;
  const step=(d)=>{ if(!late.length) return; const i=lateIdx<0?0:(lateIdx+d+late.length)%late.length; setCur(late[i].s.id); };
  const chipStyle=(on)=>({fontSize:12.5,padding:"5px 10px",borderRadius:20,cursor:"pointer",fontFamily:"inherit",fontWeight:600,border:"1px solid "+(on?C.navy:C.border),background:on?C.navy:"#fff",color:on?"#fff":SUB});
  const miniBtn={display:"flex",alignItems:"center",gap:4,background:C.navySoft,border:"none",borderRadius:7,padding:"6px 9px",cursor:"pointer",color:C.navy,fontFamily:"inherit",fontSize:12.5,fontWeight:600};

/* ---------- NOTES ---------- */
function NotesView({subj,notes,setNotes}){
  const persist=usePersist();
  const list=(notes[subj.id]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({date:todayStr(),text:""});
  const [filterFrom,setFilterFrom]=useState(""); const [filterTo,setFilterTo]=useState(""); const [q,setQ]=useState("");
  const filtered=list.filter(n=>(!filterFrom||n.date>=filterFrom)&&(!filterTo||n.date<=filterTo)&&(!q||n.text.toLowerCase().includes(q.toLowerCase())));
  const save=()=>{ if(!form.text.trim()) return;
    if(modal.mode==="add"){ const rec={id:uid(),date:form.date,text:form.text.trim()};
      setNotes(p=>({...p,[subj.id]:[...(p[subj.id]||[]),rec]})); persist.addNote(subj.id,rec);
    } else { const upd={date:form.date,text:form.text.trim()};
      setNotes(p=>({...p,[subj.id]:(p[subj.id]||[]).map(n=>n.id===modal.id?{...n,...upd}:n)})); persist.updateNote(modal.id,upd); }
    setModal(null); };
  const remove=(id)=>{ if(!window.confirm("ลบบันทึกนี้?")) return;
    setNotes(p=>({...p,[subj.id]:(p[subj.id]||[]).filter(n=>n.id!==id)})); persist.deleteNote(id); };
  return <div>
    <SectionHead title="บันทึกช่วยจำ" right={<Btn variant="accent" size="sm" onClick={()=>{setForm({date:todayStr(),text:""});setModal({mode:"add"});}}><Plus size={16}/>เพิ่มบันทึก</Btn>}/>
    <div style={{background:"#fff",border:"1px solid "+C.border,borderRadius:12,padding:14,marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,border:"1px solid "+C.border,borderRadius:8,padding:"8px 10px"}}>
        <Search size={16}/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นหาข้อความในบันทึก..." style={{border:"none",outline:"none",flex:1,fontFamily:"inherit",fontSize:14}}/>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:13,color:SUB,fontWeight:600}}>ช่วงวันที่</span>
        <input type="date" value={filterFrom} onChange={e=>setFilterFrom(e.target.value)} style={{...inputStyle,width:"auto",padding:"7px 9px"}}/>
        <span style={{color:SUB}}>–</span>
        <input type="date" value={filterTo} onChange={e=>setFilterTo(e.target.value)} style={{...inputStyle,width:"auto",padding:"7px 9px"}}/>
        {(filterFrom||filterTo||q)&&<button onClick={()=>{setFilterFrom("");setFilterTo("");setQ("");}} style={{fontSize:12.5,color:C.accent,background:"none",border:"none",cursor:"pointer",fontWeight:600,fontFamily:"inherit"}}>ล้างตัวกรอง</button>}
      </div>
    </div>
    <div style={{display:"grid",gap:10}}>
      {filtered.map(n=><div key={n.id} style={{background:"#fff",border:"1px solid "+C.border,borderRadius:12,padding:"13px 15px",borderLeft:"4px solid "+C.accent}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <span style={{fontSize:13,fontWeight:700,color:C.navy,background:C.navySoft,padding:"3px 10px",borderRadius:20}}>{fmtDate(n.date)}</span>
          <div style={{display:"flex",gap:4}}>
            <button onClick={()=>{setForm({date:n.date,text:n.text});setModal({mode:"edit",id:n.id});}} style={{...miniIcon,background:C.navySoft,color:C.navy}}><Pencil size={14}/></button>
            <button onClick={()=>remove(n.id)} style={{...miniIcon,background:"#fbeae8",color:"#c0392b"}}><Trash2 size={14}/></button>
          </div>
        </div>
        <div style={{fontSize:14.5,lineHeight:1.55,whiteSpace:"pre-wrap"}}>{n.text}</div>
      </div>)}
      {filtered.length===0 && <EmptyHint text={list.length===0?"ยังไม่มีบันทึก กด “เพิ่มบันทึก”":"ไม่พบบันทึกตามตัวกรอง"}/>}
    </div>
    <Modal open={!!modal} onClose={()=>setModal(null)} title={modal&&modal.mode==="add"?"เพิ่มบันทึก":"แก้ไขบันทึก"}>
      <Field label="วันที่"><input type="date" style={inputStyle} value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
      <Field label="รายละเอียด"><textarea style={{...inputStyle,minHeight:120,resize:"vertical"}} value={form.text} onChange={e=>setForm({...form,text:e.target.value})} placeholder="พิมพ์บันทึกช่วยจำ..."/></Field>
      <Btn variant="primary" onClick={save} style={{width:"100%"}}><Save size={16}/>บันทึก</Btn>
    </Modal>
  </div>;
}

const indKey=(i)=>String(i.u)+"|"+String(i.s)+"|"+String(i.n);
const indLabel=(i)=>"หน่วย "+i.u+" · "+i.s+"/"+i.n;
const roundTo=(x,d)=>{ const f=Math.pow(10,d); return Math.round((x+1e-9)*f)/f; };
const gradeOf=(p)=>p>=80?"4":p>=75?"3.5":p>=70?"3":p>=65?"2.5":p>=60?"2":p>=55?"1.5":p>=50?"1":"0";
function dice(a,b){ const bg=(s)=>{ const r=[]; for(let i=0;i<s.length-1;i++) r.push(s.slice(i,i+2)); return r; };
  const A=bg(a),B=bg(b); if(!A.length||!B.length) return 0; const m={}; B.forEach(x=>m[x]=(m[x]||0)+1);
  let hit=0; A.forEach(x=>{ if(m[x]){ hit++; m[x]--; } }); return 2*hit/(A.length+B.length); }

/* เทียบงานอัตโนมัติ: คำว่าสอบกลาง/ปลายภาค → รหัสตัวชี้วัด (1.1/2) → "หน่วยที่ n" → ชื่อคล้ายภาระงานใน Q-Info → ที่เหลือไล่ตามลำดับงาน */
function autoMapQ(list,cfg,oldMap,overwrite){
  const ind=(cfg&&cfg.ind)||[]; const map=overwrite?{}:{...(oldMap||{})};
  const units=[...new Set(ind.map(i=>String(i.u)))];
  const clean=(s)=>String(s||"").replace(/\s+/g,"").toLowerCase();
  const pending=[];
  list.forEach(a=>{
    if(map[a.id]!==undefined) return;             // เคยเทียบเอง/เลือกไว้แล้ว → ไม่แตะ
    const t=clean(a.title); let tg=null;
    if(/กลางภาค|กลางเทอม|midterm/.test(t)) tg="mid";
    else if(/ปลายภาค|ปลายเทอม|final/.test(t)) tg="fin";
    if(!tg){ const m=t.match(/(\d+)\.(\d+)\/(\d+)/); if(m){ const f=ind.find(i=>clean(i.s).endsWith(m[1]+"."+m[2])&&String(i.n)===m[3]); if(f) tg="i:"+indKey(f); } }
    if(!tg){ const m=t.match(/หน่วย(?:การเรียนรู้)?(?:ที่)?(\d+)/); if(m&&units.includes(m[1])){ const inU=ind.filter(i=>String(i.u)===m[1]); tg=inU.length===1?"i:"+indKey(inU[0]):"u:"+m[1]; } }
    if(!tg){ let best=null,bs=0; ind.forEach(i=>{ [...String(i.w||"").split(/[,\n]/),i.un].forEach(c=>{ const sc=dice(t,clean(c)); if(sc>bs){ bs=sc; best=i; } }); });
      if(best&&bs>=0.5) tg="i:"+indKey(best); }
    if(tg) map[a.id]=tg; else pending.push(a);
  });
  if(pending.length && ind.length){
    const covered=new Set();
    Object.values(map).forEach(v=>{ if(!v) return; if(v.startsWith("i:")) covered.add(v.slice(2)); if(v.startsWith("u:")) ind.filter(i=>String(i.u)===v.slice(2)).forEach(i=>covered.add(indKey(i))); });
    const empty=ind.filter(i=>!covered.has(indKey(i)));
    if(empty.length){ pending.forEach((a,k)=>{ map[a.id]="i:"+indKey(empty[Math.min(empty.length-1,Math.floor(k*empty.length/pending.length))]); }); }
    else pending.forEach(a=>{ const pos=list.indexOf(a); let tg=null;
      for(let j=pos-1;j>=0&&!tg;j--){ const v=map[list[j].id]; if(v&&(v.startsWith("i:")||v.startsWith("u:"))) tg=v; }
      for(let j=pos+1;j<list.length&&!tg;j++){ const v=map[list[j].id]; if(v&&(v.startsWith("i:")||v.startsWith("u:"))) tg=v; }
      map[a.id]=tg||("i:"+indKey(ind[0])); });
  }
  return map;
}

/* คำนวณคะแนนที่แปลงแล้วของนักเรียนทุกคน */
function computeQ(students,list,subjScores,cfg,map){
  const ind=(cfg&&cfg.ind)||[]; const dec=Number(cfg&&cfg.dec)||0;
  const buckets=ind.map(i=>({key:indKey(i),i,label:indLabel(i),max:Number(i.m)||0,
    asg:list.filter(a=>map[a.id]==="i:"+indKey(i)||map[a.id]==="u:"+i.u)}));
  buckets.push({key:"mid",label:"สอบกลางภาค",max:Number(cfg&&cfg.mid)||0,asg:list.filter(a=>map[a.id]==="mid")});
  buckets.push({key:"fin",label:"สอบปลายภาค",max:Number(cfg&&cfg.fin)||0,asg:list.filter(a=>map[a.id]==="fin")});
  buckets.forEach(b=>{ b.rawMax=b.asg.reduce((s,a)=>s+(Number(a.max)||0),0); b.factor=b.rawMax?b.max/b.rawMax:0; });
  const fullMax=buckets.reduce((s,b)=>s+b.max,0);
  const keepMax=buckets.filter(b=>b.i).reduce((s,b)=>s+b.max,0);
  const rows=students.map(s=>{ const sc=subjScores[s.id]||{}; const vals={}; let missing=0;
    buckets.forEach(b=>{ if(!b.asg.length||!b.rawMax||!b.max){ vals[b.key]=null; return; }
      let raw=0,has=false; b.asg.forEach(a=>{ const n=numOf(sc[a.id]); if(n!=null){ raw+=n; has=true; } else missing++; });
      vals[b.key]=has?Math.min(b.max,roundTo(raw/b.rawMax*b.max,dec)):null; });
    const keep=roundTo(buckets.filter(b=>b.i).reduce((t,b)=>t+(vals[b.key]||0),0),dec);
    const total=roundTo(keep+(vals.mid||0)+(vals.fin||0),dec);
    return {s,vals,keep,total,missing,grade:fullMax?gradeOf(total/fullMax*100):"-"};
  });
  return {buckets,rows,fullMax,keepMax};
}

    m1.push([]); m1.push(["สูตร: คะแนนตัวชี้วัด = (ผลรวมคะแนนงานที่เทียบ ÷ ผลรวมคะแนนเต็มของงาน) × คะแนนเต็มใน Q-Info  ปัดทศนิยม "+dec+" ตำแหน่ง"]);
    const ws2=XLSX.utils.aoa_to_sheet(m1); ws2["!cols"]=[{wch:32},{wch:11},{wch:40},{wch:14},{wch:10}];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"คะแนนแปลงQ-Info"); XLSX.utils.book_append_sheet(wb,ws2,"การเทียบงาน");
    XLSX.writeFile(wb,"QInfo_ภาค"+term+"_"+subj.name+"_"+subj.room+".xlsx");
  };
  const copyFill=async()=>{ const s=buildFillScript(subj,cfg,term,res,false); const ok=await copyText(s);
    if(ok) setToast({ok:true,text:"คัดลอกสคริปต์แล้ว — ไปวางใน Console ของ Q-Info เมนู 2.2.7"}); else setShowCode(s); };

  const unmapped=list.filter(a=>map[a.id]===undefined).length;
  const emptyB=res?res.buckets.filter(b=>b.max>0&&!b.asg.length):[];
  const opts=cfg?[
    ...cfg.ind.map(i=>({v:"i:"+indKey(i),t:indLabel(i)+" — เต็ม "+i.m})),
    ...[...new Set(cfg.ind.map(i=>String(i.u)))].filter(u=>cfg.ind.filter(i=>String(i.u)===u).length>1).map(u=>({v:"u:"+u,t:"ทั้งหน่วย "+u+" (ทุกตัวชี้วัดในหน่วย)"})),
    {v:"mid",t:"สอบกลางภาค — เต็ม "+(cfg.mid||0)},{v:"fin",t:"สอบปลายภาค — เต็ม "+(cfg.fin||0)},{v:"",t:"ไม่นำไปคิด"}]:[];
  const numIn={...inputStyle,width:72,padding:"6px 8px",textAlign:"center"};

  return <div style={{display:"grid",gap:14,gridTemplateColumns:"minmax(0,1fr)"}}>
    <SectionHead title="เทียบคะแนน Q-Info" right={<div className="seg">
      {["1","2"].map(t=><button key={t} className={term===t?"on":""} onClick={()=>{setTerm(t);setEditing(false);}}>ภาคเรียนที่ {t}</button>)}</div>}/>

    {/* ① โครงสร้าง */}
    <div style={panel}>
      <div style={panelHead}><span className="qi-step">1</span>โครงสร้างคะแนนใน Q-Info {cfg&&cfg.title?<span style={{fontSize:13,color:SUB,fontWeight:500}}>({cfg.title})</span>:null}</div>
      {(!cfg||editing) ? <div>
        {presets.length>0 && <Field label={"เลือกจากข้อมูลที่ดึงจาก Q-Info ปีการศึกษา 2569 ภาคเรียนที่ "+term}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <select style={{...inputStyle,flex:"1 1 220px",width:"auto"}} value={presetIdx} onChange={e=>setPresetIdx(e.target.value)}>
              <option value="">— เลือกวิชา —</option>
              {presets.map((p,i)=><option key={i} value={i}>{p.t} ({p.ind.length} ตัวชี้วัด / {p.ind.reduce((s,x)=>s+x.m,0)} คะแนน)</option>)}
            </select>
            <Btn variant="primary" disabled={presetIdx===""} onClick={()=>applyStructure(presets[Number(presetIdx)])}><Save size={15}/>ใช้โครงสร้างนี้</Btn>
          </div></Field>}
        <details style={{fontSize:13.5,color:C.text}} open={!presets.length}>
          <summary style={{cursor:"pointer",fontWeight:600,color:C.navy,marginBottom:8}}>ดึงโครงสร้างวิชาอื่น / ภาคเรียนใหม่ จาก Q-Info</summary>
          <ol style={{margin:"6px 0 10px",paddingLeft:20,lineHeight:1.7,color:SUB}}>
            <li>เปิด Q-Info → เลือกภาคเรียน → เมนู <b>2.2.2 โครงสร้างรายวิชา</b> → คลิกวิชา</li>
            <li>กด <kbd>F12</kbd> → แท็บ Console → วางสคริปต์ด้านล่าง → <kbd>Enter</kbd> (ครั้งแรก Chrome อาจให้พิมพ์ allow pasting)</li>
            <li>กลับมาวางข้อความที่ได้ในช่องด้านล่าง แล้วกด “นำเข้า”</li>
          </ol>
          <div style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:10}}>
            <pre className="qi-code" style={{flex:1}}>{QINFO_GRAB_SCRIPT}</pre>
            <Btn variant="soft" size="sm" onClick={async()=>setToast({ok:await copyText(QINFO_GRAB_SCRIPT),text:"คัดลอกสคริปต์ดึงโครงสร้างแล้ว"})}><Copy size={14}/>คัดลอก</Btn>
          </div>
          <textarea style={{...inputStyle,minHeight:80,fontSize:12.5}} value={paste} onChange={e=>setPaste(e.target.value)} placeholder='วางข้อความ {"t":"...","ind":[...]} ที่นี่'/>
          <div style={{display:"flex",gap:8,marginTop:8}}><Btn variant="primary" size="sm" disabled={!paste.trim()} onClick={importPaste}><Upload size={14}/>นำเข้า</Btn>
            {cfg && <Btn variant="ghost" size="sm" onClick={()=>setEditing(false)}>ยกเลิก</Btn>}</div>
        </details>
      </div> : <div>
        <div style={{...tableWrap,marginBottom:12}}><table style={{...tableStyle,fontSize:13.5}}>
          <thead><tr><th style={th}>หน่วย</th><th style={th}>ตัวชี้วัด</th><th style={th}>เต็ม</th><th style={{...th,textAlign:"left"}}>ภาระงานใน Q-Info</th></tr></thead>
          <tbody>{cfg.ind.map(i=><tr key={indKey(i)} className="tl-row">
            <td style={{...td,textAlign:"center",padding:"7px 8px"}}>{i.u}</td>
            <td style={{...td,whiteSpace:"nowrap",padding:"7px 8px"}}>{i.s}/{i.n}</td>
            <td style={{...td,textAlign:"center",fontWeight:700,color:C.accent,padding:"7px 8px"}}>{i.m}</td>
            <td style={{...td,fontSize:12.5,color:SUB,padding:"7px 8px"}}><b style={{color:C.text}}>{i.un}</b> · {i.w}</td></tr>)}</tbody>
        </table></div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap",alignItems:"center",fontSize:13.5}}>
          <span>คะแนนเก็บ <b>{cfg.ind.reduce((s,i)=>s+i.m,0)}</b></span>
          <label style={{display:"flex",alignItems:"center",gap:6}}>กลางภาค<input style={numIn} type="number" value={cfg.mid} onChange={e=>save({...cfg,mid:Number(e.target.value)||0})}/></label>
          <label style={{display:"flex",alignItems:"center",gap:6}}>ปลายภาค<input style={numIn} type="number" value={cfg.fin} onChange={e=>save({...cfg,fin:Number(e.target.value)||0})}/></label>
          <label style={{display:"flex",alignItems:"center",gap:6}}>ปัดทศนิยม<select style={{...numIn,width:64}} value={cfg.dec||0} onChange={e=>save({...cfg,dec:Number(e.target.value)})}><option value={0}>0</option><option value={1}>1</option><option value={2}>2</option></select></label>
          <Btn variant="ghost" size="sm" onClick={()=>setEditing(true)} style={{marginLeft:"auto"}}><Pencil size={14}/>เปลี่ยนโครงสร้าง</Btn>
        </div>
      </div>}
    </div>

    {/* ② เทียบงาน */}
    {cfg && !editing && <div style={panel}>
      <div style={{...panelHead,flexWrap:"wrap"}}><span className="qi-step">2</span>เทียบงานในระบบ → ช่องคะแนน Q-Info
        <div style={{marginLeft:"auto",display:"flex",gap:6}}>
          <Btn variant="accent" size="sm" onClick={()=>runAuto(false)}><Zap size={14}/>เทียบอัตโนมัติ{unmapped?" ("+unmapped+")":""}</Btn>
          <Btn variant="ghost" size="sm" onClick={()=>runAuto(true)}>เทียบใหม่ทั้งหมด</Btn>
        </div></div>
      {list.length===0 && <div style={{color:SUB,fontSize:14}}>ยังไม่มีงานในเมนู “เช็คคะแนน”</div>}
      {list.map(a=>{ const v=map[a.id]; return <div key={a.id} className="qi-map">
        <div style={{minWidth:0}}><div style={{fontWeight:600,fontSize:14.5,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div>
          <div style={{fontSize:12,color:SUB}}>เต็ม {a.max}</div></div>
        <select style={{...inputStyle,padding:"8px 10px",fontSize:13.5,borderColor:v===undefined?"#e0a458":C.border,background:v===undefined?"#fff8ec":"#fff"}} value={v===undefined?"__none":v} onChange={e=>setMap(a.id,e.target.value)}>
          <option value="__none">— ยังไม่เทียบ —</option>
          {opts.map(o=><option key={o.v} value={o.v}>{o.t}</option>)}
        </select>
      </div>; })}
      {res && <div style={{marginTop:12,display:"flex",flexWrap:"wrap",gap:6}}>
        {res.buckets.filter(b=>b.max>0).map(b=><span key={b.key} title={b.asg.map(a=>a.title).join(", ")} style={{fontSize:12,padding:"4px 9px",borderRadius:20,fontWeight:600,
          background:b.asg.length?"#e6f4ec":"#fbeae8",color:b.asg.length?"#2e7d52":"#c0392b"}}>
          {b.label}: {b.asg.length?(b.asg.length+" งาน · "+b.rawMax+" → "+b.max):"ยังไม่มีงาน"}</span>)}
      </div>}
      {emptyB.length>0 && <div style={{marginTop:8,fontSize:12.5,color:"#c0392b"}}>ช่องที่ยังไม่มีงานเทียบ จะเว้นว่างตอนกรอก Q-Info</div>}
    </div>}

    {/* ③ ผลการแปลง */}
    {cfg && !editing && res && <div style={panel}>
      <div style={{...panelHead,flexWrap:"wrap"}}><span className="qi-step">3</span>คะแนนที่แปลงแล้ว (พร้อมกรอก Q-Info)
        <div style={{marginLeft:"auto",display:"flex",gap:6,flexWrap:"wrap"}}>
          <Btn variant="accent" size="sm" onClick={exportXlsx}><Download size={14}/>Export .xlsx</Btn>
          <Btn variant="primary" size="sm" onClick={copyFill}><Copy size={14}/>คัดลอกสคริปต์กรอก Q-Info</Btn>
        </div></div>
      <div style={{...tableWrap,maxHeight:"60vh"}}><table style={{...tableStyle,fontSize:13.5}}>
        <thead><tr>
          <th style={{...th,width:40,zIndex:3}}>#</th>
          <th style={{...th,textAlign:"left",minWidth:150,left:0,zIndex:3}}>ชื่อ-สกุล</th>
          {res.buckets.filter(b=>b.i).map(b=><th key={b.key} style={{...th,minWidth:74,fontSize:12}}>{b.i.s}/{b.i.n}<div style={{fontWeight:400,fontSize:11,color:"#c7d4e2"}}>หน่วย {b.i.u} · {b.max}</div></th>)}
          <th style={{...th,background:C.navyDark,fontSize:12}}>เก็บ<div style={{fontWeight:400,fontSize:11,color:"#c7d4e2"}}>{res.keepMax}</div></th>
          <th style={{...th,fontSize:12}}>กลางภาค<div style={{fontWeight:400,fontSize:11,color:"#c7d4e2"}}>{cfg.mid||0}</div></th>
          <th style={{...th,fontSize:12}}>ปลายภาค<div style={{fontWeight:400,fontSize:11,color:"#c7d4e2"}}>{cfg.fin||0}</div></th>
          <th style={{...th,background:C.navyDark,fontSize:12}}>รวม<div style={{fontWeight:400,fontSize:11,color:"#c7d4e2"}}>{res.fullMax}</div></th>
          <th style={{...th,background:C.accent,fontSize:12}}>เกรด</th>
        </tr></thead>
        <tbody>{res.rows.map(r=><tr key={r.s.id} className="tl-row">
          <td style={{...td,textAlign:"center",color:SUB,padding:"7px 6px"}}>{r.s.number}</td>
          <td style={{...td,position:"sticky",left:0,background:"inherit",whiteSpace:"nowrap",padding:"7px 10px"}}>{r.s.name}</td>
          {res.buckets.filter(b=>b.i).map(b=><td key={b.key} style={{...td,textAlign:"center",padding:"7px 6px",color:r.vals[b.key]==null?"#c0c8d2":C.text}}>{r.vals[b.key]==null?"–":r.vals[b.key]}</td>)}
          <td style={{...td,textAlign:"center",fontWeight:700,background:C.navySoft,padding:"7px 6px"}}>{r.keep}</td>
          <td style={{...td,textAlign:"center",padding:"7px 6px"}}>{r.vals.mid==null?"–":r.vals.mid}</td>
          <td style={{...td,textAlign:"center",padding:"7px 6px"}}>{r.vals.fin==null?"–":r.vals.fin}</td>
          <td style={{...td,textAlign:"center",fontWeight:700,background:C.navySoft,padding:"7px 6px"}}>{r.total}</td>
          <td style={{...td,textAlign:"center",fontWeight:700,color:C.accent,background:C.accentSoft,padding:"7px 6px"}}>{r.grade}</td>
        </tr>)}</tbody>
      </table></div>
      <details style={{marginTop:12,fontSize:13.5}}>
        <summary style={{cursor:"pointer",fontWeight:600,color:C.navy}}>วิธีกรอกลง Q-Info อัตโนมัติ (ภาคเรียนที่ {term})</summary>
        <ol style={{margin:"8px 0 0",paddingLeft:20,lineHeight:1.75,color:SUB}}>
          <li>กด <b>คัดลอกสคริปต์กรอก Q-Info</b> (ปุ่มด้านบน)</li>
          <li>เปิด Q-Info → เลือก <b>ภาคเรียนที่ {term}</b> → เมนู <b>2.2.7 ประเมินตัวชี้วัด</b> → คลิกวิชา <b>{cfg.title||subj.name+" "+subj.room}</b></li>
          <li>กด <kbd>F12</kbd> → Console → วาง → <kbd>Enter</kbd> → ยืนยัน · ระบบจะกรอกทุกแผ่นงาน (ตัวชี้วัด + คะแนนสอบ) ให้เอง จับคู่ด้วยชื่อ-สกุล</li>
          <li>ตรวจตัวเลข แล้วกดปุ่ม <b>บันทึก</b> ของ Q-Info (สคริปต์ไม่กดบันทึกให้)</li>
        </ol>
        <div style={{marginTop:6,color:SUB}}>คะแนนแปลงจากสูตร (ผลรวมคะแนนงาน ÷ คะแนนเต็มงาน) × คะแนนเต็มตัวชี้วัด · นักเรียนที่ไม่มีคะแนนงานในช่องนั้นเลยจะเว้นว่าง · งานที่ไม่ได้ส่งนับเป็น 0</div>
      </details>
    </div>}

    <Modal open={!!showCode} onClose={()=>setShowCode(null)} title="คัดลอกสคริปต์ด้วยตนเอง" width={640}>
      <textarea readOnly style={{...inputStyle,minHeight:260,fontSize:11.5,fontFamily:"monospace"}} value={showCode||""} onFocus={e=>e.target.select()}/>
    </Modal>
    {toast && <div className="qs-toast" style={{background:toast.ok?"#2e7d52":"#c0392b"}}>{toast.text}</div>}
  </div>;
}

/* ---------- SETTINGS ---------- */
function SettingsView({subjects,students,setStudents,logoUrl,setLogoUrl}){
  const persist=usePersist();
  const [target,setTarget]=useState((subjects[0]&&subjects[0].id)||"");
  const [pasteText,setPasteText]=useState("");
  const [logoInput,setLogoInput]=useState(logoUrl);
  const fileRef=useRef();
  useEffect(()=>{ if(!target && subjects[0]) setTarget(subjects[0].id); },[subjects]);
  const parseNames=(text)=>text.split("\n").map(l=>l.trim()).filter(Boolean).map((line,i)=>{
    const m=line.split(/[,\t]/).map(x=>x.trim());
    if(m.length>=2 && /^\d+$/.test(m[0])) return {id:uid(),number:Number(m[0]),name:m.slice(1).join(" ")};
    return {id:uid(),number:i+1,name:line};
  });
  const importPaste=()=>{ if(!target) return alert("ยังไม่มีรายวิชา");
    const parsed=parseNames(pasteText); if(!parsed.length) return;
    setStudents(p=>({...p,[target]:parsed})); persist.replaceStudents(target,parsed); setPasteText(""); alert("นำเข้า "+parsed.length+" รายชื่อสำเร็จ"); };
  const importFile=(e)=>{ const file=e.target.files[0]; if(!file||!target) return;
    const reader=new FileReader();
    reader.onload=(ev)=>{ const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{header:1}); const parsed=[];
      rows.forEach((r,i)=>{ if(!r||!r.length) return; const first=String(r[0]!=null?r[0]:"").trim();
        if(i===0 && !/^\d+$/.test(first)) return;
        if(/^\d+$/.test(first) && r[1]) parsed.push({id:uid(),number:Number(first),name:String(r[1]).trim()});
        else if(first) parsed.push({id:uid(),number:parsed.length+1,name:first}); });
      if(parsed.length){ setStudents(p=>({...p,[target]:parsed})); persist.replaceStudents(target,parsed); alert("นำเข้าจากไฟล์ "+parsed.length+" รายชื่อสำเร็จ"); }
      else alert("ไม่พบข้อมูลในไฟล์"); };
    reader.readAsArrayBuffer(file); e.target.value=""; };
  const currentList=students[target]||[];
  const setStuStatus=(id,status)=>{ setStudents(p=>({...p,[target]:(p[target]||[]).map(s=>s.id===id?{...s,status}:s)})); persist.setStudentStatus(id,status); };
  const removeStudent=(id)=>{ setStudents(p=>({...p,[target]:(p[target]||[]).filter(s=>s.id!==id)})); persist.deleteStudent(id); };
  return <div style={{display:"grid",gap:14}}>
    <h2 style={{margin:0,fontSize:19,color:C.navy}}>ตั้งค่าระบบ</h2>
    <div style={panel}>
      <div style={panelHead}><Upload size={18}/> นำเข้ารายชื่อนักเรียน</div>
      <Field label="เลือกรายวิชา"><select style={inputStyle} value={target} onChange={e=>setTarget(e.target.value)}>
        {subjects.map(s=><option key={s.id} value={s.id}>{s.name} ({s.room})</option>)}
      </select></Field>
      <Field label="วางรายชื่อ (1 บรรทัด/คน — รองรับ “เลขที่,ชื่อ” หรือชื่ออย่างเดียว)">
        <textarea style={{...inputStyle,minHeight:110,resize:"vertical"}} value={pasteText} onChange={e=>setPasteText(e.target.value)} placeholder={"1,เด็กชายสมชาย ใจดี\n2,เด็กหญิงสมหญิง รักเรียน"}/>
      </Field>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <Btn variant="primary" onClick={importPaste}><Upload size={15}/>นำเข้าจากข้อความ</Btn>
        <Btn variant="ghost" onClick={()=>fileRef.current&&fileRef.current.click()}><Upload size={15}/>นำเข้าจากไฟล์ .xlsx / .csv</Btn>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" onChange={importFile} style={{display:"none"}}/>
      </div>
      {currentList.length>0 && <div style={{marginTop:14}}>
        <div style={{fontSize:13,fontWeight:600,color:SUB,marginBottom:6}}>รายชื่อปัจจุบัน ({currentList.length} คน · สถานะปกติ {currentList.filter(isNormalStu).length} คน)</div>
        <div style={{...tableWrap,maxHeight:240}}><table style={tableStyle}>
          <thead><tr><th style={{...th,width:44}}>#</th><th style={{...th,textAlign:"left"}}>ชื่อ-สกุล</th><th style={{...th,width:118}}>สถานะ</th><th style={{...th,width:56}}></th></tr></thead>
          <tbody>{currentList.map(s=><tr key={s.id} className="tl-row">
            <td style={{...td,textAlign:"center",color:SUB}}>{s.number}</td><td style={{...td,opacity:isNormalStu(s)?1:.55}}>{s.name}</td>
            <td style={{...td,textAlign:"center",padding:"6px 8px"}}><select value={s.status||"normal"} onChange={e=>setStuStatus(s.id,e.target.value)} style={{fontFamily:"inherit",fontSize:13.5,fontWeight:600,padding:"5px 6px",borderRadius:8,border:"1px solid "+C.border,color:stuStatusOf(s).color,background:stuStatusOf(s).bg,cursor:"pointer"}}>{STU_STATUS.map(o=><option key={o.v} value={o.v}>{o.label}</option>)}</select></td>
            <td style={{...td,textAlign:"center"}}><button onClick={()=>removeStudent(s.id)} style={{background:"none",border:"none",color:"#c0392b",cursor:"pointer"}}><Trash2 size={15}/></button></td>
          </tr>)}</tbody>
        </table></div>
      </div>}
    </div>
    <div style={panel}>
      <div style={panelHead}><ImageIcon size={18}/> โลโก้ระบบ (ใช้เป็น favicon ด้วย)</div>
      <Field label="ลิงก์รูปโลโก้ (URL)"><input style={inputStyle} value={logoInput} onChange={e=>setLogoInput(e.target.value)} placeholder="https://.../logo.png"/></Field>
      <div style={{display:"flex",gap:12,alignItems:"center"}}>
        <Btn variant="primary" onClick={()=>{ const u=logoInput.trim(); setLogoUrl(u); persist.setLogo(u); }}><Save size={15}/>บันทึกโลโก้</Btn>
        {logoInput && <img src={logoInput} alt="preview" style={{width:44,height:44,borderRadius:8,objectFit:"cover",border:"1px solid "+C.border}}/>}
      </div>
    </div>
    <div style={{...panel,fontSize:13,color:SUB,lineHeight:1.6}}>
      <div style={panelHead}><Cloud size={18}/> สถานะฐานข้อมูล</div>
      {FB ? "เชื่อมต่อ Firestore แล้ว — ข้อมูลถูกบันทึกอัตโนมัติ" : "ยังไม่ได้เชื่อมต่อ Firestore (กำลังรันในโหมดทดลอง) เมื่อเปิดผ่าน GitHub Pages ระบบจะเชื่อมต่ออัตโนมัติ"}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
