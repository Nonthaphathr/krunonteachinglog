        <label style={{display:"flex",gap:5,alignItems:"center",cursor:"pointer"}} title="เหมาะกับส่งในกลุ่มไลน์ห้อง"><input type="checkbox" checked={shortName} onChange={e=>{setShortName(e.target.checked);setLS("short",e.target.checked?"1":"0");}}/>ไม่แสดงนามสกุล (ข้อความ/สรุปรวม)</label>
      </div>
      <details style={{marginTop:10}}>
        <summary style={{cursor:"pointer",fontSize:13.5,fontWeight:600,color:C.navy}}>กำหนดส่ง · ข้อความถึงนักเรียน · ชื่อครู/โรงเรียน</summary>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:10,marginTop:10}}>
          <Field label="กำหนดส่ง (ถ้ามี)"><input type="date" style={inputStyle} value={due} onChange={e=>setDue(e.target.value)}/></Field>
          <Field label="ชื่อครูผู้แจ้ง"><input style={inputStyle} value={teacher} onChange={e=>{setTeacher(e.target.value);setLS("teacher",e.target.value);}}/></Field>
          <Field label="โรงเรียน (หัวกระดาษ)"><input style={inputStyle} value={school} onChange={e=>{setSchool(e.target.value);setLS("school",e.target.value);}}/></Field>
        </div>
        <Field label="ข้อความเพิ่มเติม"><textarea style={{...inputStyle,minHeight:60,resize:"vertical"}} value={note} onChange={e=>{setNote(e.target.value);setLS("note",e.target.value);}}/></Field>
      </details>
    </div>

    {/* สรุปตัวเลข */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:8}}>
      {[["ค้างงาน",late.length+" คน","#c0392b","#fbeae8"],["รวมงานค้าง",totalMiss+" งาน",C.accent,C.accentSoft],["ส่งครบ",(rows.length-late.length)+" คน","#2e7d52","#e6f4ec"]].map(([t,v,c,bg])=>
        <div key={t} style={{background:bg,borderRadius:12,padding:"10px 12px"}}><div style={{fontSize:12.5,color:c,fontWeight:600}}>{t}</div><div style={{fontSize:21,fontWeight:700,color:c}}>{v}</div></div>)}
    </div>

    {mode==="class" && <div style={panel}>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:12}}>
        <div className="seg">
          <button className={groupBy==="student"?"on":""} onClick={()=>{setGroupBy("student");setLS("group","student");}}>เรียงตามนักเรียน</button>
          <button className={groupBy==="work"?"on":""} onClick={()=>{setGroupBy("work");setLS("group","work");}}>เรียงตามงาน</button>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:6,flexWrap:"wrap"}}>
          <Btn variant="primary" size="sm" onClick={()=>copy(textClass(),"สรุปทั้งห้อง")}><Chat size={14}/>คัดลอกส่งไลน์</Btn>
          <Btn variant="accent" size="sm" onClick={printClass}><Printer size={14}/>พิมพ์/PDF สรุปรวม</Btn>
          <Btn variant="ghost" size="sm" onClick={()=>printSlips(rows)}><Printer size={14}/>ใบแจ้งรายบุคคลทุกคน</Btn>
        </div>
      </div>
      {groupBy==="student" ? <div style={{...tableWrap,overflow:"hidden"}}>
        {late.map(r=><div key={r.s.id} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"10px 12px",borderTop:"1px solid "+C.border}}>
          <div className="qs-no">{r.s.number}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600}}>{r.s.name} <span style={{fontSize:12,color:"#c0392b",fontWeight:700}}>ค้าง {r.miss.length}</span></div>
            <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:4}}>{r.miss.map(a=><span key={a.id} style={{fontSize:12,background:"#fbeae8",color:"#a5352a",padding:"2px 8px",borderRadius:12}}>{a.title}</span>)}</div>
          </div>
          <div style={{display:"flex",gap:4,flexShrink:0}}>
            <button style={miniBtn} title="คัดลอกข้อความรายบุคคล" onClick={()=>copy(textPerson(r),r.s.name)}><Copy size={13}/></button>
            <button style={miniBtn} title="พิมพ์ใบแจ้งรายบุคคล" onClick={()=>printSlips([r])}><Printer size={13}/></button>
          </div>
        </div>)}
        {!late.length && <div style={{padding:26,textAlign:"center",color:"#2e7d52",fontWeight:600}}>นักเรียนส่งงานครบทุกคน</div>}
      </div> : <div style={{display:"grid",gap:8}}>
        {byWork.map(x=><div key={x.a.id} style={{border:"1px solid "+C.border,borderRadius:10,padding:"10px 12px"}}>
          <div style={{fontWeight:700,color:C.navy}}>{x.a.title} <span style={{fontSize:12,color:SUB,fontWeight:500}}>เต็ม {x.a.max}</span> <span style={{fontSize:12,color:"#c0392b"}}>ค้าง {x.who.length} คน</span></div>
          <div style={{fontSize:13.5,color:C.text,marginTop:4}}>เลขที่ {x.who.map(s=>s.number).join(", ")}</div>
        </div>)}
        {!byWork.length && <div style={{padding:20,textAlign:"center",color:"#2e7d52",fontWeight:600}}>ไม่มีงานค้าง</div>}
      </div>}
      <details style={{marginTop:12}}><summary style={{cursor:"pointer",fontSize:13.5,fontWeight:600,color:C.navy}}>ดูตัวอย่างข้อความที่จะคัดลอก</summary>
        <pre style={{whiteSpace:"pre-wrap",fontFamily:"inherit",fontSize:13.5,background:"#f7f9fb",border:"1px solid "+C.border,borderRadius:8,padding:12,marginTop:8}}>{textClass()}</pre></details>
    </div>}

    {mode==="person" && <div style={{display:"grid",gap:12,gridTemplateColumns:"minmax(0,1fr)"}}>
      {curRow && <div className="qs-panel" style={{marginBottom:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <div className="qs-no" style={{background:curRow.miss.length?"#c0392b":"#2e7d52",color:"#fff"}}>{curRow.s.number}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontWeight:700,fontSize:16,color:C.navy}}>{curRow.s.name}</div>
            <div style={{fontSize:12.5,color:curRow.miss.length?"#c0392b":"#2e7d52",fontWeight:600}}>{curRow.miss.length?"ค้าง "+curRow.miss.length+" งาน":"ส่งครบแล้ว"}</div></div>
          <button className="qs-iconbtn" onClick={()=>setCur(null)}><X size={18}/></button>
        </div>
        <pre style={{whiteSpace:"pre-wrap",fontFamily:"inherit",fontSize:14,background:"#f7f9fb",border:"1px solid "+C.border,borderRadius:8,padding:12,margin:"0 0 10px"}}>{textPerson(curRow)}</pre>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <Btn variant="primary" size="sm" onClick={()=>copy(textPerson(curRow),curRow.s.name)}><Chat size={14}/>คัดลอกส่งไลน์</Btn>
          <Btn variant="accent" size="sm" disabled={!curRow.miss.length} onClick={()=>printSlips([curRow])}><Printer size={14}/>พิมพ์/PDF ใบแจ้ง</Btn>
          <div style={{marginLeft:"auto",display:"flex",gap:6}}>
            <Btn variant="ghost" size="sm" disabled={!late.length} onClick={()=>step(-1)}><ChevronLeft size={14}/>คนก่อน</Btn>
            <Btn variant="ghost" size="sm" disabled={!late.length} onClick={()=>step(1)}>คนถัดไปที่ค้าง<span style={{display:"flex",transform:"rotate(180deg)"}}><ChevronLeft size={14}/></span></Btn>
          </div>
        </div>
      </div>}
      <div className="qs-search" style={{borderWidth:1}}>
        <Search size={18}/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นเลขที่ หรือชื่อนักเรียน" autoComplete="off"
          onKeyDown={e=>{ if(e.key==="Enter"&&found[0]){ setCur(found[0].s.id); setQ(""); } }}/>
        {q && <button className="qs-iconbtn" style={{background:"transparent"}} onClick={()=>setQ("")}><X size={18}/></button>}
      </div>
      <div style={{...tableWrap,overflow:"hidden"}}>
        {found.map(r=><button key={r.s.id} className="qs-row" onClick={()=>{setCur(r.s.id);window.scrollTo({top:0,behavior:"smooth"});}} style={r.s.id===cur?{background:C.accentSoft}:null}>
          <div className="qs-no">{r.s.number}</div>
          <div style={{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.s.name}</div>
          <div className="qs-score" style={r.miss.length?{background:"#fbeae8",color:"#c0392b"}:{background:"#e6f4ec",color:"#2e7d52"}}>{r.miss.length?"ค้าง "+r.miss.length:"ครบ"}</div>
        </button>)}
        {!found.length && <div style={{padding:22,textAlign:"center",color:SUB}}>ไม่พบนักเรียน</div>}
      </div>
    </div>}

    {toast && <div className="qs-toast" style={{background:toast.ok?"#2e7d52":"#c0392b"}}>{toast.text}</div>}
  </div>;
}

/* ---------- NOTES ---------- */
function NotesView({subj,notes,setNotes,notePresets,setNotePresets,term}){
  const persist=usePersist();
  const list=(notes[subj.id]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({date:todayStr(),text:""});
  const [filterFrom,setFilterFrom]=useState(""); const [filterTo,setFilterTo]=useState(""); const [q,setQ]=useState("");
  const filtered=list.filter(n=>(!filterFrom||n.date>=filterFrom)&&(!filterTo||n.date<=filterTo)&&(!q||n.text.toLowerCase().includes(q.toLowerCase())));
  const sem=(term&&term.semester)||"";
  /* จำข้อความที่เคยพิมพ์ (ล่าสุดก่อน สูงสุด 40) เก็บที่ settings/noteTexts */
  const remember=(t)=>{ t=(t||"").trim(); if(!t||t.length>400) return; const next=[t,...(notePresets||[]).filter(x=>x!==t)].slice(0,40); setNotePresets(next); Promise.resolve(persist.setNotePresets(next)).catch(e=>console.error(e)); };
  const forget=(t)=>{ const next=(notePresets||[]).filter(x=>x!==t); setNotePresets(next); Promise.resolve(persist.setNotePresets(next)).catch(e=>console.error(e)); };
  const pick=(t)=>setForm(f=>({...f,text:f.text.trim()?f.text.replace(/\s+$/,"")+"\n"+t:t}));
  const save=()=>{ if(!form.text.trim()) return;
    const now=Date.now();
    if(modal.mode==="add"){ const rec={id:uid(),date:form.date,text:form.text.trim(),updatedAt:now};
      setNotes(p=>({...p,[subj.id]:[...(p[subj.id]||[]),rec]})); persist.addNote(subj.id,rec); gasPost("upsertNote",{note:gasNote(rec,subj,sem)});
    } else { const upd={date:form.date,text:form.text.trim(),updatedAt:now};
      setNotes(p=>({...p,[subj.id]:(p[subj.id]||[]).map(n=>n.id===modal.id?{...n,...upd}:n)})); persist.updateNote(modal.id,upd); gasPost("upsertNote",{note:gasNote({id:modal.id,...upd},subj,sem)}); }
    remember(form.text);
    setModal(null); };
  const remove=(id)=>{ if(!window.confirm("ลบบันทึกนี้?")) return;
    setNotes(p=>({...p,[subj.id]:(p[subj.id]||[]).filter(n=>n.id!==id)})); persist.deleteNote(id); gasPost("deleteNote",{id}); };
  return <div>
    <SectionHead title="บันทึกช่วยจำ" right={<Btn variant="accent" size="sm" onClick={()=>{setForm({date:todayStr(),text:""});setModal({mode:"add"});}}><Plus size={16}/>เพิ่มบันทึก</Btn>}/>
    <div style={{background:"#fff",border:"1px solid "+C.border,borderRadius:12,padding:14,marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,border:"1px solid "+C.border,borderRadius:8,padding:"8px 10px"}}>
        <Search size={16}/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นหาข้อความในบันทึก..." style={{border:"none",outline:"none",flex:1,fontFamily:"inherit",fontSize:14}}/>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:13,color:SUB,fontWeight:600}}>ช่วงวันที่</span>
        <input type="date" value={filterFrom} onChange={e=>setFilterFrom(e.target.value)} style={{...inputStyle,width:"auto",padding:"7px 9px"}}/>
        <span style={{color:SUB}}>–</span>
        <input type="date" value={filterTo} onChange={e=>setFilterTo(e.target.value)} style={{...inputStyle,width:"auto",padding:"7px 9px"}}/>
        {(filterFrom||filterTo||q)&&<button onClick={()=>{setFilterFrom("");setFilterTo("");setQ("");}} style={{fontSize:12.5,color:C.accent,background:"none",border:"none",cursor:"pointer",fontWeight:600,fontFamily:"inherit"}}>ล้างตัวกรอง</button>}
      </div>
    </div>
    <div style={{display:"grid",gap:10}}>
      {filtered.map(n=><div key={n.id} style={{background:"#fff",border:"1px solid "+C.border,borderRadius:12,padding:"13px 15px",borderLeft:"4px solid "+C.accent}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <span style={{fontSize:13,fontWeight:700,color:C.navy,background:C.navySoft,padding:"3px 10px",borderRadius:20}}>{fmtDate(n.date)}</span>
          <div style={{display:"flex",gap:4}}>
            <button onClick={()=>{setForm({date:n.date,text:n.text});setModal({mode:"edit",id:n.id});}} style={{...miniIcon,background:C.navySoft,color:C.navy}}><Pencil size={14}/></button>
            <button onClick={()=>remove(n.id)} style={{...miniIcon,background:"#fbeae8",color:"#c0392b"}}><Trash2 size={14}/></button>
          </div>
        </div>
        <div style={{fontSize:14.5,lineHeight:1.55,whiteSpace:"pre-wrap"}}>{n.text}</div>
      </div>)}
      {filtered.length===0 && <EmptyHint text={list.length===0?"ยังไม่มีบันทึก กด “เพิ่มบันทึก”":"ไม่พบบันทึกตามตัวกรอง"}/>}
    </div>
    <Modal open={!!modal} onClose={()=>setModal(null)} title={modal&&modal.mode==="add"?"เพิ่มบันทึก":"แก้ไขบันทึก"}>
      <Field label="วันที่"><input type="date" style={inputStyle} value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
      <Field label="รายละเอียด"><textarea style={{...inputStyle,minHeight:120,resize:"vertical"}} value={form.text} onChange={e=>setForm({...form,text:e.target.value})} placeholder="พิมพ์บันทึกช่วยจำ..."/></Field>
      <PresetChips list={notePresets} onPick={pick} onForget={forget} label="ข้อความที่เคยพิมพ์ (แตะเพื่อเติมต่อท้าย · กด × เพื่อลบ)"/>
      <Btn variant="primary" onClick={save} style={{width:"100%"}}><Save size={16}/>บันทึก</Btn>
    </Modal>
  </div>;
}

/* ==================== Q-INFO: เทียบงาน → ตัวชี้วัด แล้วแปลงคะแนนอัตโนมัติ ====================
   โครงสร้าง (cfg) ต่อวิชา/ภาคเรียน เก็บที่ Firestore: qinfo/{subjectId}_t{term}
   { title, ind:[{u,un,s,n,m,w}], mid, fin, dec, map:{assignmentId: "i:<u|s|n>" | "u:<หน่วย>" | "mid" | "fin" | ""} }
   ind  = ตัวชี้วัดที่มีคะแนนในเมนู 2.2.2 (u=หน่วย, un=ชื่อหน่วย, s=มาตรฐาน, n=ตัวชี้วัด, m=คะแนนเต็ม, w=ภาระงาน)
   สูตร : คะแนนตัวชี้วัด = (ผลรวมคะแนนงานที่เทียบ ÷ ผลรวมคะแนนเต็มของงานนั้น) × คะแนนเต็มตัวชี้วัดใน Q-Info
---------------------------------------------------------------------------------------------- */
const QINFO_PRESETS={
  "2569/1":[
    {t:"ภาษาไทย 1 ม.1/1",ind:[
      {u:"1",un:"อ่านเติมเต็มชีวิต",s:"ท 1.1",n:"2",m:5,w:"ใบงานจับใจความสำคัญ,ผังความคิดสรุปเรื่อง,ทดสอบย่อย"},
      {u:"1",un:"อ่านเติมเต็มชีวิต",s:"ท 1.1",n:"4",m:6,w:"ใบงานคำเปรียบเทียบ,แบบฝึกคำที่มีหลายความหมาย,ทดสอบย่อย"},
      {u:"2",un:"ร้อยลิขิตสื่อสาร",s:"ท 2.1",n:"2",m:11,w:"ชิ้นงานเขียนสื่อสาร,ใบงานเลือกใช้ถ้อยคำ,แบบประเมินงานเขียน"},

const indKey=(i)=>String(i.u)+"|"+String(i.s)+"|"+String(i.n);
const indLabel=(i)=>"หน่วย "+i.u+" · "+i.s+"/"+i.n;
const roundTo=(x,d)=>{ const f=Math.pow(10,d); return Math.round((x+1e-9)*f)/f; };
const gradeOf=(p)=>p>=80?"4":p>=75?"3.5":p>=70?"3":p>=65?"2.5":p>=60?"2":p>=55?"1.5":p>=50?"1":"0";
function dice(a,b){ const bg=(s)=>{ const r=[]; for(let i=0;i<s.length-1;i++) r.push(s.slice(i,i+2)); return r; };
  const A=bg(a),B=bg(b); if(!A.length||!B.length) return 0; const m={}; B.forEach(x=>m[x]=(m[x]||0)+1);
  let hit=0; A.forEach(x=>{ if(m[x]){ hit++; m[x]--; } }); return 2*hit/(A.length+B.length); }

/* เทียบงานอัตโนมัติ: คำว่าสอบกลาง/ปลายภาค → รหัสตัวชี้วัด (1.1/2) → "หน่วยที่ n" → ชื่อคล้ายภาระงานใน Q-Info → ที่เหลือไล่ตามลำดับงาน */
function autoMapQ(list,cfg,oldMap,overwrite){
  const ind=(cfg&&cfg.ind)||[]; const map=overwrite?{}:{...(oldMap||{})};
  const units=[...new Set(ind.map(i=>String(i.u)))];
  const clean=(s)=>String(s||"").replace(/\s+/g,"").toLowerCase();
  const pending=[];
  list.forEach(a=>{
    if(map[a.id]!==undefined) return;             // เคยเทียบเอง/เลือกไว้แล้ว → ไม่แตะ
    const t=clean(a.title); let tg=null;
    if(/กลางภาค|กลางเทอม|midterm/.test(t)) tg="mid";
    else if(/ปลายภาค|ปลายเทอม|final/.test(t)) tg="fin";
    if(!tg){ const m=t.match(/(\d+)\.(\d+)\/(\d+)/); if(m){ const f=ind.find(i=>clean(i.s).endsWith(m[1]+"."+m[2])&&String(i.n)===m[3]); if(f) tg="i:"+indKey(f); } }
    if(!tg){ const m=t.match(/หน่วย(?:การเรียนรู้)?(?:ที่)?(\d+)/); if(m&&units.includes(m[1])){ const inU=ind.filter(i=>String(i.u)===m[1]); tg=inU.length===1?"i:"+indKey(inU[0]):"u:"+m[1]; } }
    if(!tg){ let best=null,bs=0; ind.forEach(i=>{ [...String(i.w||"").split(/[,\n]/),i.un].forEach(c=>{ const sc=dice(t,clean(c)); if(sc>bs){ bs=sc; best=i; } }); });
      if(best&&bs>=0.5) tg="i:"+indKey(best); }
    if(tg) map[a.id]=tg; else pending.push(a);
  });
  if(pending.length && ind.length){
    const covered=new Set();
    Object.values(map).forEach(v=>{ if(!v) return; if(v.startsWith("i:")) covered.add(v.slice(2)); if(v.startsWith("u:")) ind.filter(i=>String(i.u)===v.slice(2)).forEach(i=>covered.add(indKey(i))); });
    const empty=ind.filter(i=>!covered.has(indKey(i)));
    if(empty.length){ pending.forEach((a,k)=>{ map[a.id]="i:"+indKey(empty[Math.min(empty.length-1,Math.floor(k*empty.length/pending.length))]); }); }
    else pending.forEach(a=>{ const pos=list.indexOf(a); let tg=null;
      for(let j=pos-1;j>=0&&!tg;j--){ const v=map[list[j].id]; if(v&&(v.startsWith("i:")||v.startsWith("u:"))) tg=v; }
      for(let j=pos+1;j<list.length&&!tg;j++){ const v=map[list[j].id]; if(v&&(v.startsWith("i:")||v.startsWith("u:"))) tg=v; }
      map[a.id]=tg||("i:"+indKey(ind[0])); });
  }
  return map;
}

/* คำนวณคะแนนที่แปลงแล้วของนักเรียนทุกคน */
function computeQ(students,list,subjScores,cfg,map){
  const ind=(cfg&&cfg.ind)||[]; const dec=Number(cfg&&cfg.dec)||0;
  const buckets=ind.map(i=>({key:indKey(i),i,label:indLabel(i),max:Number(i.m)||0,
    asg:list.filter(a=>map[a.id]==="i:"+indKey(i)||map[a.id]==="u:"+i.u)}));
  buckets.push({key:"mid",label:"สอบกลางภาค",max:Number(cfg&&cfg.mid)||0,asg:list.filter(a=>map[a.id]==="mid")});
  buckets.push({key:"fin",label:"สอบปลายภาค",max:Number(cfg&&cfg.fin)||0,asg:list.filter(a=>map[a.id]==="fin")});
  buckets.forEach(b=>{ b.rawMax=b.asg.reduce((s,a)=>s+(Number(a.max)||0),0); b.factor=b.rawMax?b.max/b.rawMax:0; });
  const fullMax=buckets.reduce((s,b)=>s+b.max,0);
  const keepMax=buckets.filter(b=>b.i).reduce((s,b)=>s+b.max,0);
  const rows=students.map(s=>{ const sc=subjScores[s.id]||{}; const vals={}; let missing=0;
    buckets.forEach(b=>{ if(!b.asg.length||!b.rawMax||!b.max){ vals[b.key]=null; return; }
      let raw=0,has=false; b.asg.forEach(a=>{ const n=numOf(sc[a.id]); if(n!=null){ raw+=n; has=true; } else missing++; });
      vals[b.key]=has?Math.min(b.max,roundTo(raw/b.rawMax*b.max,dec)):null; });
    const keep=roundTo(buckets.filter(b=>b.i).reduce((t,b)=>t+(vals[b.key]||0),0),dec);
    const total=roundTo(keep+(vals.mid||0)+(vals.fin||0),dec);
    return {s,vals,keep,total,missing,grade:fullMax?gradeOf(total/fullMax*100):"-"};
  });
  return {buckets,rows,fullMax,keepMax};
}

  const applyStructure=(src)=>{

    const ind=src.ind.map(i=>({u:String(i.u),un:i.un||"",s:i.s,n:String(i.n),m:Number(i.m)||0,w:i.w||""})).filter(i=>i.m>0);
    const base={title:src.t||"",ind,mid:cfg?cfg.mid:20,fin:cfg?cfg.fin:30,dec:cfg?cfg.dec:0,map:{}};
    const keys=new Set(ind.map(i=>"i:"+indKey(i)));      // เก็บการเทียบเดิมที่ยังใช้ได้
    Object.entries(map).forEach(([k,v])=>{ if(v===""||v==="mid"||v==="fin"||keys.has(v)||(v.startsWith("u:")&&ind.some(i=>"u:"+i.u===v))) base.map[k]=v; });
    base.map=autoMapQ(list,base,base.map,false);
    save(base); setEditing(false); setPaste("");
    setToast({ok:true,text:"ใช้โครงสร้าง "+ind.length+" ตัวชี้วัด และเทียบงานอัตโนมัติแล้ว"});
  };
  const importPaste=()=>{ try{ applyStructure(JSON.parse(paste.trim())); }catch(e){ setToast({ok:false,text:"รูปแบบข้อความไม่ถูกต้อง"}); } };
  const setMap=(aid,v)=>{ const m={...map}; if(v==="__none") delete m[aid]; else m[aid]=v; save({...cfg,map:m}); };
  const runAuto=(overwrite)=>{ if(overwrite&&!window.confirm("ล้างการเทียบเดิมทั้งหมด แล้วให้ระบบเทียบใหม่?")) return;
    save({...cfg,map:autoMapQ(list,cfg,map,overwrite)}); setToast({ok:true,text:"เทียบงานอัตโนมัติเรียบร้อย — ตรวจทานได้ด้านล่าง"}); };

  const res=useMemo(()=>cfg?computeQ(students,list,subjScores,cfg,map):null,[cfg,students,list,subjScores]);

  const exportXlsx=()=>{
    const B=res.buckets; const dec=Number(cfg.dec)||0;
    const h1=["เลขที่","ชื่อ-สกุล",...B.filter(b=>b.i).map(b=>b.label+" ("+b.max+")"),"รวมเก็บ ("+res.keepMax+")","กลางภาค ("+(cfg.mid||0)+")","ปลายภาค ("+(cfg.fin||0)+")","รวม ("+res.fullMax+")","เกรด","สถานะนักเรียน"];
    const rows=res.rows.map(r=>[r.s.number,r.s.name,...B.filter(b=>b.i).map(b=>r.vals[b.key]==null?"":r.vals[b.key]),r.keep,r.vals.mid==null?"":r.vals.mid,r.vals.fin==null?"":r.vals.fin,r.total,r.grade,stuStatusOf(r.s).label]);
    const ws=XLSX.utils.aoa_to_sheet([h1,...rows]); ws["!cols"]=[{wch:7},{wch:26},...h1.slice(2).map(()=>({wch:13}))];
    markStatusRows(ws,res.rows.map(r=>r.s),h1.length);
    const m1=[["งานในระบบ","คะแนนเต็ม","เทียบกับ (Q-Info)","คะแนนเต็มใน Q-Info","ตัวคูณแปลง"]];
    list.forEach(a=>{ const v=map[a.id]; const b=B.find(b=>(b.i&&(v==="i:"+b.key||v==="u:"+b.i.u))||b.key===v);
      m1.push([a.title,a.max,v===undefined?"(ยังไม่เทียบ)":v===""?"ไม่นำไปคิด":v.startsWith("u:")?"ทั้งหน่วย "+v.slice(2):b?b.label:"",b?b.max:"",b&&b.factor?roundTo(b.factor,4):""]); });
    m1.push([]); m1.push(["ช่องคะแนน Q-Info","คะแนนเต็ม","งานที่เทียบ","คะแนนดิบเต็ม","ตัวคูณ"]);
    B.forEach(b=>m1.push([b.label,b.max,b.asg.map(a=>a.title).join(", ")||"— ไม่มีงาน —",b.rawMax,b.factor?roundTo(b.factor,4):""]));
    m1.push([]); m1.push(["สูตร: คะแนนตัวชี้วัด = (ผลรวมคะแนนงานที่เทียบ ÷ ผลรวมคะแนนเต็มของงาน) × คะแนนเต็มใน Q-Info  ปัดทศนิยม "+dec+" ตำแหน่ง"]);
    const ws2=XLSX.utils.aoa_to_sheet(m1); ws2["!cols"]=[{wch:32},{wch:11},{wch:40},{wch:14},{wch:10}];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"คะแนนแปลงQ-Info"); XLSX.utils.book_append_sheet(wb,ws2,"การเทียบงาน");
    XLSX.writeFile(wb,"QInfo_ภาค"+term+"_"+subj.name+"_"+subj.room+".xlsx");
  };
  const copyFill=async()=>{ const s=buildFillScript(subj,cfg,term,res,false); const ok=await copyText(s);
    if(ok) setToast({ok:true,text:"คัดลอกสคริปต์แล้ว — ไปวางใน Console ของ Q-Info เมนู 2.2.7"}); else setShowCode(s); };

  const unmapped=list.filter(a=>map[a.id]===undefined).length;
  const emptyB=res?res.buckets.filter(b=>b.max>0&&!b.asg.length):[];
  const opts=cfg?[
    ...cfg.ind.map(i=>({v:"i:"+indKey(i),t:indLabel(i)+" — เต็ม "+i.m})),
    ...[...new Set(cfg.ind.map(i=>String(i.u)))].filter(u=>cfg.ind.filter(i=>String(i.u)===u).length>1).map(u=>({v:"u:"+u,t:"ทั้งหน่วย "+u+" (ทุกตัวชี้วัดในหน่วย)"})),
    {v:"mid",t:"สอบกลางภาค — เต็ม "+(cfg.mid||0)},{v:"fin",t:"สอบปลายภาค — เต็ม "+(cfg.fin||0)},{v:"",t:"ไม่นำไปคิด"}]:[];
  const numIn={...inputStyle,width:72,padding:"6px 8px",textAlign:"center"};

  return <div style={{display:"grid",gap:14,gridTemplateColumns:"minmax(0,1fr)"}}>
    <SectionHead title="เทียบคะแนน Q-Info" right={<div className="seg">
      {["1","2"].map(t=><button key={t} className={term===t?"on":""} onClick={()=>{setTerm(t);setEditing(false);}}>ภาคเรียนที่ {t}</button>)}</div>}/>

    {/* ① โครงสร้าง */}
    <div style={panel}>
      <div style={panelHead}><span className="qi-step">1</span>โครงสร้างคะแนนใน Q-Info {cfg&&cfg.title?<span style={{fontSize:13,color:SUB,fontWeight:500}}>({cfg.title})</span>:null}</div>
      {(!cfg||editing) ? <div>
        {presets.length>0 && <Field label={"เลือกจากข้อมูลที่ดึงจาก Q-Info ปีการศึกษา 2569 ภาคเรียนที่ "+term}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <select style={{...inputStyle,flex:"1 1 220px",width:"auto"}} value={presetIdx} onChange={e=>setPresetIdx(e.target.value)}>
              <option value="">— เลือกวิชา —</option>
              {presets.map((p,i)=><option key={i} value={i}>{p.t} ({p.ind.length} ตัวชี้วัด / {p.ind.reduce((s,x)=>s+x.m,0)} คะแนน)</option>)}
            </select>
            <Btn variant="primary" disabled={presetIdx===""} onClick={()=>applyStructure(presets[Number(presetIdx)])}><Save size={15}/>ใช้โครงสร้างนี้</Btn>
          </div></Field>}
        <details style={{fontSize:13.5,color:C.text}} open={!presets.length}>
          <summary style={{cursor:"pointer",fontWeight:600,color:C.navy,marginBottom:8}}>ดึงโครงสร้างวิชาอื่น / ภาคเรียนใหม่ จาก Q-Info</summary>
          <ol style={{margin:"6px 0 10px",paddingLeft:20,lineHeight:1.7,color:SUB}}>
            <li>เปิด Q-Info → เลือกภาคเรียน → เมนู <b>2.2.2 โครงสร้างรายวิชา</b> → คลิกวิชา</li>
            <li>กด <kbd>F12</kbd> → แท็บ Console → วางสคริปต์ด้านล่าง → <kbd>Enter</kbd> (ครั้งแรก Chrome อาจให้พิมพ์ allow pasting)</li>
            <li>กลับมาวางข้อความที่ได้ในช่องด้านล่าง แล้วกด “นำเข้า”</li>
          </ol>
          <div style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:10}}>
            <pre className="qi-code" style={{flex:1}}>{QINFO_GRAB_SCRIPT}</pre>
            <Btn variant="soft" size="sm" onClick={async()=>setToast({ok:await copyText(QINFO_GRAB_SCRIPT),text:"คัดลอกสคริปต์ดึงโครงสร้างแล้ว"})}><Copy size={14}/>คัดลอก</Btn>
          </div>
          <textarea style={{...inputStyle,minHeight:80,fontSize:12.5}} value={paste} onChange={e=>setPaste(e.target.value)} placeholder='วางข้อความ {"t":"...","ind":[...]} ที่นี่'/>
          <div style={{display:"flex",gap:8,marginTop:8}}><Btn variant="primary" size="sm" disabled={!paste.trim()} onClick={importPaste}><Upload size={14}/>นำเข้า</Btn>
            {cfg && <Btn variant="ghost" size="sm" onClick={()=>setEditing(false)}>ยกเลิก</Btn>}</div>
        </details>
      </div> : <div>
        <div style={{...tableWrap,marginBottom:12}}><table style={{...tableStyle,fontSize:13.5}}>
          <thead><tr><th style={th}>หน่วย</th><th style={th}>ตัวชี้วัด</th><th style={th}>เต็ม</th><th style={{...th,textAlign:"left"}}>ภาระงานใน Q-Info</th></tr></thead>
          <tbody>{cfg.ind.map(i=><tr key={indKey(i)} className="tl-row">
            <td style={{...td,textAlign:"center",padding:"7px 8px"}}>{i.u}</td>
            <td style={{...td,whiteSpace:"nowrap",padding:"7px 8px"}}>{i.s}/{i.n}</td>
            <td style={{...td,textAlign:"center",fontWeight:700,color:C.accent,padding:"7px 8px"}}>{i.m}</td>
            <td style={{...td,fontSize:12.5,color:SUB,padding:"7px 8px"}}><b style={{color:C.text}}>{i.un}</b> · {i.w}</td></tr>)}</tbody>
        </table></div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap",alignItems:"center",fontSize:13.5}}>
          <span>คะแนนเก็บ <b>{cfg.ind.reduce((s,i)=>s+i.m,0)}</b></span>
          <label style={{display:"flex",alignItems:"center",gap:6}}>กลางภาค<input style={numIn} type="number" value={cfg.mid} onChange={e=>save({...cfg,mid:Number(e.target.value)||0})}/></label>
          <label style={{display:"flex",alignItems:"center",gap:6}}>ปลายภาค<input style={numIn} type="number" value={cfg.fin} onChange={e=>save({...cfg,fin:Number(e.target.value)||0})}/></label>
          <label style={{display:"flex",alignItems:"center",gap:6}}>ปัดทศนิยม<select style={{...numIn,width:64}} value={cfg.dec||0} onChange={e=>save({...cfg,dec:Number(e.target.value)})}><option value={0}>0</option><option value={1}>1</option><option value={2}>2</option></select></label>
          <Btn variant="ghost" size="sm" onClick={()=>setEditing(true)} style={{marginLeft:"auto"}}><Pencil size={14}/>เปลี่ยนโครงสร้าง</Btn>
        </div>
      </div>}
    </div>

    {/* ② เทียบงาน */}
    {cfg && !editing && <div style={panel}>
      <div style={{...panelHead,flexWrap:"wrap"}}><span className="qi-step">2</span>เทียบงานในระบบ → ช่องคะแนน Q-Info
        <div style={{marginLeft:"auto",display:"flex",gap:6}}>
          <Btn variant="accent" size="sm" onClick={()=>runAuto(false)}><Zap size={14}/>เทียบอัตโนมัติ{unmapped?" ("+unmapped+")":""}</Btn>
          <Btn variant="ghost" size="sm" onClick={()=>runAuto(true)}>เทียบใหม่ทั้งหมด</Btn>
        </div></div>
      {list.length===0 && <div style={{color:SUB,fontSize:14}}>ยังไม่มีงานในเมนู “เช็คคะแนน”</div>}
      {list.map(a=>{ const v=map[a.id]; return <div key={a.id} className="qi-map">
        <div style={{minWidth:0}}><div style={{fontWeight:600,fontSize:14.5,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</div>
          <div style={{fontSize:12,color:SUB}}>เต็ม {a.max}</div></div>
        <select style={{...inputStyle,padding:"8px 10px",fontSize:13.5,borderColor:v===undefined?"#e0a458":C.border,background:v===undefined?"#fff8ec":"#fff"}} value={v===undefined?"__none":v} onChange={e=>setMap(a.id,e.target.value)}>
          <option value="__none">— ยังไม่เทียบ —</option>
          {opts.map(o=><option key={o.v} value={o.v}>{o.t}</option>)}
        </select>
      </div>; })}
      {res && <div style={{marginTop:12,display:"flex",flexWrap:"wrap",gap:6}}>
        {res.buckets.filter(b=>b.max>0).map(b=><span key={b.key} title={b.asg.map(a=>a.title).join(", ")} style={{fontSize:12,padding:"4px 9px",borderRadius:20,fontWeight:600,
          background:b.asg.length?"#e6f4ec":"#fbeae8",color:b.asg.length?"#2e7d52":"#c0392b"}}>
          {b.label}: {b.asg.length?(b.asg.length+" งาน · "+b.rawMax+" → "+b.max):"ยังไม่มีงาน"}</span>)}
      </div>}
      {emptyB.length>0 && <div style={{marginTop:8,fontSize:12.5,color:"#c0392b"}}>ช่องที่ยังไม่มีงานเทียบ จะเว้นว่างตอนกรอก Q-Info</div>}
    </div>}

    {/* ③ ผลการแปลง */}
    {cfg && !editing && res && <div style={panel}>
      <div style={{...panelHead,flexWrap:"wrap"}}><span className="qi-step">3</span>คะแนนที่แปลงแล้ว (พร้อมกรอก Q-Info)
        <div style={{marginLeft:"auto",display:"flex",gap:6,flexWrap:"wrap"}}>
          <Btn variant="accent" size="sm" onClick={exportXlsx}><Download size={14}/>Export .xlsx</Btn>
          <Btn variant="primary" size="sm" onClick={copyFill}><Copy size={14}/>คัดลอกสคริปต์กรอก Q-Info</Btn>
        </div></div>
      <div style={{...tableWrap,maxHeight:"60vh"}}><table style={{...tableStyle,fontSize:13.5}}>
        <thead><tr>
          <th style={{...th,width:40,zIndex:3}}>#</th>
          <th style={{...th,textAlign:"left",minWidth:150,left:0,zIndex:3}}>ชื่อ-สกุล</th>
          {res.buckets.filter(b=>b.i).map(b=><th key={b.key} style={{...th,minWidth:74,fontSize:12}}>{b.i.s}/{b.i.n}<div style={{fontWeight:400,fontSize:11,color:"#c7d4e2"}}>หน่วย {b.i.u} · {b.max}</div></th>)}
          <th style={{...th,background:C.navyDark,fontSize:12}}>เก็บ<div style={{fontWeight:400,fontSize:11,color:"#c7d4e2"}}>{res.keepMax}</div></th>
          <th style={{...th,fontSize:12}}>กลางภาค<div style={{fontWeight:400,fontSize:11,color:"#c7d4e2"}}>{cfg.mid||0}</div></th>
          <th style={{...th,fontSize:12}}>ปลายภาค<div style={{fontWeight:400,fontSize:11,color:"#c7d4e2"}}>{cfg.fin||0}</div></th>
          <th style={{...th,background:C.navyDark,fontSize:12}}>รวม<div style={{fontWeight:400,fontSize:11,color:"#c7d4e2"}}>{res.fullMax}</div></th>
          <th style={{...th,background:C.accent,fontSize:12}}>เกรด</th>
        </tr></thead>
        <tbody>{res.rows.map(r=><tr key={r.s.id} className="tl-row">
          <td style={{...td,textAlign:"center",color:SUB,padding:"7px 6px"}}>{r.s.number}</td>
          <td style={{...td,position:"sticky",left:0,background:"inherit",whiteSpace:"nowrap",padding:"7px 10px"}}>{r.s.name}</td>
          {res.buckets.filter(b=>b.i).map(b=><td key={b.key} style={{...td,textAlign:"center",padding:"7px 6px",color:r.vals[b.key]==null?"#c0c8d2":C.text}}>{r.vals[b.key]==null?"–":r.vals[b.key]}</td>)}
          <td style={{...td,textAlign:"center",fontWeight:700,background:C.navySoft,padding:"7px 6px"}}>{r.keep}</td>
          <td style={{...td,textAlign:"center",padding:"7px 6px"}}>{r.vals.mid==null?"–":r.vals.mid}</td>
          <td style={{...td,textAlign:"center",padding:"7px 6px"}}>{r.vals.fin==null?"–":r.vals.fin}</td>
          <td style={{...td,textAlign:"center",fontWeight:700,background:C.navySoft,padding:"7px 6px"}}>{r.total}</td>
          <td style={{...td,textAlign:"center",fontWeight:700,color:C.accent,background:C.accentSoft,padding:"7px 6px"}}>{r.grade}</td>
        </tr>)}</tbody>
      </table></div>
      <details style={{marginTop:12,fontSize:13.5}}>
        <summary style={{cursor:"pointer",fontWeight:600,color:C.navy}}>วิธีกรอกลง Q-Info อัตโนมัติ (ภาคเรียนที่ {term})</summary>
        <ol style={{margin:"8px 0 0",paddingLeft:20,lineHeight:1.75,color:SUB}}>
          <li>กด <b>คัดลอกสคริปต์กรอก Q-Info</b> (ปุ่มด้านบน)</li>
          <li>เปิด Q-Info → เลือก <b>ภาคเรียนที่ {term}</b> → เมนู <b>2.2.7 ประเมินตัวชี้วัด</b> → คลิกวิชา <b>{cfg.title||subj.name+" "+subj.room}</b></li>
          <li>กด <kbd>F12</kbd> → Console → วาง → <kbd>Enter</kbd> → ยืนยัน · ระบบจะกรอกทุกแผ่นงาน (ตัวชี้วัด + คะแนนสอบ) ให้เอง จับคู่ด้วยชื่อ-สกุล</li>
          <li>ตรวจตัวเลข แล้วกดปุ่ม <b>บันทึก</b> ของ Q-Info (สคริปต์ไม่กดบันทึกให้)</li>
        </ol>
        <div style={{marginTop:6,color:SUB}}>คะแนนแปลงจากสูตร (ผลรวมคะแนนงาน ÷ คะแนนเต็มงาน) × คะแนนเต็มตัวชี้วัด · นักเรียนที่ไม่มีคะแนนงานในช่องนั้นเลยจะเว้นว่าง · งานที่ไม่ได้ส่งนับเป็น 0</div>
      </details>
    </div>}

    <Modal open={!!showCode} onClose={()=>setShowCode(null)} title="คัดลอกสคริปต์ด้วยตนเอง" width={640}>
      <textarea readOnly style={{...inputStyle,minHeight:260,fontSize:11.5,fontFamily:"monospace"}} value={showCode||""} onFocus={e=>e.target.select()}/>
    </Modal>
    {toast && <div className="qs-toast" style={{background:toast.ok?"#2e7d52":"#c0392b"}}>{toast.text}</div>}
  </div>;
}

/* ---------- SETTINGS ---------- */
/* ==================== งานแก้ 0 ร มส ==================== */
const FIX_STATUS=[
  {v:"notassigned",label:"ยังไม่มอบงาน",color:"#c0392b",bg:"#fbeae8"},
  {v:"assigned",label:"มอบแล้ว",color:"#b7791f",bg:"#fdf3dc"},
  {v:"passed",label:"แก้ผ่านแล้ว",color:"#2e7d52",bg:"#e6f4ec"},
];
const fixStatusOf=(v)=>FIX_STATUS.find(x=>x.v===v)||FIX_STATUS[0];
const FIX_XL={notassigned:{fill:"FBEAE8",font:"C0392B"},assigned:{fill:"FDF3DC",font:"B7791F"},passed:{fill:"E6F4EC",font:"2E7D52"}};
const FIX_GRADE={"0":{color:"#c0392b",bg:"#fbeae8"},"ร":{color:"#b7791f",bg:"#fdf3dc"},"มส":{color:"#7a3ea0",bg:"#f1e8f7"}};
const localToday=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const normKey=(s)=>String(s==null?"":s).replace(/\s+/g,"");
const hash32=(s,seed)=>{ let h=seed; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(36); };
/* รหัสเอกสาร = hash ของ (ชื่อนักเรียน|รหัสวิชา|ภาคเรียน) → นำเข้าไฟล์ซ้ำจะอัปเดตรายการเดิม ไม่เกิดรายการซ้ำ และไม่ทับภาระงาน/สถานะที่ตั้งไว้ */
const fixKeyOf=(f)=>[normKey(f.studentName),normKey(f.subjectCode),normKey(f.term)].join("|");
const fixIdOf=(f)=>{ const k=fixKeyOf(f); return "fx_"+hash32(k,5381)+hash32(k.split("").reverse().join(""),33); };
const isOverdue=(f)=>f.status!=="passed" && !!f.dueDate && f.dueDate<localToday();
const daysLate=(f)=>Math.round((new Date(localToday()+"T00:00:00")-new Date(f.dueDate+"T00:00:00"))/864e5);

/* หัวคอลัมน์ที่รองรับ (ไฟล์จาก “ระบบจัดการผลการเรียน → ส่งออกให้ Teaching Log” หรือ Excel ของหน้าตรวจสอบ/หน้าหลัก) */
const FIX_COLS={
  name:["ชื่อ-สกุล","ชื่อ - สกุล","ชื่อสกุล","นักเรียน"],
  level:["ชั้น"],
  code:["รหัสวิชา"],
  sname:["ชื่อวิชา"],
  term:["ภาคเรียน/ปีการศึกษา","ภาคเรียน"],
  grade:["ผลการเรียน","ผลการเรียนเดิม"],
  teacher:["ครูผู้สอน"],
  srcStatus:["สถานะการแก้ไข","สถานะ"],
  newResult:["ผลการเรียนใหม่"],
};
function parseFixWorkbook(wb){
  const map=new Map(), skipped=[];
  wb.SheetNames.forEach(sn=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:""});
    let hi=-1;
    for(let i=0;i<Math.min(rows.length,15);i++){
      const t=(rows[i]||[]).map(c=>String(c).trim());
      if(t.includes("รหัสวิชา") && t.some(x=>FIX_COLS.name.includes(x)) && t.some(x=>FIX_COLS.grade.includes(x))){ hi=i; break; }
    }
    if(hi<0) return;
    const head=rows[hi].map(c=>String(c).trim());
    const ix={}; Object.keys(FIX_COLS).forEach(k=>{ ix[k]=-1; for(const n of FIX_COLS[k]){ const i=head.indexOf(n); if(i>=0){ ix[k]=i; break; } } });
    rows.slice(hi+1).forEach((r,j)=>{
      const g=(k)=>ix[k]>=0?String(r[ix[k]]==null?"":r[ix[k]]).trim():"";
      const studentName=g("name").replace(/\s+/g," "), subjectCode=g("code");
      if(!studentName && !subjectCode) return;                       // แถวว่าง
      const grade=g("grade");
      if(!studentName||!subjectCode){ skipped.push(sn+" แถว "+(hi+j+2)+": ไม่มีชื่อหรือรหัสวิชา"); return; }
      if(!["0","ร","มส"].includes(grade)){ skipped.push(sn+" แถว "+(hi+j+2)+": ผลการเรียน “"+grade+"” ไม่ใช่ 0 / ร / มส"); return; }
      const it={studentName,level:g("level"),subjectCode,subjectName:g("sname"),term:g("term"),grade,teacher:g("teacher"),srcStatus:g("srcStatus"),newResult:g("newResult")};
      map.set(fixIdOf(it),it);                                        // ซ้ำ (เช่น หลายชีต) เก็บอันสุดท้าย
    });
  });
  return {items:[...map.values()],skipped};
}

function FixView({fixes,setFixes,taskPresets,setTaskPresets}){
  const persist=usePersist();
  const [f,setF]=useState({q:"",subject:"",grade:"",status:"",overdue:false});
  const [sel,setSel]=useState({});
  const [edit,setEdit]=useState(null);
  const [bulk,setBulk]=useState(null);
  const [imp,setImp]=useState(null);
  const [busy,setBusy]=useState(false);
  const fileRef=useRef();

  const save=async(promise)=>{ try{ await promise; }
    catch(e){ console.error(e); alert("บันทึกลงฐานข้อมูลไม่สำเร็จ: "+(e.message||e)+"\n(ตรวจสอบ Firestore Rules ว่าอนุญาตคอลเลกชัน fixes)"); } };
  /* จำข้อความภาระงานที่เคยกรอก (ล่าสุดอยู่หน้าสุด สูงสุด 40 รายการ) */
  const remember=(t)=>{ t=(t||"").trim(); if(!t) return; const next=[t,...taskPresets.filter(x=>x!==t)].slice(0,40); setTaskPresets(next); save(persist.setTaskPresets(next)); };
  const forget=(t)=>{ const next=taskPresets.filter(x=>x!==t); setTaskPresets(next); save(persist.setTaskPresets(next)); };
  const presetBox=(onPick)=>taskPresets.length>0 && <div style={{marginTop:-6,marginBottom:14}}>
    <div style={{fontSize:12.5,color:SUB,fontWeight:600,marginBottom:5}}>ข้อความสำเร็จรูป (แตะเพื่อใช้ · กด × เพื่อลบ)</div>
    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>{taskPresets.map(t=><span key={t} style={{display:"inline-flex",alignItems:"center",background:C.navySoft,borderRadius:20,maxWidth:"100%"}}>
      <button onClick={()=>onPick(t)} style={{background:"none",border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:13,color:C.navy,fontWeight:600,padding:"5px 4px 5px 11px",textAlign:"left",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:240}}>{t}</button>
      <button onClick={()=>forget(t)} title="ลบข้อความนี้" style={{background:"none",border:"none",cursor:"pointer",color:SUB,fontSize:15,padding:"3px 9px 3px 4px"}}>×</button></span>)}</div></div>;
  const patchMany=(ids,patch)=>{ if(!ids.length) return Promise.resolve();
    const p={...patch,updatedAt:Date.now()}, set=new Set(ids);
    setFixes(prev=>prev.map(x=>set.has(x.id)?{...x,...p}:x));
    return save(persist.updateFixes(ids,p)); };

  const subjects=useMemo(()=>{ const m=new Map(); fixes.forEach(x=>{ if(!m.has(x.subjectCode)) m.set(x.subjectCode,x.subjectName||""); });
    return [...m.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]),"th")); },[fixes]);
  const list=useMemo(()=>{ const q=normKey(f.q).toLowerCase();
    return fixes.filter(x=>(!f.subject||x.subjectCode===f.subject)&&(!f.grade||x.grade===f.grade)&&(!f.status||x.status===f.status)&&(!f.overdue||isOverdue(x))
      &&(!q||(normKey(x.studentName)+x.subjectCode+normKey(x.subjectName)).toLowerCase().includes(q)))
      .sort((a,b)=>String(a.subjectCode).localeCompare(String(b.subjectCode),"th")||String(a.level).localeCompare(String(b.level),"th",{numeric:true})||String(a.studentName).localeCompare(String(b.studentName),"th")); },[fixes,f]);
  const cnt=useMemo(()=>({all:fixes.length,notassigned:fixes.filter(x=>x.status==="notassigned").length,assigned:fixes.filter(x=>x.status==="assigned").length,
    passed:fixes.filter(x=>x.status==="passed").length,overdue:fixes.filter(isOverdue).length}),[fixes]);
  const selIds=Object.keys(sel).filter(k=>sel[k]&&fixes.some(x=>x.id===k));
  const shown=list.slice(0,400);
  const allShownSel=shown.length>0&&shown.every(x=>sel[x.id]);
  const toggleAll=()=>{ const n={...sel}; shown.forEach(x=>{ n[x.id]=!allShownSel; }); setSel(n); };

  /* ----- นำเข้า ----- */
  const onFile=(e)=>{ const file=e.target.files[0]; e.target.value=""; if(!file) return;
    const reader=new FileReader();
    reader.onload=(ev)=>{ try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
      const {items,skipped}=parseFixWorkbook(wb);
      if(!items.length){ alert("ไม่พบรายการที่นำเข้าได้ในไฟล์นี้\n\nไฟล์ต้องมีหัวคอลัมน์ ชื่อ-สกุล, รหัสวิชา, ผลการเรียน\n(ดาวน์โหลดจากระบบจัดการผลการเรียน → ส่งออก → ส่งออกให้ Teaching Log)"+(skipped.length?"\n\nข้ามไป "+skipped.length+" แถว เช่น "+skipped[0]:"")); return; }
      const have=new Set(fixes.map(x=>x.id));
      const newN=items.filter(it=>!have.has(fixIdOf(it))).length;
      setImp({items,skipped,newN,updN:items.length-newN,autoPass:true,fileName:file.name,doneN:items.filter(it=>it.srcStatus==="แก้ไขแล้ว").length});
    }catch(err){ alert("อ่านไฟล์ไม่สำเร็จ: "+err.message); } };
    reader.readAsArrayBuffer(file); };
  const confirmImport=async()=>{ setBusy(true);
    const now=Date.now(), byId=new Map(fixes.map(x=>[x.id,x])), recs=[];
    imp.items.forEach(it=>{ const id=fixIdOf(it), old=byId.get(id), srcDone=it.srcStatus==="แก้ไขแล้ว";
      const base={studentName:it.studentName,level:it.level,subjectCode:it.subjectCode,subjectName:it.subjectName,term:it.term,grade:it.grade,teacher:it.teacher,
        srcStatus:it.srcStatus,newResult:it.newResult||(old&&old.newResult)||"",importedAt:now,updatedAt:now};
      if(old){ const r={...old,...base}; if(imp.autoPass&&srcDone&&old.status!=="passed") r.status="passed"; recs.push(r); }
      else recs.push({id,...base,task:"",dueDate:"",status:(imp.autoPass&&srcDone)?"passed":"notassigned",note:"",createdAt:now});
    });
    setFixes(prev=>{ const m=new Map(prev.map(x=>[x.id,x])); recs.forEach(r=>m.set(r.id,r)); return [...m.values()]; });
    await save(persist.setFixes(recs));
    setBusy(false); setImp(null); };

  /* ----- มอบภาระงาน / เปลี่ยนสถานะ ----- */
  const openBulk=()=>{ const ids=selIds.filter(id=>{ const x=fixes.find(y=>y.id===id); return x&&x.status!=="passed"; });
    if(!ids.length) return alert("เลือกรายการที่ยังไม่ “แก้ผ่านแล้ว” ก่อน (ติ๊กหน้ารายชื่อ)");
    setBulk({ids,task:"",dueDate:"",markAssigned:true,skipped:selIds.length-ids.length}); };
  const applyBulk=async()=>{ if(!bulk.task.trim()&&!bulk.dueDate) return alert("กรอกภาระงานหรือวันครบกำหนดอย่างน้อย 1 อย่าง");
    remember(bulk.task);
    const patch={}; if(bulk.task.trim()) patch.task=bulk.task.trim(); if(bulk.dueDate) patch.dueDate=bulk.dueDate;
    const na=bulk.ids.filter(id=>{ const x=fixes.find(y=>y.id===id); return x&&x.status==="notassigned"; });
    const rest=bulk.ids.filter(id=>!na.includes(id));
    if(bulk.markAssigned) await patchMany(na,{...patch,status:"assigned"}); else await patchMany(na,patch);
    await patchMany(rest,patch);
    setBulk(null); setSel({}); };
  const bulkStatus=(v)=>{ if(!v||!selIds.length) return;
    if(!window.confirm("ตั้งสถานะ “"+fixStatusOf(v).label+"” ให้ "+selIds.length+" รายการที่เลือก?")) return;
    patchMany(selIds,{status:v}); setSel({}); };
  const removeSel=()=>{ if(!selIds.length) return;
    if(!window.confirm("ลบ "+selIds.length+" รายการที่เลือกออกจากระบบ? (ไม่กระทบระบบจัดการผลการเรียน)")) return;
    const set=new Set(selIds); setFixes(prev=>prev.filter(x=>!set.has(x.id))); save(persist.deleteFixes(selIds)); setSel({}); };
  const openEdit=(x)=>setEdit({id:x.id,task:x.task||"",dueDate:x.dueDate||"",status:x.status||"notassigned",newResult:x.newResult||"",note:x.note||""});
  const saveEdit=async()=>{ const {id,...p}=edit; remember(p.task); await patchMany([id],{task:p.task.trim(),dueDate:p.dueDate,status:p.status,newResult:p.newResult.trim(),note:p.note.trim()}); setEdit(null); };

  /* ----- ส่งออก ----- */
  const exportXlsx=()=>{ if(!list.length) return alert("ไม่มีรายการให้ส่งออก");
    const H=["ที่","ชื่อ-สกุล","ชั้น","รหัสวิชา","ชื่อวิชา","ภาคเรียน/ปีการศึกษา","ผลการเรียนเดิม","ภาระงาน","กำหนดส่ง","สถานะงานแก้","ผลการเรียนใหม่","หมายเหตุ","ครูผู้สอน"];
    const rows=list.map((x,i)=>[i+1,x.studentName,x.level||"",x.subjectCode,x.subjectName||"",x.term||"",x.grade,x.task||"",x.dueDate?fmtDate(x.dueDate):"",
      fixStatusOf(x.status).label+(isOverdue(x)?" (เกินกำหนด)":""),x.newResult||"",x.note||"",x.teacher||""]);
    const ws=XLSX.utils.aoa_to_sheet([H,...rows]);
    ws["!cols"]=[5,26,8,11,28,16,12,32,14,24,12,26,20].map(w=>({wch:w}));
    H.forEach((_,c)=>{ const ref=XLSX.utils.encode_cell({r:0,c}); ws[ref].s={fill:{patternType:"solid",fgColor:{rgb:"1F3A5F"}},font:{color:{rgb:"FFFFFF"},bold:true},alignment:{horizontal:"center",vertical:"center"}}; });
    list.forEach((x,i)=>{ const ref=XLSX.utils.encode_cell({r:i+1,c:9}); const c0=FIX_XL[x.status]||FIX_XL.notassigned;
      if(ws[ref]) ws[ref].s={fill:{patternType:"solid",fgColor:{rgb:c0.fill}},font:{color:{rgb:c0.font},bold:true}}; });
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"งานแก้ 0 ร มส");
    XLSX.writeFile(wb,"งานแก้_0_ร_มส_"+localToday()+".xlsx"); };

  const chip=(label,n,on,onClick,color)=><button onClick={onClick} style={{flex:"1 1 110px",textAlign:"left",padding:"9px 12px",borderRadius:10,cursor:"pointer",fontFamily:"inherit",
    border:"2px solid "+(on?color:C.border),background:on?color+"14":"#fff"}}><div style={{fontSize:12.5,color:SUB,fontWeight:600}}>{label}</div><div style={{fontSize:22,fontWeight:700,color}}>{n}</div></button>;

  return <div>
    <SectionHead title="งานแก้ 0 ร มส" right={<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
      <Btn variant="accent" onClick={()=>fileRef.current&&fileRef.current.click()}><Upload size={16}/>นำเข้าไฟล์ (.xlsx)</Btn>
      <Btn variant="ghost" onClick={exportXlsx} disabled={!list.length}><Download size={16}/>ส่งออก Excel{list.length!==fixes.length?" ("+list.length+")":""}</Btn>
      <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" onChange={onFile} style={{display:"none"}}/>
    </div>}/>

    {fixes.length===0 ? <div style={{...panel,textAlign:"center",color:SUB,lineHeight:1.7}}>
      <div style={{fontSize:16,fontWeight:700,color:C.navy,marginBottom:6}}>ยังไม่มีรายการ</div>
      1) ที่ระบบจัดการผลการเรียน เมนู <b>ส่งออก &amp; พิมพ์ → ส่งออกให้ Teaching Log</b> (หรือหน้าตรวจสอบของครู ปุ่ม “ไฟล์สำหรับ Teaching Log”)<br/>
      2) กด <b>นำเข้าไฟล์ (.xlsx)</b> ด้านบน แล้วเลือกไฟล์ที่ดาวน์โหลดมา<br/>
      3) ติ๊กเลือกนักเรียน → <b>มอบภาระงาน</b> พร้อมวันครบกำหนด แล้วติดตามสถานะ
    </div> : <>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
        {chip("ทั้งหมด",cnt.all,!f.status&&!f.overdue,()=>setF({...f,status:"",overdue:false}),C.navy)}
        {chip("ยังไม่มอบงาน",cnt.notassigned,f.status==="notassigned",()=>setF({...f,status:f.status==="notassigned"?"":"notassigned",overdue:false}),"#c0392b")}
        {chip("มอบแล้ว",cnt.assigned,f.status==="assigned",()=>setF({...f,status:f.status==="assigned"?"":"assigned",overdue:false}),"#b7791f")}
        {chip("แก้ผ่านแล้ว",cnt.passed,f.status==="passed",()=>setF({...f,status:f.status==="passed"?"":"passed",overdue:false}),"#2e7d52")}
        {chip("เกินกำหนด",cnt.overdue,f.overdue,()=>setF({...f,status:"",overdue:!f.overdue}),"#d9480f")}
      </div>
      <div style={{...panel,padding:12,marginBottom:12,display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10}}>
        <input style={inputStyle} placeholder="ค้นหาชื่อ / วิชา" value={f.q} onChange={e=>setF({...f,q:e.target.value})}/>
        <select style={inputStyle} value={f.subject} onChange={e=>setF({...f,subject:e.target.value})}><option value="">ทุกวิชา</option>{subjects.map(([c,n])=><option key={c} value={c}>{c} {n}</option>)}</select>
        <select style={inputStyle} value={f.grade} onChange={e=>setF({...f,grade:e.target.value})}><option value="">ทั้ง 0 / ร / มส</option><option value="0">0</option><option value="ร">ร</option><option value="มส">มส</option></select>
      </div>

      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:10}}>
        <label style={{display:"flex",alignItems:"center",gap:6,fontSize:14,color:C.navy,fontWeight:600,cursor:"pointer"}}><input type="checkbox" checked={allShownSel} onChange={toggleAll} style={{width:18,height:18}}/>เลือกทั้งหมดที่แสดง ({shown.length})</label>
        <div style={{flex:1}}/>
        {selIds.length>0 && <>
          <span style={{fontSize:13.5,color:SUB}}>เลือก {selIds.length} รายการ</span>
          <Btn size="sm" variant="accent" onClick={openBulk}><Pencil size={14}/>มอบภาระงาน</Btn>
          <select value="" onChange={e=>bulkStatus(e.target.value)} style={{...inputStyle,width:"auto",padding:"6px 8px",fontSize:13}}><option value="">ตั้งสถานะ…</option>{FIX_STATUS.map(s=><option key={s.v} value={s.v}>{s.label}</option>)}</select>
          <Btn size="sm" variant="danger" onClick={removeSel}><Trash2 size={14}/>ลบ</Btn>
        </>}
      </div>

      <div style={{...tableWrap}}>
        {shown.map(x=>{ const st=fixStatusOf(x.status), gc=FIX_GRADE[x.grade]||FIX_GRADE["0"], od=isOverdue(x);
          return <div key={x.id} className="tl-row" style={{display:"flex",gap:10,alignItems:"flex-start",padding:"11px 12px",borderTop:"1px solid "+C.border,flexWrap:"wrap"}}>
            <input type="checkbox" checked={!!sel[x.id]} onChange={e=>setSel({...sel,[x.id]:e.target.checked})} style={{width:18,height:18,marginTop:3}}/>
            <div style={{flex:"1 1 240px",minWidth:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                <b style={{color:C.navy,fontSize:15.5}}>{x.studentName}</b>
                <span style={{background:gc.bg,color:gc.color,fontWeight:700,fontSize:12.5,padding:"2px 9px",borderRadius:20}}>{x.grade}</span>
                {x.newResult && <span style={{fontSize:12.5,color:"#2e7d52",fontWeight:600}}>→ {x.newResult}</span>}
              </div>
              <div style={{fontSize:13,color:SUB}}>{x.level?x.level+" · ":""}{x.subjectCode} {x.subjectName} · ภาคเรียน {x.term||"—"}</div>
              <div style={{fontSize:13.5,marginTop:3,color:x.task?C.text:"#9aa5b1"}}>{x.task?"📌 "+x.task:"ยังไม่ระบุภาระงาน"}
                {x.dueDate && <span style={{marginLeft:8,fontWeight:600,color:od?"#d9480f":SUB}}>· ส่งภายใน {fmtDate(x.dueDate)}{od?" (เกิน "+daysLate(x)+" วัน)":""}</span>}</div>
              {x.note && <div style={{fontSize:12.5,color:SUB}}>📝 {x.note}</div>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <select value={x.status||"notassigned"} onChange={e=>patchMany([x.id],{status:e.target.value})} style={{fontFamily:"inherit",fontSize:13.5,fontWeight:700,padding:"6px 8px",borderRadius:8,border:"1px solid "+C.border,color:st.color,background:st.bg,cursor:"pointer"}}>
                {FIX_STATUS.map(o=><option key={o.v} value={o.v}>{o.label}</option>)}</select>
              <button onClick={()=>openEdit(x)} title="แก้ไขรายละเอียด" style={{background:"none",border:"none",color:C.navy,cursor:"pointer",padding:4}}><Pencil size={17}/></button>
            </div>
          </div>; })}
        {shown.length===0 && <div style={{padding:30,textAlign:"center",color:SUB}}>ไม่พบรายการตามตัวกรอง</div>}
      </div>
      {list.length>shown.length && <div style={{textAlign:"center",color:SUB,fontSize:13,marginTop:8}}>แสดง {shown.length} จาก {list.length} รายการ — ใช้ตัวกรองเพื่อดูส่วนที่เหลือ</div>}
    </>}

    <Modal open={!!imp} onClose={()=>!busy&&setImp(null)} title="นำเข้างานแก้ 0 ร มส" width={520}>
      {imp && <div>
        <div style={{fontSize:13.5,color:SUB,marginBottom:10}}>ไฟล์: {imp.fileName}</div>
        <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:110,...panel,padding:10,textAlign:"center"}}><div style={{fontSize:12.5,color:SUB}}>เพิ่มใหม่</div><div style={{fontSize:24,fontWeight:700,color:"#2e7d52"}}>{imp.newN}</div></div>
          <div style={{flex:1,minWidth:110,...panel,padding:10,textAlign:"center"}}><div style={{fontSize:12.5,color:SUB}}>มีอยู่แล้ว (อัปเดตข้อมูลเดิม)</div><div style={{fontSize:24,fontWeight:700,color:C.navy}}>{imp.updN}</div></div>
          <div style={{flex:1,minWidth:110,...panel,padding:10,textAlign:"center"}}><div style={{fontSize:12.5,color:SUB}}>ข้าม</div><div style={{fontSize:24,fontWeight:700,color:imp.skipped.length?"#c0392b":SUB}}>{imp.skipped.length}</div></div>
        </div>
