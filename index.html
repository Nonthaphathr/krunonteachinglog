/* ---------- ธีมสี / ค่าคงที่ ---------- */

};

const CARD_COLORS = ["#1f3a5f","#2c6e9c","#c2703d","#3c7a5a","#7a3ea0","#b05c3a"];

const uid = () => Math.random().toString(36).slice(2,10);
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtDate = (s) => { if(!s) return ""; const d=new Date(s+"T00:00:00");
  return d.toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"}); };

/* แปลงคำอ่านเลขไทย / เลขไทย ๑๒๓ -> ตัวเลขอารบิก  (คืนค่าเดิมถ้าแปลงไม่ได้) */
const TH_DIGIT={ศูนย์:0,หนึ่ง:1,เอ็ด:1,สอง:2,ยี่:2,สาม:3,สี่:4,ห้า:5,หก:6,เจ็ด:7,แปด:8,เก้า:9};
const TH_UNIT={สิบ:10,ร้อย:100,พัน:1000,หมื่น:10000,แสน:100000,"ล้าน":1000000};
const TH_NUM={"๐":"0","๑":"1","๒":"2","๓":"3","๔":"4","๕":"5","๖":"6","๗":"7","๘":"8","๙":"9"};
function evalThaiTokens(text){
  text=text.replace(/\s+/g,""); if(text==="") return null;
  const words=[...Object.keys(TH_DIGIT),...Object.keys(TH_UNIT)].sort((a,b)=>b.length-a.length);
  const tokens=[]; let i=0;
  while(i<text.length){ let hit=null;
    for(const w of words){ if(text.startsWith(w,i)){ hit=w; break; } }
    if(!hit) return null; tokens.push(hit); i+=hit.length; }
  let total=0,current=0,temp=0;
  for(const w of tokens){
    if(w in TH_DIGIT){ temp=TH_DIGIT[w]; }
    else{ const u=TH_UNIT[w];
      if(u===1000000){ total=(total+current+temp)*1000000; current=0; temp=0; }
      else{ if(temp===0) temp=1; current+=temp*u; temp=0; } }
  }
  return total+current+temp;
}
function thaiToNumber(val){
  if(val==null) return val;
  let t=String(val).trim(); if(t==="") return val;
  if(/[๐-๙]/.test(t)) t=t.replace(/[๐-๙]/g,d=>TH_NUM[d]);          // เลขไทย -> อารบิก
  if(/^-?\d+(\.\d+)?$/.test(t)) return t;                            // เป็นตัวเลขอยู่แล้ว
  if(t.includes("จุด")){                                            // รองรับทศนิยม "แปดจุดห้า"
    const [ip,fp]=t.split("จุด"); const iv=ip?evalThaiTokens(ip):0;
    if(iv==null) return val;
    let frac=""; let j=0;
    const dw=Object.keys(TH_DIGIT).sort((a,b)=>b.length-a.length);
    while(j<fp.length){ let hit=null; for(const w of dw){ if(fp.startsWith(w,j)){ hit=w; break; } }
      if(!hit) return val; frac+=TH_DIGIT[hit]; j+=hit.length; }
    return String(iv)+(frac?"."+frac:"");
  }
  const n=evalThaiTokens(t);
  return n==null?val:String(n);
}

/* ---------- ตารางสอน / ห้องเรียน / เชื่อม Google Sheet (GAS) ---------- */
const DAYS=["จ","อ","พ","พฤ","ศ","ส","อา"];
const DAY_TOKENS=[["พฤหัสบดี","พฤ"],["พฤหัส","พฤ"],["อาทิตย์","อา"],["จันทร์","จ"],["อังคาร","อ"],["พุธ","พ"],["ศุกร์","ศ"],["เสาร์","ส"],["พฤ","พฤ"],["อา","อา"],["จ","จ"],["อ","อ"],["พ","พ"],["ศ","ศ"],["ส","ส"]];
/* "จ,พ" / "จันทร์ พุธ" / "จ/พฤ" → ["จ","พ"] (เรียงตามวันในสัปดาห์) */
function parseDays(v){
  const s=String(v==null?"":v), out=new Set(); let i=0;
  while(i<s.length){ let hit=null;
    for(const [w,c] of DAY_TOKENS){ if(s.startsWith(w,i)){ hit=[w,c]; break; } }
    if(hit){ out.add(hit[1]); i+=hit[0].length; } else i++; }
  return DAYS.filter(d=>out.has(d));
}
/* "ม.1/1" "1/1" "ม.๑/๑" "มัธยมศึกษาปีที่ 1/2" → "ม.1/1"  (strict=ต้องมีคำว่า ม. นำหน้า ใช้กับชื่อชีต/ชื่อไฟล์) */
function normRoom(v,strict){
  let s=String(v==null?"":v).trim(); if(!s) return "";
  s=s.replace(/[๐-๙]/g,d=>"๐๑๒๓๔๕๖๗๘๙".indexOf(d));
  const re=strict?/ม(?:ัธยมศึกษาปีที่)?\.?\s*([1-6])(?:\s*[\/\-.]\s*(\d{1,2}))?/:/^(?:ม(?:ัธยมศึกษาปีที่)?\.?\s*)?([1-6])(?:\s*[\/\-.]\s*(\d{1,2}))?\s*$/;
  const m=s.match(re); if(!m) return "";
  return "ม."+m[1]+(m[2]?"/"+m[2]:"");
}
const roomLevel=(r)=>{ const m=String(r||"").match(/ม\.([1-6])/); return m?"ม."+m[1]:""; };
const roomKey=(r)=>"r_"+String(r||"").replace(/[\/\s]/g,"-");
const nameKey=(s)=>String(s==null?"":s).replace(/\s+/g,"");
function nextSemester(s){ const m=String(s||"").match(/([12])\s*\/\s*(\d{4})/); if(!m) return ""; return m[1]==="1"?"2/"+m[2]:"1/"+(+m[2]+1); }

/* เรียก Google Apps Script (Web App) — ซิงก์วิชา/บันทึกช่วยจำขึ้น Google Sheet
   ส่งเป็น text/plain เพื่อไม่ให้เกิด CORS preflight; ถ้าอ่านผลไม่ได้จะลองส่งแบบ no-cors (ทุก action เป็น upsert จึงส่งซ้ำได้ปลอดภัย) */
const GAS={url:"",key:""};
async function gasPost(action,payload){
  if(!GAS.url) return {ok:false,skipped:true};
  const body=JSON.stringify({key:GAS.key,action,...payload});
  try{ const r=await fetch(GAS.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body}); const d=await r.json(); return {ok:!!d.ok,data:d}; }
  catch(e){
    try{ await fetch(GAS.url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body}); return {ok:true,unverified:true}; }
    catch(e2){ console.warn("ซิงก์ Google Sheet ไม่สำเร็จ",e2); return {ok:false}; } }
}
const gasSubject=(s,sem)=>({id:s.id,semester:s.semester||sem||"",code:s.code||"",name:s.name||"",room:s.room||"",days:(s.days||[]).join(","),period:s.period||"",credits:s.credits==null?"":s.credits,color:s.color||""});
const gasNote=(n,subj,sem)=>({id:n.id,subjectId:subj.id,subjectCode:subj.code||"",subjectName:subj.name||"",room:subj.room||"",semester:subj.semester||sem||"",date:n.date,text:n.text,updatedAt:n.updatedAt||Date.now()});

/* ---------- Persist (เขียนลง Firestore) ---------- */
const PersistCtx = createContext(null);
const usePersist = () => useContext(PersistCtx);

function makePersist(){
  if(!FB){ // โหมดหน่วยความจำ: ทุกฟังก์ชันเป็น no-op
    const noop = async()=>{};
    return { addSubject:noop,updateSubject:noop,deleteSubject:noop,replaceStudents:noop,setStudentStatus:noop,
      deleteStudent:noop,setAttendanceDay:noop,addAssignment:noop,updateAssignment:noop,
      deleteAssignment:noop,setScoreDoc:noop,addNote:noop,updateNote:noop,deleteNote:noop,setLogo:noop,setQinfo:noop,
      setFixes:noop,updateFixes:noop,deleteFixes:noop,setTaskPresets:noop,
      setSubjects:noop,setTerm:noop,setRoster:noop,upsertStudents:noop,clearCollections:noop,setNotePresets:noop };
  }
  const col = (n)=>db.collection(n);
  const writeChunks = async(items,fn)=>{ for(let i=0;i<items.length;i+=400){ const b=db.batch(); items.slice(i,i+400).forEach(it=>fn(b,it)); await b.commit(); } };
  const deleteWhere = async(name,subjId)=>{
    const snap = await col(name).where("subjectId","==",subjId).get();
    await Promise.all(snap.docs.map(d=>d.ref.delete()));
  };
  return {
    addSubject:(s)=>col("subjects").doc(s.id).set({name:s.name,code:s.code,room:s.room,color:s.color,createdAt:s.createdAt||Date.now(),credits:s.credits==null?"":s.credits,days:s.days||[],period:s.period||"",semester:s.semester||""}),
    updateSubject:(id,s)=>col("subjects").doc(id).set({name:s.name,code:s.code,room:s.room,color:s.color,credits:s.credits==null?"":s.credits,days:s.days||[],period:s.period||"",semester:s.semester||""},{merge:true}),
    setSubjects:(list)=>writeChunks(list,(b,s)=>b.set(col("subjects").doc(s.id),{name:s.name,code:s.code,room:s.room,color:s.color,createdAt:s.createdAt||Date.now(),credits:s.credits==null?"":s.credits,days:s.days||[],period:s.period||"",semester:s.semester||""},{merge:true})),
    setTerm:(d)=>col("settings").doc("term").set(d,{merge:true}),
    setRoster:(key,d)=>col("roster").doc(key).set(d),
    upsertStudents:(subjId,list)=>writeChunks(list,(b,x)=>b.set(col("students").doc(x.id),{subjectId:subjId,number:x.number,name:x.name,studentId:x.studentId||"",status:x.status||"normal"},{merge:true})),
    clearCollections:async(names)=>{ for(const n of names){ const snap=await col(n).get(); await writeChunks(snap.docs,(b,d)=>b.delete(d.ref)); } },
    setNotePresets:(list)=>col("settings").doc("noteTexts").set({list}),
    deleteSubject:async(id)=>{ await col("subjects").doc(id).delete();
      await Promise.all(["students","assignments","notes","attendance","scores","qinfo"].map(n=>deleteWhere(n,id))); },
    replaceStudents:async(subjId,list)=>{ await deleteWhere("students",subjId);
      const batch=db.batch(); list.forEach(s=>batch.set(col("students").doc(s.id),{subjectId:subjId,number:s.number,name:s.name,status:s.status||"normal"})); await batch.commit(); },
    deleteStudent:(id)=>col("students").doc(id).delete(),
    setStudentStatus:(id,status)=>col("students").doc(id).set({status},{merge:true}),
    setAttendanceDay:(subjId,date,marks)=>col("attendance").doc(subjId+"_"+date).set({subjectId:subjId,date,marks}),
    addAssignment:(subjId,a)=>col("assignments").doc(a.id).set({subjectId:subjId,title:a.title,max:a.max,order:a.order}),
    updateAssignment:(id,a)=>col("assignments").doc(id).set({title:a.title,max:a.max},{merge:true}),
    deleteAssignment:(id)=>col("assignments").doc(id).delete(),
    setScoreDoc:(subjId,studentId,values)=>col("scores").doc(subjId+"_"+studentId).set({subjectId:subjId,studentId,values}),
    addNote:(subjId,n)=>col("notes").doc(n.id).set({subjectId:subjId,date:n.date,text:n.text,updatedAt:n.updatedAt||Date.now()}),
    updateNote:(id,n)=>col("notes").doc(id).set({date:n.date,text:n.text,updatedAt:n.updatedAt||Date.now()},{merge:true}),
    deleteNote:(id)=>col("notes").doc(id).delete(),
    setLogo:(url)=>col("settings").doc("app").set({logoUrl:url}),
    setQinfo:(docId,data)=>col("qinfo").doc(docId).set(data),
    /* งานแก้ 0 ร มส (คอลเลกชัน fixes) — เขียนเป็นชุดละไม่เกิน 400 รายการ */
    setFixes:(list)=>writeChunks(list,(b,f)=>{ const {id,...d}=f; b.set(col("fixes").doc(id),d,{merge:true}); }),
    updateFixes:(ids,patch)=>writeChunks(ids,(b,id)=>b.set(col("fixes").doc(id),patch,{merge:true})),
    deleteFixes:(ids)=>writeChunks(ids,(b,id)=>b.delete(col("fixes").doc(id))),
    setTaskPresets:(list)=>col("settings").doc("fixTasks").set({list}),
  };
}

/* ---------- ติดตั้งเป็นแอปบนหน้าจอโฮม (PWA) — ไอคอนใช้โลโก้แอปที่ตั้งไว้ในหน้าตั้งค่า ---------- */
function loadImgCors(src){ return new Promise((res,rej)=>{ const im=new Image(); im.crossOrigin="anonymous"; im.onload=()=>res(im); im.onerror=()=>rej(new Error("โหลดโลโก้ไม่ได้")); im.src=src; }); }
/* วาดโลโก้ลงพื้นขาวสี่เหลี่ยมจัตุรัส (ไอคอนต้องทึบ ไม่โปร่งใส) — ไม่มีโลโก้จะใช้ตัวอักษร TL บนพื้นกรมท่า */
function drawAppIcon(img,size,pad){
  const c=document.createElement("canvas"); c.width=c.height=size; const x=c.getContext("2d");
  x.fillStyle=img?"#ffffff":"#1f3a5f"; x.fillRect(0,0,size,size);
  if(img){ const box=size*(1-2*pad), r=Math.min(box/img.width,box/img.height), w=img.width*r, h=img.height*r; x.drawImage(img,(size-w)/2,(size-h)/2,w,h); }
  else{ x.fillStyle="#ffffff"; x.font="700 "+Math.round(size*.4)+"px sans-serif"; x.textAlign="center"; x.textBaseline="middle"; x.fillText("TL",size/2,size/2+size*.02); }
  return c.toDataURL("image/png");
}
function setHeadLink(rel,href,attrs){
  let l=document.querySelector('link[rel="'+rel+'"]'); if(!l){ l=document.createElement("link"); l.rel=rel; document.head.appendChild(l); }
  l.href=href; Object.keys(attrs||{}).forEach(k=>l.setAttribute(k,attrs[k])); return l;
}
/* สร้าง manifest + apple-touch-icon จากโลโก้ ทุกครั้งที่โลโก้เปลี่ยน */
function usePwaIcons(logoUrl){
  useEffect(()=>{
    let dead=false, blobUrl=null;
    (async()=>{
      let icons, apple, img=null;
      if(logoUrl){ try{ img=await loadImgCors(logoUrl); }catch(e){ img=null; } }
      try{
        if(logoUrl&&!img) throw new Error("cors");           // โหลดแบบ CORS ไม่ได้ → ใช้ลิงก์ตรง
        const a=drawAppIcon(img,192,.1), b=drawAppIcon(img,512,.1), m=drawAppIcon(img,512,.22);
        icons=[{src:a,sizes:"192x192",type:"image/png",purpose:"any"},{src:b,sizes:"512x512",type:"image/png",purpose:"any"},{src:m,sizes:"512x512",type:"image/png",purpose:"maskable"}];
        apple=drawAppIcon(img,180,.1);
      }catch(e){
        if(!logoUrl) return;
        icons=[{src:logoUrl,sizes:"192x192 512x512",purpose:"any"}]; apple=logoUrl;
      }
      if(dead) return;
      const base=location.origin+location.pathname;
      const manifest={id:base,name:"บันทึกการสอนครูนนท์",short_name:"Teaching Log",description:"บันทึกเช็กชื่อ คะแนน และเนื้อหาการสอน",
        start_url:base,scope:base,display:"standalone",orientation:"portrait",background_color:"#f1f4f8",theme_color:"#1f3a5f",lang:"th",icons};
      blobUrl=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));
      setHeadLink("manifest",blobUrl);
      setHeadLink("apple-touch-icon",apple,{sizes:"180x180"});
    })();
    return ()=>{ dead=true; if(blobUrl) setTimeout(()=>URL.revokeObjectURL(blobUrl),1000); };
  },[logoUrl]);
}
const isStandalone=()=>{ try{ return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true; }catch(e){ return false; } };
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent||"")||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);

/* ==================== APP ==================== */
function App(){
  const [subjects,setSubjects]=useState([]);
  const [students,setStudents]=useState({});
  const [attendance,setAttendance]=useState({});
  const [assignments,setAssignments]=useState({});
  const [scores,setScores]=useState({});
  const [notes,setNotes]=useState({});
  const [logoUrl,setLogoUrl]=useState("");
  const [qinfo,setQinfo]=useState({});
  const [fixes,setFixes]=useState([]);
  const [taskPresets,setTaskPresets]=useState([]);
  const [notePresets,setNotePresets]=useState([]);
  const [term,setTerm]=useState({semester:"",gasUrl:"",gasKey:""});
  const [rosters,setRosters]=useState({});
  const [loading,setLoading]=useState(true);
  const [view,setView]=useState("home");
  const [activeSubj,setActiveSubj]=useState(null);
  const persist = useMemo(()=>makePersist(),[]);
  const [installEv,setInstallEv]=useState(()=>window.__bip||null);
  const [showInstall,setShowInstall]=useState(false);
  const [standalone,setStandalone]=useState(isStandalone());
  usePwaIcons(logoUrl);
  useEffect(()=>{
    const onReady=()=>setInstallEv(window.__bip||null), onDone=()=>{ window.__bip=null; setInstallEv(null); setStandalone(true); };
    window.addEventListener("bip-ready",onReady); window.addEventListener("appinstalled",onDone);
    return ()=>{ window.removeEventListener("bip-ready",onReady); window.removeEventListener("appinstalled",onDone); };
  },[]);
  const doInstall=async()=>{
    if(installEv){ try{ installEv.prompt(); await installEv.userChoice; }catch(e){} window.__bip=null; setInstallEv(null); }
    else setShowInstall(true);
  };
  const [loadedSubj,setLoadedSubj]=useState({});     // วิชาที่โหลดข้อมูลแล้ว
  const [subjErr,setSubjErr]=useState("");
  const loadingRef=useRef({}), rosterRef=useRef(null), subjectsRef=useRef([]), dataRef=useRef({});
  subjectsRef.current=subjects;
  dataRef.current={students,attendance,assignments,scores,notes,qinfo};   // ค่าล่าสุดสำหรับฟังก์ชันที่รอโหลดข้อมูลแล้วค่อยใช้

  /* โหลดข้อมูลของ 1 วิชา (ครั้งเดียวต่อวิชาต่อการเปิดเว็บ) */
  const ensureSubject=(id)=>{
    if(!FB||!id) return Promise.resolve();
    if(loadingRef.current[id]) return loadingRef.current[id];
    const q=(n)=>db.collection(n).where("subjectId","==",id).get();
    const FP=firebase.firestore.FieldPath;
    const pr=(async()=>{
      const [stu,att,asg,sco,note,qi]=await Promise.all([q("students"),q("attendance"),q("assignments"),q("scores"),q("notes"),
        db.collection("qinfo").where(FP.documentId(),">=",id+"_").where(FP.documentId(),"<",id+"_\uf8ff").get().catch(()=>null)]);
      const stuList=stu.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.number||0)-(b.number||0));
      setStudents(p=>({...p,[id]:stuList}));
      const attObj={}; att.docs.forEach(d=>{ const x=d.data(); attObj[x.date]=x.marks||{}; }); setAttendance(p=>({...p,[id]:attObj}));
      setAssignments(p=>({...p,[id]:asg.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0))}));
      const scoObj={}; sco.docs.forEach(d=>{ const x=d.data(); scoObj[x.studentId]=x.values||{}; }); setScores(p=>({...p,[id]:scoObj}));
      setNotes(p=>({...p,[id]:note.docs.map(d=>({id:d.id,...d.data()}))}));
      if(qi){ const o={}; qi.docs.forEach(d=>{ o[d.id]=d.data(); }); setQinfo(p=>({...p,...o})); }
      setLoadedSubj(p=>({...p,[id]:true}));
      syncCount(id,stuList.length);
    })();
    loadingRef.current[id]=pr;
    pr.catch(e=>{ console.error("โหลดรายวิชาไม่ได้",e); delete loadingRef.current[id]; setSubjErr(String(e&&e.message||e)); });
    return pr;
  };
  const ensureSubjects=(ids)=>Promise.all(ids.map(ensureSubject));
  const ensureAll=()=>ensureSubjects(subjectsRef.current.map(s=>s.id));
  /* วิชาที่สร้าง/นำเข้าใหม่ไม่ต้องไปโหลดซ้ำ */
  const markLoaded=(ids)=>{ ids.forEach(id=>{ loadingRef.current[id]=Promise.resolve(); }); setLoadedSubj(p=>{ const n={...p}; ids.forEach(id=>{ n[id]=true; }); return n; }); };
  const resetLoaded=()=>{ loadingRef.current={}; setLoadedSubj({}); };
  /* จำนวนนักเรียนเก็บไว้ที่เอกสารวิชา เพื่อให้หน้าแรกแสดงได้โดยไม่ต้องโหลดรายชื่อ */
  const syncCount=(id,n)=>{
    const cur=subjectsRef.current.find(x=>x.id===id); if(!cur||cur.studentCount===n) return;
    setSubjects(p=>p.map(x=>x.id===id?{...x,studentCount:n}:x));
    if(FB) db.collection("subjects").doc(id).set({studentCount:n},{merge:true}).catch(e=>console.warn("บันทึกจำนวนนักเรียนไม่ได้",e));
  };
  /* รายชื่อกลาง (roster) โหลดเมื่อต้องใช้ (หน้าตั้งค่า/นำเข้า) */
  const ensureRosters=()=>{
    if(!FB) return Promise.resolve();
    if(!rosterRef.current) rosterRef.current=db.collection("roster").get().then(rs=>{ const o={}; rs.docs.forEach(d=>{ o[d.id]=d.data(); }); setRosters(p=>({...o,...p})); }).catch(e=>{ rosterRef.current=null; console.warn("โหลดรายชื่อกลางไม่ได้",e); });
    return rosterRef.current;
  };

  // โหลดข้อมูลครั้งแรกจาก Firestore
  useEffect(()=>{
    let alive=true;
    async function load(){
      if(!FB){ // seed ตัวอย่างในโหมดหน่วยความจำ
        setSubjects([{id:"s1",name:"วิทยาการคำนวณ",code:"ว21104",room:"ม.1/1",color:CARD_COLORS[0],createdAt:1}]);
        const demoNames=["เด็กชายกิตติ ใจดี","เด็กหญิงนภา ศรีสุข","เด็กชายธนพล หินเงิน","เด็กหญิงพิมพ์ชนก แก้วใส","เด็กชายภูมิ รักไทย","เด็กหญิงสุดา มีสุข","เด็กชายอนันต์ ทองดี","เด็กหญิงกานดา ใจงาม"];
        setStudents({s1:demoNames.map((n,i)=>({id:"a"+(i+1),number:i+1,name:n}))});
        setAssignments({s1:[{id:"w1",title:"ใบงานจับใจความสำคัญ",max:10,order:1},{id:"w2",title:"แบบฝึกคำที่มีหลายความหมาย",max:10,order:2},{id:"w3",title:"งานเขียนจดหมาย",max:20,order:3},{id:"w4",title:"สอบกลางภาค",max:40,order:4}]});
        setLoading(false); return;
      }
      try{
        /* เริ่มต้นโหลดเฉพาะรายวิชา + ตั้งค่า — ข้อมูลของแต่ละวิชา (นักเรียน/เช็คชื่อ/คะแนน/ภาระงาน/โน้ต/Q-Info) โหลดตอนเปิดวิชานั้น เพื่อประหยัดโควตา Firestore */
        const [sub,setDoc]=await Promise.all([
          db.collection("subjects").get(),
          db.collection("settings").doc("app").get(),
        ]);
        if(!alive) return;
        setSubjects(sub.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)));
        if(setDoc.exists) setLogoUrl(setDoc.data().logoUrl||"");
        // งานแก้ 0 ร มส (แยกโหลด — ถ้า Rules ยังไม่อนุญาตจะไม่กระทบข้อมูลส่วนอื่น)
        try{ const fx=await db.collection("fixes").get(); if(alive) setFixes(fx.docs.map(d=>({id:d.id,...d.data()}))); }
        catch(e){ console.warn("โหลด fixes ไม่ได้",e); }
        try{ const tp=await db.collection("settings").doc("fixTasks").get(); if(alive&&tp.exists) setTaskPresets(tp.data().list||[]); }
        catch(e){ console.warn("โหลดข้อความภาระงานสำเร็จรูปไม่ได้",e); }
        try{ const tp=await db.collection("settings").doc("noteTexts").get(); if(alive&&tp.exists) setNotePresets(tp.data().list||[]); }
        catch(e){ console.warn("โหลดข้อความโน้ตสำเร็จรูปไม่ได้",e); }
        try{ const tm=await db.collection("settings").doc("term").get(); if(tm.exists){ const d=tm.data(); GAS.url=d.gasUrl||""; GAS.key=d.gasKey||""; if(alive) setTerm({semester:d.semester||"",gasUrl:d.gasUrl||"",gasKey:d.gasKey||""}); } }
        catch(e){ console.warn("โหลดค่าภาคเรียนไม่ได้",e); }
      }catch(e){ console.error("โหลดข้อมูลล้มเหลว:",e); }
      if(alive) setLoading(false);
    }
    load(); return ()=>{alive=false;};
  },[]);

  useEffect(()=>{ if(!logoUrl) return; const l=document.getElementById("favicon"); if(l) l.href=logoUrl; },[logoUrl]);

  const subj = subjects.find(s=>s.id===activeSubj);
  const openSubject=(id)=>{ setActiveSubj(id); setView("class"); setSubjErr(""); ensureSubject(id).catch(()=>{}); };
  const subjReady=!FB||!subj||!!loadedSubj[subj.id];

  if(loading) return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",color:SUB,gap:14}}>
    <div className="spin" style={{color:C.accent}}><Cloud size={40}/></div><div>กำลังโหลดข้อมูล...</div></div>;

  return <PersistCtx.Provider value={persist}>
  <div style={{minHeight:"100vh",color:C.text}}>
    <header style={{background:C.navy,color:"#fff",position:"sticky",top:0,zIndex:40,borderBottom:"3px solid "+C.accent}}>
      <div style={{maxWidth:920,margin:"0 auto",padding:"11px 16px",display:"flex",alignItems:"center",gap:12}}>
        {view!=="home" && <button onClick={()=>setView(view==="class"||view==="fix"?"home":"class")} style={{background:"rgba(255,255,255,.12)",border:"none",color:"#fff",borderRadius:8,padding:7,cursor:"pointer",display:"flex"}}><ChevronLeft size={20}/></button>}
        {logoUrl ? <img src={logoUrl} alt="logo" style={{width:34,height:34,borderRadius:8,objectFit:"cover",background:"#fff"}}/> :
          <div style={{width:34,height:34,borderRadius:8,background:C.accent,display:"flex",alignItems:"center",justifyContent:"center"}}><BookOpen size={19}/></div>}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:16,lineHeight:1.15}}>บันทึกการสอนครูนนท์</div>
          <div style={{fontSize:12,color:"#b9c6d6"}}>{view==="home"?"รายวิชาที่รับผิดชอบ":view==="fix"?"งานแก้ 0 ร มส":subj?subj.name+" · "+subj.room:"ตั้งค่าระบบ"}</div>
        </div>
        {!standalone && <button onClick={doInstall} title="เพิ่มไปที่หน้าจอโฮม" style={{background:"rgba(255,255,255,.12)",border:"none",color:"#fff",borderRadius:8,padding:"8px 10px",cursor:"pointer",display:"flex",alignItems:"center",gap:6,fontFamily:"inherit",fontSize:13,fontWeight:600}}><Download size={18}/><span className="tl-hide-sm">ติดตั้งแอป</span></button>}
        <button onClick={()=>setView("settings")} title="ตั้งค่า" style={{background:view==="settings"?C.accent:"rgba(255,255,255,.12)",border:"none",color:"#fff",borderRadius:8,padding:8,cursor:"pointer",display:"flex"}}><Settings size={20}/></button>
      </div>
    </header>
    {!FB && <div style={{background:"#fbf4e0",color:"#8a6d1b",fontSize:13,textAlign:"center",padding:"7px 12px"}}>โหมดทดลอง (ยังไม่ได้ต่อ Firestore) — ข้อมูลจะไม่ถูกบันทึก เมื่อ deploy บน GitHub Pages จะบันทึกอัตโนมัติ</div>}
    <main style={{maxWidth:920,margin:"0 auto",padding:16,paddingBottom:60}}>
      {view==="home" && <HomeView subjects={subjects} setSubjects={setSubjects} openSubject={openSubject} students={students} setStudents={setStudents} fixes={fixes} openFix={()=>setView("fix")} term={term} markLoaded={markLoaded}/>}
      {view==="fix" && <FixView fixes={fixes} setFixes={setFixes} taskPresets={taskPresets} setTaskPresets={setTaskPresets}/>}
      {["class","attendance","scores","notes","pending","qinfo"].includes(view) && subj && !subjReady && <div style={{...panel,textAlign:"center",color:SUB,padding:30}}>
        {subjErr?<div><div style={{color:"#c0392b",fontWeight:700,marginBottom:6}}>โหลดข้อมูลวิชานี้ไม่สำเร็จ</div><div style={{fontSize:13,marginBottom:10}}>{subjErr}</div><Btn variant="primary" onClick={()=>{ setSubjErr(""); ensureSubject(subj.id).catch(()=>{}); }}>ลองอีกครั้ง</Btn></div>
        :<div><div className="spin" style={{color:C.accent,display:"inline-block"}}><Cloud size={30}/></div><div style={{marginTop:8}}>กำลังโหลดข้อมูลวิชา {subj.name}…</div></div>}</div>}
      {subjReady && view==="class" && subj && <ClassView subj={subj} setView={setView} students={students[subj.id]||[]}/>}
      {subjReady && view==="attendance" && subj && <AttendanceView subj={subj} students={students[subj.id]||[]} attendance={attendance} setAttendance={setAttendance}/>}
      {subjReady && view==="scores" && subj && <ScoresView subj={subj} setView={setView} students={students[subj.id]||[]} assignments={assignments} setAssignments={setAssignments} scores={scores} setScores={setScores}/>}
      {subjReady && view==="notes" && subj && <NotesView subj={subj} notes={notes} setNotes={setNotes} notePresets={notePresets} setNotePresets={setNotePresets} term={term}/>}
      {subjReady && view==="pending" && subj && <PendingView subj={subj} students={(students[subj.id]||[]).filter(isNormalStu)} assignments={assignments} scores={scores} logoUrl={logoUrl}/>}
      {subjReady && view==="qinfo" && subj && <QinfoView subj={subj} students={students[subj.id]||[]} assignments={assignments} scores={scores} qinfo={qinfo} setQinfo={setQinfo}/>}
      {view==="settings" && <SettingsView subjects={subjects} students={students} setStudents={setStudents} logoUrl={logoUrl} setLogoUrl={setLogoUrl}
        app={{subjects,setSubjects,students,setStudents,attendance,setAttendance,assignments,setAssignments,scores,setScores,notes,setNotes,qinfo,setQinfo,fixes,setFixes,term,setTerm,rosters,setRosters,loadedSubj,ensureSubject,ensureSubjects,ensureAll,ensureRosters,markLoaded,resetLoaded,syncCount,dataRef}}/>}
    </main>
    <Modal open={showInstall} onClose={()=>setShowInstall(false)} title="เพิ่มไปที่หน้าจอโฮม" width={480}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
        {logoUrl?<img src={logoUrl} alt="logo" style={{width:56,height:56,borderRadius:14,objectFit:"cover",border:"1px solid "+C.border,background:"#fff"}}/>
          :<div style={{width:56,height:56,borderRadius:14,background:C.navy,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:20}}>TL</div>}
        <div style={{fontSize:14,color:SUB,lineHeight:1.5}}><b style={{color:C.navy}}>บันทึกการสอนครูนนท์</b><br/>{logoUrl?"ไอคอนใช้โลโก้ของระบบ":"ยังไม่ได้ตั้งโลโก้ (ตั้งได้ที่ ตั้งค่า → โลโก้ระบบ)"}</div>
      </div>
      {(()=>{ const ios=isIOS(); const box=(t,items,on)=><div style={{border:"1px solid "+(on?C.accent:C.border),background:on?C.accentSoft:"#fff",borderRadius:12,padding:"11px 14px",marginBottom:10}}>
        <div style={{fontWeight:700,color:C.navy,marginBottom:4}}>{t}</div><ol style={{margin:0,paddingLeft:20,fontSize:14,lineHeight:1.7}}>{items.map((x,i)=><li key={i}>{x}</li>)}</ol></div>;
        return <div>
          {box("iPhone / iPad (ใช้ Safari)",["แตะปุ่ม แชร์ (สี่เหลี่ยมมีลูกศรชี้ขึ้น) ด้านล่างหรือด้านบนของ Safari","เลื่อนรายการลง เลือก “เพิ่มไปยังหน้าจอโฮม”","แตะ “เพิ่ม” ไอคอนจะขึ้นบนหน้าจอโฮม"],ios)}
          {box("Android (ใช้ Chrome)",["แตะเมนู ⋮ มุมขวาบน","เลือก “ติดตั้งแอป” หรือ “เพิ่มลงในหน้าจอหลัก”","ยืนยัน แล้วเปิดจากไอคอนบนหน้าจอ"],!ios&&/android/i.test(navigator.userAgent||""))}
          {box("คอมพิวเตอร์ (Chrome / Edge)",["กดไอคอนติดตั้ง (จอพร้อมลูกศร) ท้ายช่องที่อยู่เว็บ หรือเมนู ⋮ → “ติดตั้ง …”"],false)}
          <div style={{fontSize:12.5,color:SUB,marginTop:4}}>เมื่อเปิดจากไอคอนจะขึ้นเต็มจอเหมือนแอป และปุ่ม “ติดตั้งแอป” จะหายไปเอง</div></div>; })()}
    </Modal>
  </div>
  </PersistCtx.Provider>;
}

/* ---------- HOME ---------- */
function HomeView({subjects,setSubjects,openSubject,students,setStudents,fixes,openFix,term,markLoaded}){
  const persist=usePersist();
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({name:"",code:"",room:"",color:CARD_COLORS[0],days:[],period:"",credits:""});
  const openAdd=()=>{ setForm({name:"",code:"",room:"",color:CARD_COLORS[subjects.length%CARD_COLORS.length],days:[],period:"",credits:"",semester:(term&&term.semester)||""}); setModal({mode:"add"}); };
  const openEdit=(s)=>{ setForm({days:[],period:"",credits:"",...s}); setModal({mode:"edit",id:s.id}); };
  const save=()=>{
    if(!form.name.trim()) return;
    const sem=(term&&term.semester)||"";
    if(modal.mode==="add"){ const id=uid(); const rec={...form,id,createdAt:Date.now(),semester:form.semester||sem,studentCount:0};
      markLoaded&&markLoaded([id]); setSubjects([...subjects,rec]); setStudents(p=>({...p,[id]:[]})); persist.addSubject(rec); gasPost("upsertSubjects",{semester:sem,subjects:[gasSubject(rec,sem)]});
    } else { setSubjects(subjects.map(s=>s.id===modal.id?{...s,...form}:s)); persist.updateSubject(modal.id,form); gasPost("upsertSubjects",{semester:sem,subjects:[gasSubject({...form,id:modal.id},sem)]}); }
    setModal(null);
  };
  const remove=(id)=>{ if(!window.confirm("ลบรายวิชานี้และข้อมูลทั้งหมด?")) return;
    setSubjects(subjects.filter(s=>s.id!==id)); persist.deleteSubject(id); };
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <h2 style={{margin:0,fontSize:19,color:C.navy}}>รายวิชาที่รับผิดชอบ</h2>
      <Btn variant="accent" onClick={openAdd}><Plus size={17}/>เพิ่มวิชา</Btn>
    </div>
    <button onClick={openFix} style={{display:"flex",alignItems:"center",gap:14,textAlign:"left",width:"100%",background:"#fff",border:"1px solid "+C.border,borderLeft:"5px solid #c0392b",borderRadius:12,padding:"13px 16px",cursor:"pointer",fontFamily:"inherit",marginBottom:14}}>
      <div style={{width:44,height:44,borderRadius:10,background:"#c0392b",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><ClipboardList size={22}/></div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:16.5,fontWeight:700,color:C.navy}}>งานแก้ 0 ร มส</div>
        <div style={{fontSize:13.5,color:SUB}}>{(fixes||[]).length
          ? "ยังไม่มอบงาน "+fixes.filter(x=>x.status==="notassigned").length+" · มอบแล้ว "+fixes.filter(x=>x.status==="assigned").length+" · แก้ผ่านแล้ว "+fixes.filter(x=>x.status==="passed").length+(fixes.filter(isOverdue).length?" · เกินกำหนด "+fixes.filter(isOverdue).length:"")
          : "นำเข้าไฟล์จากระบบจัดการผลการเรียน เพื่อมอบภาระงานและติดตามสถานะ"}</div>
      </div>
      <div style={{transform:"rotate(180deg)",color:SUB}}><ChevronLeft size={20}/></div>
    </button>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:12}}>
      {subjects.map(s=><div key={s.id} style={{background:"#fff",border:"1px solid "+C.border,borderRadius:12,overflow:"hidden"}}>
        <div onClick={()=>openSubject(s.id)} style={{cursor:"pointer"}}>
          <div style={{height:6,background:s.color}}/>
          <div style={{padding:"14px 16px"}}>
            <div style={{fontSize:12,color:SUB,fontWeight:600}}>{s.code||"—"}</div>
            <div style={{fontSize:17,fontWeight:700,color:C.navy,margin:"2px 0 6px"}}>{s.name}</div>
            <div style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:13,color:SUB,background:C.navySoft,padding:"3px 9px",borderRadius:20}}>ห้อง {s.room||"—"} · {s.studentCount!=null?s.studentCount:(students[s.id]?students[s.id].length:"—")} คน</div>
            {((s.days&&s.days.length)||s.period||s.credits!=="" && s.credits!=null) ? <div style={{fontSize:12.5,color:SUB,marginTop:6}}>{(s.days||[]).length?"สอน "+s.days.join(","):""}{s.period?" · "+s.period:""}{s.credits!==""&&s.credits!=null?" · "+s.credits+" นก.":""}</div> : null}
          </div>
        </div>
        <div style={{display:"flex",borderTop:"1px solid "+C.border}}>
          <button onClick={()=>openEdit(s)} style={cardActBtn}><Pencil size={15}/>แก้ไข</button>
          <button onClick={()=>remove(s.id)} style={{...cardActBtn,color:"#c0392b",borderLeft:"1px solid "+C.border}}><Trash2 size={15}/>ลบ</button>
        </div>
      </div>)}
      {subjects.length===0 && <EmptyHint text="ยังไม่มีรายวิชา กดปุ่ม “เพิ่มวิชา”"/>}
    </div>
    <Modal open={!!modal} onClose={()=>setModal(null)} title={modal&&modal.mode==="add"?"เพิ่มรายวิชา":"แก้ไขรายวิชา"}>
      <Field label="ชื่อวิชา"><input style={inputStyle} value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="เช่น วิทยาการคำนวณ"/></Field>
      <Field label="รหัสวิชา"><input style={inputStyle} value={form.code} onChange={e=>setForm({...form,code:e.target.value})} placeholder="เช่น ว21104"/></Field>
      <Field label="ห้องเรียน"><input style={inputStyle} value={form.room} onChange={e=>setForm({...form,room:e.target.value})} placeholder="เช่น ม.1/1"/></Field>
      <Field label="วันที่สอนในสัปดาห์ (ใช้ส่งสรุปเข้าไลน์ตอนเช้า)"><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {DAYS.map(d=>{ const on=(form.days||[]).includes(d); return <button key={d} onClick={()=>setForm({...form,days:on?form.days.filter(x=>x!==d):DAYS.filter(x=>x===d||(form.days||[]).includes(x))})} style={{padding:"7px 13px",borderRadius:20,cursor:"pointer",fontFamily:"inherit",fontWeight:700,fontSize:14,border:"1px solid "+(on?C.navy:C.border),background:on?C.navy:"#fff",color:on?"#fff":C.navy}}>{d}</button>; })}</div></Field>
      <Field label="คาบ / เวลา (ไม่บังคับ)"><input style={inputStyle} value={form.period||""} onChange={e=>setForm({...form,period:e.target.value})} placeholder="เช่น คาบ 2 หรือ 09:30-10:20"/></Field>
      <Field label="หน่วยกิต (ไม่บังคับ)"><input style={inputStyle} value={form.credits==null?"":form.credits} onChange={e=>setForm({...form,credits:e.target.value})} placeholder="เช่น 1.0"/></Field>
      <Field label="สีประจำวิชา"><div style={{display:"flex",gap:8}}>
        {CARD_COLORS.map(c=><button key={c} onClick={()=>setForm({...form,color:c})} style={{width:30,height:30,borderRadius:8,background:c,cursor:"pointer",border:form.color===c?"3px solid "+C.navy:"2px solid #fff",outline:form.color===c?"1px solid "+C.navy:"none"}}/>)}
      </div></Field>
      <Btn variant="primary" onClick={save} style={{width:"100%"}}><Save size={16}/>บันทึก</Btn>
    </Modal>
  </div>;
}

      {cards.map(c=><button key={c.key} onClick={()=>setView(c.key)} style={{display:"flex",alignItems:"center",gap:14,textAlign:"left",background:"#fff",border:"1px solid "+C.border,borderRadius:12,padding:"16px 18px",cursor:"pointer",fontFamily:"inherit"}}>
        <div style={{width:48,height:48,borderRadius:10,background:c.color,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><c.icon size={24}/></div>
        <div style={{flex:1}}><div style={{fontSize:17,fontWeight:700,color:C.navy}}>{c.title}</div><div style={{fontSize:13.5,color:SUB}}>{c.desc}</div></div>
        <div style={{transform:"rotate(180deg)",color:SUB}}><ChevronLeft size={20}/></div>
      </button>)}

/* ---------- ATTENDANCE ---------- */
function AttendanceView({subj,students,attendance,setAttendance}){
  const persist=usePersist();
  const [date,setDate]=useState(todayStr());
  const dayData = (attendance[subj.id]&&attendance[subj.id][date])||{};
  const setStatus=(studentId,status)=>{
    const cur=(attendance[subj.id]&&attendance[subj.id][date])||{};
    const day={...cur};
    if(day[studentId]===status) delete day[studentId]; else day[studentId]=status;
    setAttendance(p=>({...p,[subj.id]:{...(p[subj.id]||{}),[date]:day}}));
    persist.setAttendanceDay(subj.id,date,day);
  };
  const markAll=(status)=>{ const day={}; students.forEach(s=>day[s.id]=status);
    setAttendance(p=>({...p,[subj.id]:{...(p[subj.id]||{}),[date]:day}})); persist.setAttendanceDay(subj.id,date,day); };
  const counts=useMemo(()=>{ const c={present:0,absent:0,personal:0,sick:0,skip:0};
    Object.values(dayData).forEach(v=>{ if(c[v]!=null) c[v]++; }); return c; },[dayData]);
  const exportXlsx=()=>{
    const subjA=attendance[subj.id]||{}; const dates=Object.keys(subjA).sort();
    const header=["เลขที่","ชื่อ-สกุล",...dates.map(fmtDate),"สถานะนักเรียน"];
    const rows=students.map(s=>[s.number,s.name,...dates.map(d=>(subjA[d]&&subjA[d][s.id])?STATUS[subjA[d][s.id]].label:""),stuStatusOf(s).label]);
    const ws=XLSX.utils.aoa_to_sheet([header,...rows]);
    ws["!cols"]=[{wch:7},{wch:26},...dates.map(()=>({wch:10})),{wch:14}];
    markStatusRows(ws,students,header.length);
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"เช็คชื่อ");
    XLSX.writeFile(wb,"เช็คชื่อ_"+subj.name+"_"+subj.room+".xlsx");
  };
  return <div>
    <SectionHead title="เช็คชื่อ" right={<Btn variant="accent" size="sm" onClick={exportXlsx}><Download size={15}/>Export .xlsx</Btn>}/>
    <div style={{background:"#fff",border:"1px solid "+C.border,borderRadius:12,padding:14,marginBottom:12}}>
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        <span style={{fontSize:13,fontWeight:600,color:SUB}}>วันที่</span>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...inputStyle,width:"auto",padding:"8px 10px"}}/>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:12}}>
        {STATUS_ORDER.map(k=><span key={k} style={{fontSize:12.5,padding:"3px 9px",borderRadius:20,background:STATUS[k].bg,color:STATUS[k].color,fontWeight:600}}>{STATUS[k].label} {counts[k]}</span>)}
        <button onClick={()=>markAll("present")} style={{marginLeft:"auto",fontSize:12.5,color:C.navy,background:C.navySoft,border:"none",borderRadius:20,padding:"4px 11px",cursor:"pointer",fontWeight:600,fontFamily:"inherit"}}>เลือก “มา” ทั้งหมด</button>
      </div>
    </div>
    <div style={tableWrap}><table style={tableStyle}>
      <thead><tr><th style={{...th,width:44}}>#</th><th style={{...th,textAlign:"left"}}>ชื่อ-สกุล</th><th style={{...th,minWidth:230}}>สถานะ</th></tr></thead>
      <tbody>
        {students.map(s=><tr key={s.id} className="tl-row">
          <td style={{...td,textAlign:"center",color:SUB}}>{s.number}</td>
          <td style={td}>{s.name}</td>
          <td style={td}><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            {STATUS_ORDER.map(k=>{ const on=dayData[s.id]===k;
              return <button key={k} onClick={()=>setStatus(s.id,k)} style={{fontSize:12.5,padding:"5px 9px",borderRadius:8,cursor:"pointer",fontWeight:600,fontFamily:"inherit",border:on?"1px solid "+STATUS[k].color:"1px solid "+C.border,background:on?STATUS[k].color:"#fff",color:on?"#fff":SUB}}>{STATUS[k].short}</button>;
            })}
          </div></td>
        </tr>)}
        {students.length===0 && <tr><td colSpan={3} style={{...td,textAlign:"center",color:SUB,padding:28}}>ยังไม่มีรายชื่อนักเรียน — เพิ่มได้ที่เมนู “ตั้งค่า”</td></tr>}
      </tbody>
    </table></div>
  </div>;
}

/* ---------- SCORES ---------- */
function ScoresView({subj,setView,students,assignments,setAssignments,scores,setScores}){
  const persist=usePersist();
  const list=assignments[subj.id]||[];
  const subjScores=scores[subj.id]||{};
  const [modal,setModal]=useState(null);
  const [aForm,setAForm]=useState({title:"",max:10});
  const [mode,setModeRaw]=useState(()=>{ try{ return localStorage.getItem("tl_score_mode")||"quick"; }catch(e){ return "quick"; } });
  const setMode=(m)=>{ setModeRaw(m); try{ localStorage.setItem("tl_score_mode",m); }catch(e){} };
  const [tq,setTq]=useState("");
  const tableStudents=useMemo(()=>tq.trim()?findStudents(students,tq):students,[students,tq]);
  const addAssignment=()=>{ if(!aForm.title.trim()) return;
    const item={id:uid(),title:aForm.title.trim(),max:Number(aForm.max)||0,order:Date.now()};
    setAssignments(p=>({...p,[subj.id]:[...(p[subj.id]||[]),item]})); persist.addAssignment(subj.id,item);
    setModal(null); setAForm({title:"",max:10}); };
  const editAssignment=()=>{ const upd={title:aForm.title.trim(),max:Number(aForm.max)||0};
    setAssignments(p=>({...p,[subj.id]:(p[subj.id]||[]).map(a=>a.id===modal.id?{...a,...upd}:a)})); persist.updateAssignment(modal.id,upd); setModal(null); };
  const removeAssignment=(id)=>{ if(!window.confirm("ลบหัวข้องานนี้?")) return;
    setAssignments(p=>({...p,[subj.id]:(p[subj.id]||[]).filter(a=>a.id!==id)})); persist.deleteAssignment(id); };
  const setScore=(studentId,aId,val)=>{
    const row={...(subjScores[studentId]||{})}; if(val==="") delete row[aId]; else row[aId]=val;
    setScores(p=>({...p,[subj.id]:{...(p[subj.id]||{}),[studentId]:row}})); persist.setScoreDoc(subj.id,studentId,row);
  };
  const rowTotal=(studentId)=>list.reduce((sum,a)=>sum+(Number(subjScores[studentId]&&subjScores[studentId][a.id])||0),0);
  const totalMax=list.reduce((s,a)=>s+(a.max||0),0);
  const convertAll=()=>{
    const updated={}; let changed=0;
    students.forEach(s=>{ const row={...(subjScores[s.id]||{})}; let dirty=false;
      Object.keys(row).forEach(aId=>{ const conv=thaiToNumber(row[aId]);
        if(conv!==row[aId] && /^-?\d/.test(String(conv))){ row[aId]=conv; dirty=true; changed++; } });
      if(dirty){ updated[s.id]=row; persist.setScoreDoc(subj.id,s.id,row); } });
    if(changed>0){ setScores(p=>{ const cur={...(p[subj.id]||{})};
      Object.keys(updated).forEach(sid=>cur[sid]=updated[sid]); return {...p,[subj.id]:cur}; });
      alert("แปลงเป็นตัวเลขแล้ว "+changed+" ช่อง"); }
    else alert("ไม่พบค่าที่ต้องแปลง (ทุกช่องเป็นตัวเลขอยู่แล้ว)");
  };
  const exportXlsx=()=>{
    const header=["เลขที่","ชื่อ-สกุล",...list.map(a=>a.title+" ("+a.max+")"),"รวม ("+totalMax+")","สถานะนักเรียน"];
    const rows=students.map(s=>[s.number,s.name,...list.map(a=>(subjScores[s.id]&&subjScores[s.id][a.id])!=null?subjScores[s.id][a.id]:""),rowTotal(s.id),stuStatusOf(s).label]);
    const ws=XLSX.utils.aoa_to_sheet([header,...rows]);
    ws["!cols"]=[{wch:7},{wch:26},...list.map(()=>({wch:14})),{wch:10},{wch:14}];
    markStatusRows(ws,students,header.length);
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"คะแนน");
    XLSX.writeFile(wb,"คะแนน_"+subj.name+"_"+subj.room+".xlsx");
  };
  const openAddAssignment=()=>{setAForm({title:"",max:10});setModal({mode:"add"});};
  return <div>
    <SectionHead title="เช็คคะแนน" right={<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
      <Btn variant="soft" size="sm" onClick={convertAll} title="แปลงคำอ่านภาษาไทย/เลขไทย เป็นตัวเลข"><Hash size={15}/>แปลงเป็นตัวเลข</Btn>
      <Btn variant="ghost" size="sm" onClick={openAddAssignment}><Plus size={15}/>เพิ่มงาน</Btn>
      <Btn variant="soft" size="sm" onClick={()=>setView("pending")} title="สรุปงานค้างแจ้งนักเรียน"><Bell size={15}/>งานค้าง</Btn>
      <Btn variant="accent" size="sm" onClick={exportXlsx}><Download size={15}/>Export</Btn>
    </div>}/>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap",marginBottom:10}}>
      <div className="seg">
        <button className={mode==="quick"?"on":""} onClick={()=>setMode("quick")}><Zap size={15}/>กรอกเร็ว (ค้นชื่อ)</button>
        <button className={mode==="table"?"on":""} onClick={()=>setMode("table")}><Table size={15}/>ตารางทั้งหมด</button>
      </div>
      {mode==="table" && <div style={{display:"flex",alignItems:"center",gap:6,background:"#fff",border:"1px solid "+C.border,borderRadius:8,padding:"6px 10px",flex:"1 1 200px",maxWidth:320}}>
        <Search size={15}/><input value={tq} onChange={e=>setTq(e.target.value)} placeholder="กรองชื่อ / เลขที่..." style={{border:"none",outline:"none",flex:1,minWidth:0,fontFamily:"inherit",fontSize:14}}/>
        {tq && <button onClick={()=>setTq("")} style={{background:"none",border:"none",cursor:"pointer",color:SUB,display:"flex"}}><X size={15}/></button>}
      </div>}
    </div>
    {mode==="quick" && <QuickScore students={students} list={list} subjScores={subjScores} setScore={setScore} onAddAssignment={openAddAssignment}/>}
    {mode==="table" && <div style={tableWrap}><table style={tableStyle}>
      <thead><tr>
        <th style={{...th,width:40}}>#</th>
        <th style={{...th,textAlign:"left",minWidth:150,position:"sticky",left:0,background:C.navy,zIndex:2}}>ชื่อ-สกุล</th>
        {list.map(a=><th key={a.id} style={{...th,minWidth:96}}>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <span style={{lineHeight:1.2}}>{a.title}</span>
            <span style={{fontWeight:400,fontSize:11,color:"#c7d4e2"}}>เต็ม {a.max}</span>
            <div style={{display:"flex",gap:4}}>
              <button onClick={()=>{setAForm({title:a.title,max:a.max});setModal({mode:"edit",id:a.id});}} style={miniIcon}><Pencil size={12}/></button>
              <button onClick={()=>removeAssignment(a.id)} style={{...miniIcon,color:"#ffd0c8"}}><Trash2 size={12}/></button>
            </div>
          </div></th>)}
        <th style={{...th,minWidth:70,background:C.navyDark}}>รวม<br/><span style={{fontWeight:400,fontSize:11,color:"#c7d4e2"}}>{totalMax}</span></th>
      </tr></thead>
      <tbody>
        {tableStudents.map(s=><tr key={s.id} className="tl-row">
          <td style={{...td,textAlign:"center",color:SUB}}>{s.number}</td>
          <td style={{...td,position:"sticky",left:0,background:isNormalStu(s)?"inherit":stuStatusOf(s).bg,fontWeight:500}}>{s.name}{!isNormalStu(s) && <span className="qs-badge" style={{marginLeft:6,background:"#fff",color:stuStatusOf(s).color,border:"1px solid "+stuStatusOf(s).color}}>{stuStatusOf(s).label}</span>}</td>
          {list.map(a=><td key={a.id} style={{...td,padding:4,textAlign:"center"}}>
            <input type="text" inputMode="decimal" value={(subjScores[s.id]&&subjScores[s.id][a.id])!=null?subjScores[s.id][a.id]:""} onChange={e=>setScore(s.id,a.id,e.target.value)}
              title={isNormalStu(s)?undefined:"⚠ นักเรียนสถานะ "+stuStatusOf(s).label+" — ไม่ใช่สถานะปกติ"} style={{width:72,textAlign:"center",padding:"7px 4px",border:isNormalStu(s)?"1px solid "+C.border:"2px solid "+stuStatusOf(s).color,background:isNormalStu(s)?"#fff":stuStatusOf(s).bg,borderRadius:6,fontFamily:"inherit",fontSize:14,outline:"none",boxSizing:"border-box"}}/>
          </td>)}
          <td style={{...td,textAlign:"center",fontWeight:700,color:C.accent,background:C.accentSoft}}>{rowTotal(s.id)}</td>
        </tr>)}
        {students.length===0 && <tr><td colSpan={3+list.length} style={{...td,textAlign:"center",color:SUB,padding:28}}>ยังไม่มีรายชื่อนักเรียน</td></tr>}
        {students.length>0 && list.length===0 && <tr><td colSpan={3} style={{...td,textAlign:"center",color:SUB,padding:22}}>กด “เพิ่มงาน” เพื่อสร้างหัวข้อเก็บคะแนน</td></tr>}
      </tbody>
    </table></div>}
    <Modal open={!!modal} onClose={()=>setModal(null)} title={modal&&modal.mode==="add"?"เพิ่มหัวข้องาน":"แก้ไขหัวข้องาน"}>
      <Field label="ชื่องาน / ชิ้นงาน"><input style={inputStyle} value={aForm.title} onChange={e=>setAForm({...aForm,title:e.target.value})} placeholder="เช่น ใบงานที่ 1"/></Field>
      <Field label="คะแนนเต็ม"><input type="number" style={inputStyle} value={aForm.max} onChange={e=>setAForm({...aForm,max:e.target.value})}/></Field>
      <Btn variant="primary" onClick={modal&&modal.mode==="add"?addAssignment:editAssignment} style={{width:"100%"}}><Save size={16}/>บันทึก</Btn>
    </Modal>
  </div>;
}

/* ---------- ค้นหานักเรียน (ใช้ร่วมกัน: โหมดกรอกเร็ว / กรองตาราง / เทียบ Q-Info) ---------- */
const NAME_PREFIX=/^(เด็กชาย|เด็กหญิง|นางสาว|นาย|นาง|ด\.ช\.|ด\.ญ\.|น\.ส\.)\s*/;
const normName=(s)=>String(s||"").trim().replace(NAME_PREFIX,"").replace(/\s+/g,"").toLowerCase();
const isNum=(v)=>/^-?\d+(\.\d+)?$/.test(String(v).trim());
const numOf=(v)=>{ if(v==null||v==="") return null; const t=String(thaiToNumber(String(v).trim())); return isNum(t)?Number(t):null; };
/* แยก "คำค้น + คะแนน" เช่น "12 8" → เลขที่ 12 ได้ 8 , "สมชาย 7.5" , "เลขที่ห้า แปด" */
function parseQuick(text){
  const t=String(text||"").replace(/เลขที่|คะแนน|ได้/g," ").trim(); if(!t) return {query:"",score:null};
  const parts=t.split(/\s+/);
  if(parts.length>=2){ const last=String(thaiToNumber(parts[parts.length-1])); if(isNum(last)) return {query:parts.slice(0,-1).join(" "),score:last}; }
  return {query:t,score:null};
}
function findStudents(students,query){
  const q=String(query||"").trim(); if(!q) return students;
  const qn=String(thaiToNumber(q));
  if(/^\d+$/.test(qn)) return students.filter(s=>String(s.number)===qn);       // พิมพ์ตัวเลข = ค้นเลขที่ (ตรงตัว)
  const nq=normName(q); const first=[],other=[];
  students.forEach(s=>{
    const n=normName(s.name); const i=n.indexOf(nq); if(i<0) return;
    const words=String(s.name).replace(NAME_PREFIX,"").trim().toLowerCase().split(/\s+/);
    if(i===0 || words.some(w=>w.startsWith(nq))) first.push(s); else other.push(s);   // ขึ้นต้นชื่อ/นามสกุล มาก่อน
  });
  return [...first,...other];
}

/* ---------- โหมดกรอกเร็ว: ค้นชื่อ/เลขที่ → กรอกคะแนน → Enter ---------- */
function QuickScore({students,list,subjScores,setScore,onAddAssignment}){
  const [aid,setAid]=useState(()=>{ try{ return localStorage.getItem("tl_qs_aid")||""; }catch(e){ return ""; } });
  useEffect(()=>{ if(list.length && !list.find(a=>a.id===aid)) setAid(list[list.length-1].id); },[list,aid]);
  useEffect(()=>{ try{ localStorage.setItem("tl_qs_aid",aid); }catch(e){} },[aid]);
  const asg=list.find(a=>a.id===aid);
  const [q,setQ]=useState(""); const [hi,setHi]=useState(0);
  const [sel,setSel]=useState(null); const [val,setVal]=useState("");
  const [onlyEmpty,setOnlyEmpty]=useState(false);
  const [autoNext,setAutoNextRaw]=useState(()=>{ try{ return localStorage.getItem("tl_qs_next")==="1"; }catch(e){ return false; } });
  const setAutoNext=(v)=>{ setAutoNextRaw(v); try{ localStorage.setItem("tl_qs_next",v?"1":"0"); }catch(e){} };
  const [msg,setMsg]=useState(null); const [recent,setRecent]=useState([]);
  const [listening,setListening]=useState(false);
  const searchRef=useRef(null), valRef=useRef(null), listRef=useRef(null);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  const curOf=(sid,a=aid)=>{ const r=subjScores[sid]; const v=r&&r[a]; return (v==null||v==="")?null:v; };
  const countDone=(a)=>students.filter(s=>curOf(s.id,a)!=null).length;
  const done=asg?countDone(aid):0;
  const parsed=useMemo(()=>parseQuick(q),[q]);
  const matches=useMemo(()=>{
    if(!parsed.query) return onlyEmpty?students.filter(s=>curOf(s.id)==null&&isNormalStu(s)):students;
    return findStudents(students,parsed.query);
  },[students,parsed.query,onlyEmpty,subjScores,aid]);
  useEffect(()=>setHi(0),[parsed.query,onlyEmpty]);
  useEffect(()=>{ const el=listRef.current&&listRef.current.querySelector(".qs-row.hi"); if(el&&el.scrollIntoView) el.scrollIntoView({block:"nearest"}); },[hi]);
  useEffect(()=>{ if(!msg) return; const t=setTimeout(()=>setMsg(null),2600); return ()=>clearTimeout(t); },[msg]);
  useEffect(()=>{ if(sel) setTimeout(()=>{ if(valRef.current){ valRef.current.focus(); valRef.current.select(); } },40); },[sel]);
  const chipsRef=useRef(null);
  useEffect(()=>{ const el=chipsRef.current&&chipsRef.current.querySelector(".qs-chip.on"); if(el&&chipsRef.current) chipsRef.current.scrollLeft=el.offsetLeft-chipsRef.current.offsetLeft-8; },[aid,list.length]);

  const focusSearch=()=>setTimeout(()=>searchRef.current&&searchRef.current.focus(),40);
  const pick=(s)=>{ setSel(s.id); const c=curOf(s.id); setVal(c==null?"":String(c)); };
  const stName=(sid)=>{ const s=students.find(x=>x.id===sid); return s?(s.number+". "+s.name):""; };

  const commit=(sid,raw)=>{
    if(!asg){ setMsg({ok:false,text:"เลือกงานที่จะกรอกก่อน"}); return false; }
    const t=String(raw==null?"":raw).trim(); const prev=curOf(sid);
    if(t===""){ setScore(sid,aid,""); setMsg({ok:true,text:"ลบคะแนน "+stName(sid)});
      setRecent(r=>[{k:uid(),sid,aid,prev,v:""},...r].slice(0,6)); return true; }
    const conv=String(thaiToNumber(t));
    if(!isNum(conv)||Number(conv)<0){ setMsg({ok:false,text:"กรอกเป็นตัวเลขเท่านั้น"}); return false; }
    if(asg.max && Number(conv)>Number(asg.max)){ setMsg({ok:false,text:"เกินคะแนนเต็ม ("+asg.max+")"}); return false; }
    setScore(sid,aid,conv);
    setMsg({ok:true,text:stName(sid)+"  →  "+conv+(asg.max?" / "+asg.max:"")});
    setRecent(r=>[{k:uid(),sid,aid,prev,v:conv},...r].slice(0,6));
    return true;
  };
  const nextEmpty=(afterSid)=>{ const idx=students.findIndex(s=>s.id===afterSid);
    for(let k=1;k<students.length;k++){ const s=students[(idx+k)%students.length]; if(s.id!==afterSid && curOf(s.id)==null && isNormalStu(s)) return s; } return null; };
  const afterCommit=(sid)=>{
    setQ("");
    if(autoNext){ const n=nextEmpty(sid); if(n){ pick(n); return; } setMsg({ok:true,text:"กรอกครบทุกคนแล้ว"}); }
    setSel(null); focusSearch();
  };
  // Enter ในช่องค้นหา: "เลขที่/ชื่อ + คะแนน" และเจอคนเดียว → บันทึกทันที, ไม่งั้นเลือกคนที่ไฮไลต์
  const handleText=(text,hiIdx=0)=>{
    const p=parseQuick(text); const m=p.query?findStudents(students,p.query):matches;
    if(p.score!=null && m.length===1 && !isNormalStu(m[0])){ pick(m[0]); setVal(String(p.score)); setMsg({ok:false,text:"⚠ "+m[0].name+" สถานะ "+stuStatusOf(m[0]).label+" — ตรวจสอบก่อนบันทึก"}); return; }
    if(p.score!=null && m.length===1){ if(commit(m[0].id,p.score)){ setQ(""); focusSearch(); } return; }
    if(p.score!=null && m.length>1){ setMsg({ok:false,text:"พบ "+m.length+" คน — พิมพ์ชื่อให้ชัดขึ้น หรือใช้เลขที่"}); return; }
    if(m.length>0) pick(m[Math.min(hiIdx,m.length-1)]);
    else setMsg({ok:false,text:"ไม่พบนักเรียน"});
  };
  const onSearchKey=(e)=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); setHi(h=>Math.min(h+1,matches.length-1)); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); setHi(h=>Math.max(h-1,0)); }
    else if(e.key==="Enter"){ e.preventDefault(); handleText(q,hi); }
    else if(e.key==="Escape"){ setQ(""); }
  };
  const onValKey=(e)=>{
    if(e.key==="Enter"){ e.preventDefault(); if(commit(sel,val)) afterCommit(sel); }
    else if(e.key==="Escape"){ e.preventDefault(); setSel(null); focusSearch(); }
  };
  const listen=()=>{
    if(!SR) return; if(listening) return;
    const r=new SR(); r.lang="th-TH"; r.interimResults=false; r.maxAlternatives=1;
    r.onresult=(ev)=>{ const t=ev.results[0][0].transcript; setQ(t); handleText(t,0); };
    r.onend=()=>setListening(false); r.onerror=()=>setListening(false);
    setListening(true); try{ r.start(); }catch(e){ setListening(false); }
  };
  const undo=(it)=>{ setScore(it.sid,it.aid,it.prev==null?"":it.prev); setRecent(r=>r.filter(x=>x.k!==it.k)); setMsg({ok:true,text:"ย้อนกลับ "+stName(it.sid)}); };

  if(!list.length) return <div style={{...panel,textAlign:"center",color:SUB,padding:28}}>
    <div style={{marginBottom:12}}>ยังไม่มีหัวข้องาน — สร้างงานก่อนเริ่มกรอกคะแนน</div>
    <Btn variant="accent" onClick={onAddAssignment}><Plus size={16}/>เพิ่มงาน</Btn></div>;

  const pad = asg && Number(asg.max)>0 && Number(asg.max)<=20 && Number.isInteger(Number(asg.max)) ? Array.from({length:Number(asg.max)+1},(_,i)=>i) : null;
  const selStu = sel && students.find(s=>s.id===sel);
  const pct = students.length?Math.round(done/students.length*100):0;

  return <div>
    {/* 1) เลือกงาน */}
    <div className="qs-chips" ref={chipsRef}>
      {list.map(a=>{ const d=countDone(a.id); return <button key={a.id} className={"qs-chip"+(a.id===aid?" on":"")} onClick={()=>{ setAid(a.id); setSel(null); focusSearch(); }} title={a.title}>
        <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:176}}>{a.title}</span>
        <small>เต็ม {a.max} · กรอกแล้ว {d}/{students.length}</small></button>; })}
    </div>

    {/* 2) ช่องค้นหา (ติดขอบบนตอนเลื่อน) */}
    <div className="qs-sticky">
      <div className="qs-search">
        <Search size={20}/>
        <input ref={searchRef} value={q} onChange={e=>setQ(e.target.value)} onKeyDown={onSearchKey} autoFocus
          placeholder="พิมพ์เลขที่ หรือชื่อ (เช่น 12 หรือ สมชาย)" enterKeyHint="go" autoComplete="off"/>
        {q && <button className="qs-iconbtn" style={{background:"transparent"}} onClick={()=>{setQ("");focusSearch();}} title="ล้าง"><X size={18}/></button>}
        {SR && <button className={"qs-iconbtn"+(listening?" rec":"")} onClick={listen} title="พูดชื่อ/เลขที่ + คะแนน เช่น “เลขที่ห้า แปด”"><Mic size={19}/></button>}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8,flexWrap:"wrap"}}>
        <div style={{flex:"1 1 160px",display:"flex",alignItems:"center",gap:8}}>
          <div style={{flex:1,height:7,background:"#dde3ea",borderRadius:9,overflow:"hidden"}}><div style={{width:pct+"%",height:"100%",background:pct===100?"#2e7d52":C.accent,transition:"width .3s"}}/></div>
          <span style={{fontSize:12.5,color:SUB,fontWeight:600,whiteSpace:"nowrap"}}>{done}/{students.length}</span>
        </div>
        <label style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:C.navy,fontWeight:600,cursor:"pointer"}}><input type="checkbox" checked={onlyEmpty} onChange={e=>setOnlyEmpty(e.target.checked)}/>เฉพาะที่ยังไม่กรอก</label>
        <label style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:C.navy,fontWeight:600,cursor:"pointer"}} title="บันทึกแล้วข้ามไปคนถัดไปที่ยังไม่มีคะแนน"><input type="checkbox" checked={autoNext} onChange={e=>setAutoNext(e.target.checked)}/>ไปคนถัดไปอัตโนมัติ</label>
      </div>
      <div className="qs-hint-desk" style={{fontSize:12,color:SUB,marginTop:6}}>
        ทางลัด: พิมพ์ <b>“12 8”</b> แล้ว <kbd>Enter</kbd> = เลขที่ 12 ได้ 8 ทันที · <kbd>↑</kbd><kbd>↓</kbd> เลือกคน · <kbd>Enter</kbd> เปิดช่องคะแนน · <kbd>Esc</kbd> ยกเลิก
      </div>
    </div>

    {/* 3) แผงกรอกคะแนนของคนที่เลือก */}
    {selStu && <div className="qs-overlay" onMouseDown={e=>{ if(e.target===e.currentTarget){ setSel(null); focusSearch(); } }}><div className="qs-panel qs-modal">
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
        <div className="qs-no" style={{background:C.accent,color:"#fff"}}>{selStu.number}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:16.5,color:C.navy,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{selStu.name}</div>
          <div style={{fontSize:12.5,color:SUB}}>{asg&&asg.title} · เต็ม {asg&&asg.max}{curOf(selStu.id)!=null?" · เดิม "+curOf(selStu.id):""}</div>
        </div>
        <button className="qs-iconbtn" onClick={()=>{setSel(null);focusSearch();}} title="ปิด (Esc)"><X size={18}/></button>
      </div>
      {!isNormalStu(selStu) && <div className="qs-warn" style={{background:stuStatusOf(selStu).bg,color:stuStatusOf(selStu).color,borderColor:stuStatusOf(selStu).color}}>⚠ นักเรียนคนนี้สถานะ “{stuStatusOf(selStu).label}” — ไม่ใช่สถานะปกติ โปรดตรวจสอบก่อนกรอกคะแนน</div>}
      <div style={{display:"flex",gap:8}}>
        <input ref={valRef} className="qs-big" type="text" inputMode="decimal" enterKeyHint="done" value={val} onChange={e=>setVal(e.target.value)} onKeyDown={onValKey} placeholder="คะแนน"/>
        <Btn variant="accent" onClick={()=>{ if(commit(sel,val)) afterCommit(sel); }} style={{padding:"0 18px",fontSize:16}}><Save size={18}/>บันทึก</Btn>
      </div>
      {pad && <div className="qs-pad">{pad.map(n=><button key={n} className={String(val)===String(n)?"on":""} onClick={()=>{ if(commit(sel,n)) afterCommit(sel); }}>{n}</button>)}</div>}
      {curOf(selStu.id)!=null && <button onClick={()=>{ if(commit(sel,"")) afterCommit(sel); }} style={{marginTop:10,background:"none",border:"none",color:"#c0392b",fontFamily:"inherit",fontSize:13,fontWeight:600,cursor:"pointer",padding:0}}>ลบคะแนนของคนนี้</button>}
    </div></div>}

    {/* 4) รายชื่อที่ค้นพบ */}
    <div ref={listRef} style={{...tableWrap,overflow:"hidden"}}>
      {matches.map((s,i)=>{ const v=curOf(s.id); return <button key={s.id} className={"qs-row"+(i===hi&&!sel?" hi":"")} onClick={()=>pick(s)} style={s.id===sel?{background:C.accentSoft}:null}>
        <div className="qs-no">{s.number}</div>
        <div style={{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",opacity:isNormalStu(s)?1:.7}}>{s.name}</div>
        {!isNormalStu(s) && <span className="qs-badge" style={{background:stuStatusOf(s).bg,color:stuStatusOf(s).color}}>{stuStatusOf(s).label}</span>}
        <div className="qs-score" style={v!=null?{background:"#e6f4ec",color:"#2e7d52"}:{background:"#f1f4f8",color:"#a0aab5"}}>{v!=null?v:"–"}</div>
      </button>; })}
      {matches.length===0 && <div style={{padding:24,textAlign:"center",color:SUB,fontSize:14}}>{onlyEmpty&&!parsed.query?"กรอกครบทุกคนแล้ว":"ไม่พบนักเรียนที่ค้นหา"}</div>}
    </div>

    {/* 5) ล่าสุด + ย้อนกลับ */}
    {recent.length>0 && <div style={{...panel,marginTop:12,padding:12}}>
      <div style={{fontSize:13,fontWeight:700,color:C.navy,marginBottom:6}}>บันทึกล่าสุด</div>
      {recent.map(it=>{ const a=list.find(x=>x.id===it.aid); return <div key={it.k} style={{display:"flex",alignItems:"center",gap:8,fontSize:13.5,padding:"5px 0",borderTop:"1px solid #eef2f7"}}>
        <span style={{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{stName(it.sid)} <span style={{color:SUB}}>· {a?a.title:""}</span></span>
        <b style={{color:C.accent}}>{it.v===""?"ลบ":it.v}</b>
        <button onClick={()=>undo(it)} title="ย้อนกลับ" style={{display:"flex",alignItems:"center",gap:3,background:C.navySoft,border:"none",borderRadius:6,padding:"3px 8px",cursor:"pointer",color:C.navy,fontFamily:"inherit",fontSize:12,fontWeight:600}}><Undo size={13}/>ย้อน</button>
      </div>; })}
    </div>}

    {msg && <div className="qs-toast" style={{background:msg.ok?"#2e7d52":"#c0392b"}}>{msg.text}</div>}
  </div>;
}

/* ==================== สรุปงานค้างแจ้งนักเรียน ====================
   งานค้าง = ช่องคะแนนว่าง หรือไม่ใช่ตัวเลข (เช่น ร, มส) · เลือกนับ 0 เป็นงานค้างได้
   ส่งออก: ข้อความสำหรับไลน์ (รายบุคคล / ทั้งห้อง) และหน้าพิมพ์ A4 (บันทึกเป็น PDF ได้)
------------------------------------------------------------------ */
const escHtml=(s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDateLong=(s)=>{ if(!s) return ""; const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"}); };
const firstName=(name)=>String(name||"").replace(NAME_PREFIX,"").trim().split(/\s+/)[0]||name;
function pendingList(students,list,subjScores,countZero){
  return students.map(s=>{ const sc=subjScores[s.id]||{};
    const miss=list.filter(a=>{ const v=sc[a.id]; if(v==null||String(v).trim()==="") return true;
      const n=numOf(v); if(n==null) return true; return countZero && n===0; });
    return {s,miss}; });
}
function pendingNoteOf(v){ const t=String(v==null?"":v).trim(); return t&&numOf(t)==null?t:""; }   // เช่น "ร", "มส"

/* เปิดหน้าต่างพิมพ์ (ผู้ใช้เลือก "บันทึกเป็น PDF" ได้) */
function openPrint(title,bodyHtml){
  const w=window.open("","_blank");
  if(!w){ alert("เบราว์เซอร์บล็อกหน้าต่างใหม่ — อนุญาต Pop-up สำหรับเว็บนี้ก่อน"); return; }
  w.document.open();
  w.document.write(`<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escHtml(title)}</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
 @page{ size:A4; margin:14mm 15mm; }
 *{ box-sizing:border-box; }
 body{ font-family:'Sarabun','TH SarabunPSK',sans-serif; font-size:14.5pt; line-height:1.45; color:#000; margin:0; background:#fff; }
 .bar{ position:sticky; top:0; background:#1f3a5f; color:#fff; padding:10px 16px; display:flex; gap:10px; align-items:center; font-size:12pt; }
 .bar button{ font-family:inherit; font-size:12pt; padding:6px 16px; border:none; border-radius:6px; background:#c2703d; color:#fff; cursor:pointer; font-weight:600; }
 .page{ max-width:180mm; margin:0 auto; padding:10mm 0; }
 h1{ font-size:18pt; text-align:center; margin:0 0 2pt; }
 .sub{ text-align:center; margin:0 0 10pt; }
 .logo{ display:block; margin:0 auto 4pt; width:52px; height:52px; object-fit:contain; }
 table{ width:100%; border-collapse:collapse; margin:6pt 0; }
 th,td{ border:1px solid #333; padding:3pt 6pt; vertical-align:top; }
 th{ background:#eee; font-weight:700; text-align:center; }
 td.c{ text-align:center; }
 .meta{ margin:6pt 0; }
 .sign{ display:flex; justify-content:space-around; gap:10pt; margin-top:18pt; text-align:center; }
 .sign div{ min-width:52mm; }
 .slip{ border:1px solid #333; border-radius:6px; padding:8pt 12pt; margin-bottom:8mm; break-inside:avoid; page-break-inside:avoid; position:relative; }
 .slip:after{ content:"✂ - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -"; position:absolute; left:0; right:0; bottom:-6.5mm; font-size:9pt; color:#999; white-space:nowrap; overflow:hidden; }
 .slip h2{ font-size:15.5pt; margin:0; text-align:center; }
 .slip .sign{ margin-top:10pt; }
 .small{ font-size:12pt; color:#333; }
 @media print{ .bar{ display:none; } .page{ padding:0; } }
</style></head><body>
<div class="bar"><b style="flex:1">${escHtml(title)}</b><button onclick="window.print()">พิมพ์ / บันทึกเป็น PDF</button></div>
<div class="page">${bodyHtml}</div>
<script>(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){setTimeout(function(){window.print();},350);});<\/script>
</body></html>`);
  w.document.close();
}

function PendingView({subj,students,assignments,scores,logoUrl}){
  const list=assignments[subj.id]||[];
  const subjScores=scores[subj.id]||{};
  const LS=(k,d)=>{ try{ const v=localStorage.getItem("tl_pd_"+k); return v==null?d:v; }catch(e){ return d; } };
  const setLS=(k,v)=>{ try{ localStorage.setItem("tl_pd_"+k,v); }catch(e){} };
  const [mode,setMode]=useState(()=>LS("mode","class"));               // class | person
  const [groupBy,setGroupBy]=useState(()=>LS("group","student"));      // student | work
  const [picked,setPicked]=useState(()=>new Set(list.map(a=>a.id)));
  useEffect(()=>{ setPicked(p=>{ const n=new Set(p); list.forEach(a=>{ if(!known.current.has(a.id)){ n.add(a.id); known.current.add(a.id);} }); return n; }); },[list]);
  const known=useRef(new Set(list.map(a=>a.id)));
  const [countZero,setCountZero]=useState(()=>LS("zero","0")==="1");
  const [shortName,setShortName]=useState(()=>LS("short","0")==="1");
  const [due,setDue]=useState("");
  const [note,setNote]=useState(()=>LS("note","ขอให้นักเรียนติดตามส่งงานให้ครบถ้วน"));
  const [teacher,setTeacher]=useState(()=>LS("teacher","นายนนทพัทธ์ หิรัญเรือง"));
  const [school,setSchool]=useState(()=>LS("school","โรงเรียนกระดุมทองวิทยา"));
  const [q,setQ]=useState(""); const [cur,setCur]=useState(null);
  const [toast,setToast]=useState(null);
  useEffect(()=>{ if(!toast) return; const t=setTimeout(()=>setToast(null),2600); return ()=>clearTimeout(t); },[toast]);

  const chosen=list.filter(a=>picked.has(a.id));
  const rows=useMemo(()=>pendingList(students,chosen,subjScores,countZero),[students,chosen.map(a=>a.id).join(),subjScores,countZero]);
  const late=rows.filter(r=>r.miss.length);
  const totalMiss=late.reduce((t,r)=>t+r.miss.length,0);
  const byWork=chosen.map(a=>({a,who:rows.filter(r=>r.miss.includes(a)).map(r=>r.s)})).filter(x=>x.who.length);
  const dn=(s)=>shortName?firstName(s.name):s.name;
  const today=fmtDateLong(todayStr());
  const subjLine=subj.name+(subj.code?" ("+subj.code+")":"")+" ห้อง "+subj.room;

  /* ---------- ข้อความไลน์ ---------- */
  const tail=()=>{ const t=[]; if(due) t.push("กำหนดส่งภายใน "+fmtDateLong(due)); if(note.trim()) t.push(note.trim()); if(teacher.trim()) t.push("— "+teacher.trim()); return t.length?"\n"+t.join("\n"):""; };
  const textClass=()=>{
    const head="แจ้งงานค้าง วิชา"+subjLine+"\nข้อมูล ณ วันที่ "+today+"\n";
    if(!late.length) return head+"\nนักเรียนส่งงานครบทุกคน ขอบคุณครับ/ค่ะ"+tail();
    let body="";
    if(groupBy==="work") body=byWork.map(x=>"■ "+x.a.title+" (ค้าง "+x.who.length+" คน)\n   เลขที่ "+x.who.map(s=>s.number).join(", ")+(shortName?"":"\n"+x.who.map(s=>"   - "+s.number+" "+s.name).join("\n"))).join("\n\n");
    else body=late.map(r=>"เลขที่ "+r.s.number+" "+dn(r.s)+" (ค้าง "+r.miss.length+")\n"+r.miss.map(a=>"   - "+a.title).join("\n")).join("\n\n");
    return head+"\n"+body+"\n\nสรุป: ค้างงาน "+late.length+" คน · ส่งครบ "+(rows.length-late.length)+" คน"+tail();
  };
  const textPerson=(r)=>{
    const head="แจ้งงานค้าง วิชา"+subjLine+"\nถึง เลขที่ "+r.s.number+" "+r.s.name+"\nข้อมูล ณ วันที่ "+today+"\n";
    if(!r.miss.length) return head+"\nส่งงานครบแล้ว เยี่ยมมาก"+tail();
    const sc=subjScores[r.s.id]||{};
    return head+"\nงานที่ยังค้าง "+r.miss.length+" งาน\n"+r.miss.map((a,i)=>(i+1)+". "+a.title+" (เต็ม "+a.max+")"+(pendingNoteOf(sc[a.id])?" ["+pendingNoteOf(sc[a.id])+"]":"")).join("\n")+tail();
  };
  const copy=async(text,label)=>{ const ok=await copyText(text); setToast({ok,text:ok?"คัดลอกแล้ว — "+label+" (วางในไลน์ได้เลย)":"คัดลอกไม่สำเร็จ"}); };

  /* ---------- หน้าพิมพ์ ---------- */

  const footHtml=()=>`<div class="meta">${due?`<b>กำหนดส่ง</b> ภายใน ${escHtml(fmtDateLong(due))}<br>`:""}${note.trim()?`<b>หมายเหตุ</b> ${escHtml(note.trim())}`:""}</div>`;
  const signTeacher=`<div>ลงชื่อ ...................................... ครูผู้สอน<br>( ${escHtml(teacher||"......................................")} )</div>`;
  const printClass=()=>{
    let t;
    if(groupBy==="work") t=`<table><thead><tr><th style="width:8%">ที่</th><th>ชื่องาน</th><th style="width:10%">เต็ม</th><th style="width:10%">ค้าง (คน)</th><th style="width:38%">เลขที่ที่ยังไม่ส่ง</th></tr></thead><tbody>${
      byWork.map((x,i)=>`<tr><td class="c">${i+1}</td><td>${escHtml(x.a.title)}</td><td class="c">${escHtml(x.a.max)}</td><td class="c">${x.who.length}</td><td>${x.who.map(s=>s.number).join(", ")}</td></tr>`).join("")||`<tr><td colspan="5" class="c">ไม่มีงานค้าง</td></tr>`}</tbody></table>`;
    else t=`<table><thead><tr><th style="width:7%">ที่</th><th style="width:8%">เลขที่</th><th style="width:32%">ชื่อ-สกุล</th><th style="width:9%">จำนวน</th><th>งานที่ยังค้าง</th></tr></thead><tbody>${
      late.map((r,i)=>`<tr><td class="c">${i+1}</td><td class="c">${r.s.number}</td><td>${escHtml(dn(r.s))}</td><td class="c">${r.miss.length}</td><td>${r.miss.map(a=>escHtml(a.title)).join(", ")}</td></tr>`).join("")||`<tr><td colspan="5" class="c">นักเรียนส่งงานครบทุกคน</td></tr>`}</tbody></table>`;
    const sum=`<div class="meta">สรุป: นักเรียนทั้งหมด ${rows.length} คน · ค้างงาน <b>${late.length}</b> คน (รวม ${totalMiss} งาน) · ส่งครบ ${rows.length-late.length} คน · งานที่นำมาตรวจ ${chosen.length} งาน</div>`;
    openPrint("สรุปงานค้าง "+subj.name+" "+subj.room, headHtml("แบบสรุปรายชื่อนักเรียนที่มีงานค้าง")+sum+t+footHtml()+`<div class="sign">${signTeacher}</div>`);
  };
  const slipHtml=(r)=>{ const sc=subjScores[r.s.id]||{};
    return `<div class="slip"><h2>ใบแจ้งงานค้าง</h2><div class="sub small">${escHtml(school)} · รายวิชา ${escHtml(subjLine)} · ณ วันที่ ${escHtml(today)}</div>
    <div><b>ชื่อ-สกุล</b> ${escHtml(r.s.name)} &nbsp; <b>เลขที่</b> ${r.s.number} &nbsp; <b>ค้าง</b> ${r.miss.length} งาน</div>
    <table><thead><tr><th style="width:9%">ที่</th><th>งานที่ยังไม่ส่ง / ต้องแก้ไข</th><th style="width:10%">เต็ม</th><th style="width:27%">วันที่ส่ง / ครูตรวจ</th></tr></thead><tbody>${
      r.miss.map((a,i)=>`<tr><td class="c">${i+1}</td><td>${escHtml(a.title)}${pendingNoteOf(sc[a.id])?` <span class="small">[${escHtml(pendingNoteOf(sc[a.id]))}]</span>`:""}</td><td class="c">${escHtml(a.max)}</td><td></td></tr>`).join("")}</tbody></table>

  const toggle=(id)=>setPicked(p=>{ const n=new Set(p); n.has(id)?n.delete(id):n.add(id); return n; });
  const found=useMemo(()=>{ const base=q.trim()?findStudents(students,q):students; return base.map(s=>rows.find(r=>r.s.id===s.id)).filter(Boolean); },[q,students,rows]);
  const curRow=cur&&rows.find(r=>r.s.id===cur);
  const lateIdx=curRow?late.findIndex(r=>r.s.id===cur):-1;
  const step=(d)=>{ if(!late.length) return; const i=lateIdx<0?0:(lateIdx+d+late.length)%late.length; setCur(late[i].s.id); };
  const chipStyle=(on)=>({fontSize:12.5,padding:"5px 10px",borderRadius:20,cursor:"pointer",fontFamily:"inherit",fontWeight:600,border:"1px solid "+(on?C.navy:C.border),background:on?C.navy:"#fff",color:on?"#fff":SUB});
  const miniBtn={display:"flex",alignItems:"center",gap:4,background:C.navySoft,border:"none",borderRadius:7,padding:"6px 9px",cursor:"pointer",color:C.navy,fontFamily:"inherit",fontSize:12.5,fontWeight:600};

  return <div style={{display:"grid",gap:12,gridTemplateColumns:"minmax(0,1fr)"}}>

      <button className={mode==="class"?"on":""} onClick={()=>setModeP("class")}><ClipboardList size={15}/>รวมทั้งห้อง</button>
      <button className={mode==="person"?"on":""} onClick={()=>setModeP("person")}><Search size={15}/>รายบุคคล</button></div>}/>

    {/* ตั้งค่า */}
    <div style={panel}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
        <b style={{color:C.navy,fontSize:14.5}}>งานที่นำมาตรวจ ({chosen.length}/{list.length})</b>
        <button onClick={()=>setPicked(new Set(list.map(a=>a.id)))} style={{...miniBtn,padding:"3px 8px"}}>ทั้งหมด</button>
        <button onClick={()=>setPicked(new Set())} style={{...miniBtn,padding:"3px 8px"}}>ล้าง</button>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {list.map(a=><button key={a.id} onClick={()=>toggle(a.id)} style={chipStyle(picked.has(a.id))}>{a.title}</button>)}
        {!list.length && <span style={{color:SUB,fontSize:13.5}}>ยังไม่มีงานในเมนู “เช็คคะแนน”</span>}
      </div>
      <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:12,fontSize:13.5,color:C.navy,fontWeight:600}}>
