function parseSubjectsWorkbook(wb){
  const items=[], warnings=[], seen=new Set();
  wb.SheetNames.forEach(sn=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:""});
    let hi=-1;
    for(let i=0;i<Math.min(rows.length,10);i++){ const t=(rows[i]||[]).map(c=>String(c).trim()); if(t.includes("รหัสวิชา")){ hi=i; break; } }
    if(hi<0) return;
    const head=rows[hi].map(c=>String(c).trim()), ix={};
    Object.keys(SUBJ_COLS).forEach(k=>{ ix[k]=-1; for(const n of SUBJ_COLS[k]){ const i=head.indexOf(n); if(i>=0){ ix[k]=i; break; } } });
    rows.slice(hi+1).forEach((r,j)=>{
      const g=(k)=>ix[k]>=0?String(r[ix[k]]==null?"":r[ix[k]]).trim():"";
      const code=g("code"); if(!code||/^ตัวอย่าง/.test(code)) return;
      const room=normRoom(g("room"));
      if(!room){ warnings.push(sn+" แถว "+(hi+j+2)+": "+code+" — ชั้น/ห้อง “"+g("room")+"” อ่านไม่ได้ (ข้ามแถวนี้)"); return; }
      const key=nameKey(code)+"|"+room;
      if(seen.has(key)){ warnings.push(code+" "+room+": มีซ้ำในไฟล์ (ใช้แถวแรก)"); return; }
      seen.add(key);
      const days=parseDays(g("days"));
      if(!days.length) warnings.push(code+" "+room+": ไม่ระบุวันที่สอน — จะไม่ถูกส่งสรุปเข้าไลน์");
      const cr=g("credits").replace(",",".");
      items.push({code,name:g("name"),room,days,period:g("period"),credits:cr===""?"":(isNaN(+cr)?cr:+cr)});
    });
  });
  return {items,warnings};
}

/* ----- ไฟล์รายชื่อนักเรียน (export จากระบบสารสนเทศชั้นเรียน / ใบมอบตัว) ----- */
const ROS_NAME=["ชื่อ-สกุลนักเรียน","ชื่อ-สกุล","ชื่อ - สกุล","ชื่อนักเรียน"], ROS_ID=["เลขประจำตัวนักเรียน","เลขประจำตัว"], ROS_NO=["ลำดับ","เลขที่"], ROS_ROOM=["ชั้น/ห้อง","ห้อง","ระดับชั้น","ชั้น"], ROS_SEX=["เพศ"];
async function readRosterFile(file){
  const isCsv=/\.csv$/i.test(file.name); let wb;
  if(isCsv){ let t=await file.text(); if(t.charCodeAt(0)===0xFEFF) t=t.slice(1); wb=XLSX.read(t,{type:"string",raw:true}); }
  else wb=XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:"array"});
  const out=[], fileRoom=normRoom(file.name,true);
  wb.SheetNames.forEach(sn=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:isCsv,defval:""});
    let hi=-1;
    for(let i=0;i<Math.min(rows.length,10);i++){ const t=(rows[i]||[]).map(c=>String(c).trim()); if(ROS_NAME.some(n=>t.includes(n))){ hi=i; break; } }
    if(hi<0) return;
    const head=rows[hi].map(c=>String(c).trim());
    const find=(cands)=>{ for(const n of cands){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
    const cN=find(ROS_NAME), cI=find(ROS_ID), cNo=find(ROS_NO), cR=find(ROS_ROOM), cS=find(ROS_SEX);
    const sheetRoom=normRoom(sn,true);
    rows.slice(hi+1).forEach(r=>{
      const name=String(r[cN]==null?"":r[cN]).replace(/\s+/g," ").trim(); if(!name||/^ตัวอย่าง/.test(name)) return;
      const room=(cR>=0?normRoom(r[cR]):"")||sheetRoom||fileRoom||"";
      const no=cNo>=0?parseInt(String(r[cNo]).trim(),10):NaN;
      out.push({room,name,studentId:cI>=0?String(r[cI]==null?"":r[cI]).trim().replace(/\.0+$/,""):"",number:isNaN(no)?null:no,gender:cS>=0?String(r[cS]||"").trim():""});
    });
  });
  return out;
}
/* จัดกลุ่มตามห้อง + ใส่เลขที่ (ใช้ “ลำดับ” ในไฟล์ถ้ามีครบ ไม่งั้นเรียงตามเลขประจำตัวแล้วชื่อ) */
function buildRosterGroups(rows,fallback,level){
  const fb=normRoom(fallback), map=new Map(); let unknown=0;
  rows.forEach(r=>{ const room=r.room||fb; if(!room){ unknown++; return; } if(level&&roomLevel(room)!==level) return;
    if(!map.has(room)) map.set(room,[]); map.get(room).push(r); });
  const groups=[...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],"th",{numeric:true})).map(([room,list])=>{
    const seen=new Set(), uniq=list.filter(x=>{ const k=x.studentId||nameKey(x.name); if(seen.has(k)) return false; seen.add(k); return true; });
    const hasNo=uniq.every(x=>x.number!=null);
    uniq.sort(hasNo?((a,b)=>a.number-b.number):((a,b)=>(a.studentId&&b.studentId)?a.studentId.localeCompare(b.studentId,"th",{numeric:true}):a.name.localeCompare(b.name,"th")));
    return {room,students:uniq.map((x,i)=>({number:hasNo?x.number:i+1,name:x.name,studentId:x.studentId,gender:x.gender}))};
  });
  return {groups,unknown};
}

/* ----- ไฟล์สำรองก่อนล้างข้อมูล ----- */
function downloadBackup(app,label){
  const {subjects,students,attendance,assignments,scores,notes}=app;
  const sName=(id)=>{ const s=subjects.find(x=>x.id===id); return s?s.code+" "+s.name+" ("+s.room+")":id; };
  const wb=XLSX.utils.book_new(); let n=0;
  const add=(name,rows)=>{ if(rows.length>1){ XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name); n++; } };
  add("รายวิชา",[["รหัสวิชา","ชื่อวิชา","ห้อง","วันที่สอน","คาบ/เวลา","หน่วยกิต","ภาคเรียน"],...subjects.map(s=>[s.code,s.name,s.room,(s.days||[]).join(","),s.period||"",s.credits==null?"":s.credits,s.semester||""])]);
  const nameOf={}; Object.values(students).forEach(l=>l.forEach(x=>{ nameOf[x.id]=x.name; }));
  const st=[["รายวิชา","เลขที่","ชื่อ-สกุล","เลขประจำตัว","สถานะ"]];
  subjects.forEach(s=>(students[s.id]||[]).forEach(x=>st.push([sName(s.id),x.number,x.name,x.studentId||"",x.status||"normal"]))); add("นักเรียน",st);
  const sc=[["รายวิชา","นักเรียน","ภาระงาน","คะแนนเต็ม","คะแนน"]];
  subjects.forEach(s=>{ const as=assignments[s.id]||[]; Object.entries(scores[s.id]||{}).forEach(([sid,vals])=>as.forEach(a=>{ const v=vals&&vals[a.id]; if(v!=null&&v!=="") sc.push([sName(s.id),nameOf[sid]||sid,a.title,a.max,v]); })); }); add("คะแนน",sc);
  const at=[["รายวิชา","วันที่","นักเรียน","สถานะ"]];
  subjects.forEach(s=>Object.entries(attendance[s.id]||{}).forEach(([d,marks])=>Object.entries(marks||{}).forEach(([sid,v])=>at.push([sName(s.id),d,nameOf[sid]||sid,(STATUS[v]||{}).label||v])))); add("เช็คชื่อ",at);
  const nt=[["รายวิชา","วันที่","บันทึก"]];
  subjects.forEach(s=>(notes[s.id]||[]).forEach(x=>nt.push([sName(s.id),x.date,x.text]))); add("บันทึกช่วยจำ",nt);
  if(!n) return false;
  XLSX.writeFile(wb,"สำรองข้อมูลรายวิชา_"+(label||"")+"_"+localToday()+".xlsx"); return true;
}

function TermPanels({app}){
  const persist=usePersist();
  const {subjects,setSubjects,students,setStudents,term,setTerm,rosters,setRosters}=app;
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState("");
  const [cfg,setCfg]=useState({semester:term.semester||"",gasUrl:term.gasUrl||"",gasKey:term.gasKey||""});
  const [imp,setImp]=useState(null), [ros,setRos]=useState(null), [clr,setClr]=useState(null);
  const subjRef=useRef(), rosRef=useRef();
  useEffect(()=>{ setCfg({semester:term.semester||"",gasUrl:term.gasUrl||"",gasKey:term.gasKey||""}); },[term]);
  useEffect(()=>{ app.ensureRosters(); },[]);
  const save=async(p)=>{ try{ await p; return true; }catch(e){ console.error(e); alert("บันทึกลงฐานข้อมูลไม่สำเร็จ: "+(e.message||e)); return false; } };

  /* --- ภาคเรียน + เชื่อม Google Sheet --- */
  const saveCfg=async()=>{ const t={semester:cfg.semester.trim(),gasUrl:cfg.gasUrl.trim(),gasKey:cfg.gasKey.trim()};
    GAS.url=t.gasUrl; GAS.key=t.gasKey; setTerm(t); if(await save(persist.setTerm(t))) setMsg("บันทึกการตั้งค่าแล้ว"); };
  const testGas=async()=>{ GAS.url=cfg.gasUrl.trim(); GAS.key=cfg.gasKey.trim(); setMsg("กำลังทดสอบ…");
    const r=await gasPost("ping",{});
    setMsg(r.skipped?"ยังไม่ได้ใส่ลิงก์ Web App":r.ok?(r.unverified?"ส่งคำขอแล้ว แต่เบราว์เซอร์อ่านผลตอบกลับไม่ได้ — ตรวจที่ชีตแท็บ Log ว่ามีรายการ ping":"เชื่อมต่อสำเร็จ ✔"):(r.data&&r.data.error==="unauthorized"?"รหัสลับ (SECRET) ไม่ตรงกับในสคริปต์":"เชื่อมต่อไม่สำเร็จ")); };
  const syncAll=async()=>{ setBusy(true); setMsg("กำลังส่งข้อมูลทั้งหมดขึ้น Google Sheet…");
    try{ await app.ensureAll(); await new Promise(r=>setTimeout(r,80)); }catch(e){ setBusy(false); setMsg("โหลดข้อมูลบางวิชาไม่สำเร็จ ลองอีกครั้ง"); return; }
    const r1=await gasPost("upsertSubjects",{semester:term.semester,replace:true,subjects:subjects.map(s=>gasSubject(s,term.semester))});
    const all=[]; subjects.forEach(s=>(app.dataRef.current.notes[s.id]||[]).forEach(n=>all.push(gasNote(n,s,term.semester))));
    let okN=true; for(let i=0;i<all.length;i+=100){ const r=await gasPost("upsertNotes",{notes:all.slice(i,i+100)}); if(!r.ok) okN=false; }
    setBusy(false); setMsg(r1.ok&&okN?"ส่งแล้ว: "+subjects.length+" วิชา, "+all.length+" บันทึก":"ส่งไม่สำเร็จบางส่วน (ดู Console)"); };

  /* --- นำเข้ารายวิชา --- */
  const onSubjFile=async(e)=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return;
    try{ const r=parseSubjectsWorkbook(XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:"array"}));
      if(!r.items.length){ alert("ไม่พบรายวิชาในไฟล์ — ต้องมีหัวคอลัมน์ รหัสวิชา และ ชั้น/ห้อง (โหลด template จากปุ่มด้านบน)"); return; }
      setImp({...r,fileName:f.name,semester:term.semester||""}); }
    catch(err){ alert("อ่านไฟล์ไม่สำเร็จ: "+err.message); } };
  const doImport=async()=>{ setBusy(true);
    const sem=imp.semester.trim(), now=Date.now(), created=[], updated=[];
    imp.items.forEach((it,i)=>{ const ex=subjects.find(s=>nameKey(s.code)===nameKey(it.code)&&nameKey(s.room)===nameKey(it.room));
      if(ex) updated.push({...ex,name:it.name||ex.name,days:it.days,period:it.period,credits:it.credits,semester:sem||ex.semester||""});
      else created.push({id:uid(),code:it.code,name:it.name||it.code,room:it.room,days:it.days,period:it.period,credits:it.credits,semester:sem,color:CARD_COLORS[(subjects.length+created.length)%CARD_COLORS.length],createdAt:now+i}); });
    const writes=[...updated,...created];
    const merged=(()=>{ const m=new Map(subjects.map(s=>[s.id,s])); writes.forEach(s=>m.set(s.id,s)); return [...m.values()].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); })();
    await app.ensureRosters();
    await save(persist.setSubjects(writes));
    setSubjects(merged);
    /* วิชาใหม่ที่ห้องตรงกับรายชื่อกลาง (roster) → ใส่รายชื่อให้อัตโนมัติ */
    let filled=0; const stu={...students};
    for(const s of created){ const r=rosters[roomKey(s.room)]; if(r&&r.students&&r.students.length){
      const list=r.students.map(x=>({id:uid(),number:x.number,name:x.name,studentId:x.studentId||"",status:"normal"}));
      stu[s.id]=list; filled++; await save(persist.upsertStudents(s.id,list)); } }
    app.markLoaded(created.map(s=>s.id));
    created.forEach(s=>{ app.syncCount(s.id,(stu[s.id]||[]).length); });
    setStudents(stu);
    if(sem&&sem!==term.semester){ const t={...term,semester:sem}; setTerm(t); await save(persist.setTerm({semester:sem})); }
    await gasPost("upsertSubjects",{semester:sem||term.semester,replace:true,subjects:merged.map(s=>gasSubject(s,sem||term.semester))});
    setBusy(false); setImp(null);
    setMsg("นำเข้ารายวิชาแล้ว: เพิ่มใหม่ "+created.length+" · อัปเดต "+updated.length+(filled?" · ดึงรายชื่อนักเรียนอัตโนมัติ "+filled+" วิชา":"")); };

  /* --- นำเข้ารายชื่อนักเรียน --- */
  const onRosFile=async(e)=>{ const files=[...e.target.files]; e.target.value=""; if(!files.length) return;
    try{ let rows=[]; for(const f of files) rows=rows.concat(await readRosterFile(f));
      if(!rows.length){ alert("ไม่พบรายชื่อ — ไฟล์ต้องมีคอลัมน์ ชื่อ-สกุล (หรือ ชื่อ-สกุลนักเรียน)"); return; }
      setRos({rows,fallback:"",level:"",names:files.map(f=>f.name).join(", ")}); }
    catch(err){ alert("อ่านไฟล์ไม่สำเร็จ: "+err.message); } };
  const doRoster=async()=>{ setBusy(true);
    const {groups}=buildRosterGroups(ros.rows,ros.fallback,ros.level), now=Date.now();
    /* ต้องโหลดรายชื่อเดิมของวิชาที่ห้องตรงกันก่อน เพื่อจับคู่/อัปเดต ไม่ให้เกิดชื่อซ้ำ */
    const targetIds=subjects.filter(x=>groups.some(g=>nameKey(g.room)===nameKey(x.room))).map(x=>x.id);
    try{ await app.ensureSubjects(targetIds); }catch(e){ setBusy(false); alert("โหลดรายชื่อเดิมของบางวิชาไม่สำเร็จ ลองอีกครั้ง"); return; }
    const newRosters={...rosters}, stu={...app.dataRef.current.students}; let added=0, upd=0, nSub=0;
    for(const g of groups){ const key=roomKey(g.room), doc={room:g.room,level:roomLevel(g.room),students:g.students,updatedAt:now};
      newRosters[key]=doc; await save(persist.setRoster(key,doc));
      for(const s of subjects.filter(x=>nameKey(x.room)===nameKey(g.room))){
        const cur=stu[s.id]||[], byId=new Map(), byName=new Map(); cur.forEach(x=>{ if(x.studentId) byId.set(String(x.studentId),x); byName.set(nameKey(x.name),x); });
        const next=[...cur], writes=[];
        g.students.forEach(st=>{ const ex=(st.studentId&&byId.get(String(st.studentId)))||byName.get(nameKey(st.name));
          if(ex){ const u={...ex,number:st.number,name:st.name,studentId:st.studentId||ex.studentId||""}; writes.push(u); next[next.findIndex(x=>x.id===ex.id)]=u; upd++; }
          else { const nw={id:uid(),number:st.number,name:st.name,studentId:st.studentId||"",status:"normal"}; writes.push(nw); next.push(nw); added++; } });
        next.sort((a,b)=>(a.number||0)-(b.number||0)); stu[s.id]=next; nSub++; app.syncCount(s.id,next.length);
        await save(persist.upsertStudents(s.id,writes)); } }
    setRosters(newRosters); setStudents(stu); setBusy(false); setRos(null);
    setMsg("นำเข้ารายชื่อแล้ว "+groups.length+" ห้อง ("+groups.reduce((a,g)=>a+g.students.length,0)+" คน) · เติมเข้า "+nSub+" วิชา (เพิ่มใหม่ "+added+" · อัปเดต "+upd+" คน)"); };

  /* --- ล้างข้อมูลรายวิชาทั้งหมด --- */
  const openClear=()=>setClr({text:"",backup:true,roster:false,fixes:false,gas:!!GAS.url,nextSem:nextSemester(term.semester)});
  const doClear=async()=>{ setBusy(true);
    if(clr.backup){ try{ await app.ensureAll(); await new Promise(r=>setTimeout(r,80)); downloadBackup({...app,...app.dataRef.current},(term.semester||"").replace("/","-")); }
      catch(e){ console.error(e); if(!window.confirm("สร้างไฟล์สำรองไม่สำเร็จ ต้องการล้างต่อโดยไม่สำรองหรือไม่?")){ setBusy(false); return; } } }
    const names=["subjects","students","attendance","assignments","scores","notes","qinfo"]; if(clr.fixes) names.push("fixes"); if(clr.roster) names.push("roster");
    if(!(await save(persist.clearCollections(names)))){ setBusy(false); return; }
    setSubjects([]); setStudents({}); app.setAttendance({}); app.setAssignments({}); app.setScores({}); app.setNotes({}); app.setQinfo({}); app.resetLoaded();
    if(clr.fixes) app.setFixes([]); if(clr.roster) setRosters({});
    const sem=clr.nextSem.trim(); if(sem){ setTerm({...term,semester:sem}); await save(persist.setTerm({semester:sem})); }
    if(clr.gas) await gasPost("resetTerm",{semester:sem});
    setBusy(false); setClr(null); setMsg("ล้างข้อมูลรายวิชาแล้ว"+(sem?" · ภาคเรียนปัจจุบัน "+sem:"")+" — นำเข้ารายวิชาใหม่จาก template ได้เลย"); };

  const rg=ros?buildRosterGroups(ros.rows,ros.fallback,ros.level):{groups:[],unknown:0};
  const levels=ros?[...new Set(ros.rows.map(r=>roomLevel(r.room||normRoom(ros.fallback))).filter(Boolean))].sort():[];

  return <div style={{display:"grid",gap:14}}>
    {msg && <div style={{background:"#e6f4ec",color:"#2e7d52",border:"1px solid #bfe3cd",borderRadius:10,padding:"10px 14px",fontSize:14,fontWeight:600}}>{msg}</div>}

    <div style={panel}>
      <div style={panelHead}><Cloud size={18}/> ภาคเรียนปัจจุบัน และการเชื่อม Google Sheet / LINE</div>
      <Field label="ภาคเรียน (เช่น 1/2569)"><input style={inputStyle} value={cfg.semester} onChange={e=>setCfg({...cfg,semester:e.target.value})} placeholder="1/2569"/></Field>
      <Field label="ลิงก์ Web App ของ Google Apps Script (ลงท้าย /exec)"><input style={inputStyle} value={cfg.gasUrl} onChange={e=>setCfg({...cfg,gasUrl:e.target.value})} placeholder="https://script.google.com/macros/s/.../exec"/></Field>
      <Field label="รหัสลับ SECRET (ตั้งให้ตรงกับในสคริปต์ — เว้นว่างได้ถ้าไม่ตั้ง)"><input style={inputStyle} value={cfg.gasKey} onChange={e=>setCfg({...cfg,gasKey:e.target.value})}/></Field>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <Btn variant="primary" onClick={saveCfg}><Save size={15}/>บันทึก</Btn>
        <Btn variant="ghost" onClick={testGas}>ทดสอบเชื่อมต่อ</Btn>
        <Btn variant="ghost" onClick={syncAll} disabled={busy||!cfg.gasUrl}><Upload size={15}/>ส่งข้อมูลทั้งหมดขึ้น Google Sheet</Btn>
      </div>
      <div style={{fontSize:12.5,color:SUB,marginTop:8,lineHeight:1.6}}>วิชาและบันทึกช่วยจำจะถูกส่งขึ้น Google Sheet อัตโนมัติทุกครั้งที่บันทึก เพื่อให้ระบบส่งสรุปเข้า LINE ตอน 07:00 (วิธีตั้งค่าดูใน gas/README.md)</div>
    </div>

    <div style={panel}>
      <div style={panelHead}><Table size={18}/> นำเข้ารายวิชาภาคเรียนใหม่ (template)</div>
      <div style={{fontSize:13.5,color:SUB,lineHeight:1.6,marginBottom:10}}>โหลด template → กรอก รหัสวิชา / ชื่อวิชา / ชั้น-ห้อง / วันที่สอน / คาบ-เวลา / หน่วยกิต → นำเข้า ระบบจะดึงรายชื่อนักเรียนเข้าวิชาให้อัตโนมัติถ้าเคยนำเข้ารายชื่อห้องนั้นไว้แล้ว</div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <Btn variant="ghost" onClick={downloadSubjectTemplate}><Download size={15}/>ดาวน์โหลด template</Btn>
        <Btn variant="accent" onClick={()=>subjRef.current&&subjRef.current.click()}><Upload size={15}/>นำเข้ารายวิชา (.xlsx)</Btn>
        <input ref={subjRef} type="file" accept=".xlsx,.xls" onChange={onSubjFile} style={{display:"none"}}/>
      </div>
    </div>

    <div style={panel}>
      <div style={panelHead}><Upload size={18}/> นำเข้ารายชื่อนักเรียนตามระดับชั้น</div>
      <div style={{fontSize:13.5,color:SUB,lineHeight:1.6,marginBottom:10}}>เลือกไฟล์ที่ Export จากระบบสารสนเทศชั้นเรียน (รายชื่อนักเรียน_ม…xlsx) หรือไฟล์ใบมอบตัว .csv เลือกได้หลายไฟล์พร้อมกัน ระบบจับห้องจากคอลัมน์ ชั้น/ห้อง ชื่อชีต หรือชื่อไฟล์ แล้วเติมรายชื่อเข้าวิชาที่ห้องตรงกัน (ไม่ลบนักเรียนเดิม จึงไม่กระทบคะแนน)
        {Object.keys(rosters).length>0 && <span> · รายชื่อกลางที่มีอยู่ตอนนี้ {Object.keys(rosters).length} ห้อง</span>}</div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <Btn variant="ghost" onClick={downloadRosterTemplate}><Download size={15}/>ดาวน์โหลด template รายชื่อ</Btn>
        <Btn variant="accent" onClick={()=>rosRef.current&&rosRef.current.click()}><Upload size={15}/>เลือกไฟล์รายชื่อ (.xlsx / .csv)</Btn>
      </div>
      <input ref={rosRef} type="file" multiple accept=".xlsx,.xls,.csv" onChange={onRosFile} style={{display:"none"}}/>
    </div>

    <div style={{...panel,borderColor:"#f0c9c4"}}>
      <div style={{...panelHead,color:"#c0392b"}}><Trash2 size={18}/> ล้างข้อมูลรายวิชาทั้งหมด (จบภาคเรียน)</div>
      <div style={{fontSize:13.5,color:SUB,lineHeight:1.6,marginBottom:10}}>ลบรายวิชา นักเรียน เช็คชื่อ คะแนน ภาระงาน บันทึกช่วยจำ และการเทียบ Q-Info ({subjects.length} วิชา) — ระบบจะโหลดไฟล์สำรอง .xlsx ให้ก่อน และบันทึกช่วยจำที่ส่งขึ้น Google Sheet แล้วจะยังคงอยู่ในชีต</div>
      <Btn variant="danger" onClick={openClear} disabled={!subjects.length}><Trash2 size={15}/>ล้างข้อมูลรายวิชา…</Btn>
    </div>

    <Modal open={!!imp} onClose={()=>!busy&&setImp(null)} title="นำเข้ารายวิชา" width={640}>
      {imp && <div>
        <div style={{fontSize:13.5,color:SUB,marginBottom:10}}>ไฟล์: {imp.fileName} · พบ {imp.items.length} วิชา/ห้อง</div>
        <Field label="ภาคเรียน"><input style={inputStyle} value={imp.semester} onChange={e=>setImp({...imp,semester:e.target.value})} placeholder="1/2569"/></Field>
        <div style={{...tableWrap,maxHeight:260,marginBottom:10}}><table style={tableStyle}>
          <thead><tr>{["รหัส","ชื่อวิชา","ห้อง","วัน","คาบ/เวลา","หน่วยกิต",""].map((h,i)=><th key={i} style={th}>{h}</th>)}</tr></thead>
          <tbody>{imp.items.map((it,i)=>{ const ex=subjects.some(s=>nameKey(s.code)===nameKey(it.code)&&nameKey(s.room)===nameKey(it.room));
            return <tr key={i} className="tl-row"><td style={td}>{it.code}</td><td style={td}>{it.name}</td><td style={td}>{it.room}</td><td style={td}>{it.days.join(",")||"—"}</td><td style={td}>{it.period}</td><td style={{...td,textAlign:"center"}}>{it.credits}</td>
              <td style={{...td,fontSize:12,color:ex?"#b7791f":"#2e7d52",fontWeight:700}}>{ex?"อัปเดต":"ใหม่"}</td></tr>; })}</tbody></table></div>
        {imp.warnings.length>0 && <details style={{fontSize:12.5,color:"#b7791f",marginBottom:10}}><summary style={{cursor:"pointer"}}>ข้อควรตรวจ {imp.warnings.length} รายการ</summary>{imp.warnings.slice(0,30).map((w,i)=><div key={i}>{w}</div>)}</details>}
        <div style={{fontSize:12.5,color:SUB,marginBottom:12}}>วิชาที่มีรหัส+ห้องตรงกับที่มีอยู่แล้วจะอัปเดตตารางสอน/หน่วยกิตเท่านั้น (ไม่แตะนักเรียนและคะแนน)</div>
        <Btn variant="primary" onClick={doImport} disabled={busy} style={{width:"100%"}}><Save size={16}/>{busy?"กำลังนำเข้า…":"ยืนยันนำเข้า"}</Btn>
      </div>}
    </Modal>

    <Modal open={!!ros} onClose={()=>!busy&&setRos(null)} title="นำเข้ารายชื่อนักเรียน" width={640}>
      {ros && <div>
        <div style={{fontSize:13.5,color:SUB,marginBottom:10}}>ไฟล์: {ros.names} · อ่านได้ {ros.rows.length} แถว</div>
        {ros.rows.some(r=>!r.room) && <Field label={"มี "+ros.rows.filter(r=>!r.room).length+" แถวที่ไม่ทราบห้อง — ระบุห้องให้แถวเหล่านี้ (เช่น ม.1/1)"}><input style={inputStyle} value={ros.fallback} onChange={e=>setRos({...ros,fallback:e.target.value})} placeholder="ม.1/1"/></Field>}
        <Field label="นำเข้าเฉพาะระดับชั้น"><select style={inputStyle} value={ros.level} onChange={e=>setRos({...ros,level:e.target.value})}><option value="">ทุกระดับชั้นในไฟล์</option>{levels.map(l=><option key={l} value={l}>{l}</option>)}</select></Field>
        <div style={{...tableWrap,maxHeight:240,marginBottom:10}}><table style={tableStyle}>
          <thead><tr><th style={th}>ห้อง</th><th style={th}>นักเรียน</th><th style={th}>วิชาที่ตรงห้องนี้</th><th style={th}>รายชื่อกลางเดิม</th></tr></thead>
          <tbody>{rg.groups.map(g=><tr key={g.room} className="tl-row"><td style={td}><b>{g.room}</b></td><td style={{...td,textAlign:"center"}}>{g.students.length}</td>
            <td style={{...td,textAlign:"center",color:subjects.some(s=>nameKey(s.room)===nameKey(g.room))?"#2e7d52":SUB}}>{subjects.filter(s=>nameKey(s.room)===nameKey(g.room)).length}</td>
            <td style={{...td,textAlign:"center",color:SUB}}>{(rosters[roomKey(g.room)]||{students:[]}).students.length||"—"}</td></tr>)}
            {!rg.groups.length && <tr><td colSpan={4} style={{...td,textAlign:"center",color:SUB}}>ไม่มีรายชื่อตามตัวกรอง</td></tr>}</tbody></table></div>
        <div style={{fontSize:12.5,color:SUB,marginBottom:12,lineHeight:1.6}}>รายชื่อจะถูกเก็บเป็น “รายชื่อกลาง” ของห้อง (ใช้ซ้ำเมื่อนำเข้ารายวิชาภาคเรียนใหม่) และเติมเข้าวิชาที่ห้องตรงกัน — นักเรียนที่มีอยู่แล้ว (จับคู่ด้วยเลขประจำตัว/ชื่อ) จะอัปเดตเลขที่และชื่อ ไม่ลบใคร</div>
        <Btn variant="primary" onClick={doRoster} disabled={busy||!rg.groups.length} style={{width:"100%"}}><Save size={16}/>{busy?"กำลังนำเข้า…":"ยืนยันนำเข้า "+rg.groups.reduce((a,g)=>a+g.students.length,0)+" คน"}</Btn>
      </div>}
    </Modal>

    <Modal open={!!clr} onClose={()=>!busy&&setClr(null)} title="ล้างข้อมูลรายวิชาทั้งหมด" width={520}>
      {clr && <div>
        <div style={{background:"#fbeae8",color:"#c0392b",borderRadius:10,padding:"10px 12px",fontSize:13.5,lineHeight:1.6,marginBottom:12}}>จะลบถาวร: {subjects.length} รายวิชา · นักเรียน/เช็คชื่อ/คะแนน/ภาระงาน/บันทึกช่วยจำ/Q-Info ทั้งหมด กู้คืนไม่ได้</div>
        <label style={{display:"flex",gap:8,alignItems:"flex-start",fontSize:14,marginBottom:8,cursor:"pointer"}}><input type="checkbox" checked={clr.backup} onChange={e=>setClr({...clr,backup:e.target.checked})} style={{width:18,height:18,marginTop:2}}/>ดาวน์โหลดไฟล์สำรอง (.xlsx) ก่อนล้าง (แนะนำ)</label>
        <label style={{display:"flex",gap:8,alignItems:"flex-start",fontSize:14,marginBottom:8,cursor:"pointer"}}><input type="checkbox" checked={clr.roster} onChange={e=>setClr({...clr,roster:e.target.checked})} style={{width:18,height:18,marginTop:2}}/>ล้างรายชื่อกลาง (roster) ด้วย — ปกติไม่ต้อง ใช้ซ้ำภาคเรียนหน้าได้</label>
        <label style={{display:"flex",gap:8,alignItems:"flex-start",fontSize:14,marginBottom:8,cursor:"pointer"}}><input type="checkbox" checked={clr.fixes} onChange={e=>setClr({...clr,fixes:e.target.checked})} style={{width:18,height:18,marginTop:2}}/>ล้างงานแก้ 0 ร มส ด้วย — ปกติไม่ต้อง เพราะต้องติดตามข้ามภาคเรียน</label>
        <label style={{display:"flex",gap:8,alignItems:"flex-start",fontSize:14,marginBottom:12,cursor:"pointer",opacity:GAS.url?1:.5}}><input type="checkbox" disabled={!GAS.url} checked={clr.gas} onChange={e=>setClr({...clr,gas:e.target.checked})} style={{width:18,height:18,marginTop:2}}/>ล้างรายวิชาในชีต Subjects ด้วย (บันทึกช่วยจำเก่ายังอยู่ในชีต Notes)</label>
        <Field label="ภาคเรียนถัดไป (ตั้งให้อัตโนมัติ แก้ได้)"><input style={inputStyle} value={clr.nextSem} onChange={e=>setClr({...clr,nextSem:e.target.value})} placeholder="2/2569"/></Field>
        <Field label="พิมพ์คำว่า ล้างข้อมูล เพื่อยืนยัน"><input style={inputStyle} value={clr.text} onChange={e=>setClr({...clr,text:e.target.value})}/></Field>
        <Btn variant="danger" onClick={doClear} disabled={busy||clr.text.trim()!=="ล้างข้อมูล"} style={{width:"100%"}}><Trash2 size={16}/>{busy?"กำลังล้าง…":"ล้างข้อมูลทั้งหมด"}</Btn>
      </div>}
    </Modal>
  </div>;
}

function SettingsView({subjects,students,setStudents,logoUrl,setLogoUrl,app}){
  const persist=usePersist();
  const [target,setTarget]=useState((subjects[0]&&subjects[0].id)||"");
  const [pasteText,setPasteText]=useState("");
  const [logoInput,setLogoInput]=useState(logoUrl);
  const fileRef=useRef();
  useEffect(()=>{ if(!target && subjects[0]) setTarget(subjects[0].id); },[subjects]);
  useEffect(()=>{ if(target) app.ensureSubject(target).catch(()=>{}); },[target]);
  const targetReady=!FB||!!app.loadedSubj[target];
  const parseNames=(text)=>text.split("\n").map(l=>l.trim()).filter(Boolean).map((line,i)=>{
    const m=line.split(/[,\t]/).map(x=>x.trim());
    if(m.length>=2 && /^\d+$/.test(m[0])) return {id:uid(),number:Number(m[0]),name:m.slice(1).join(" ")};
    return {id:uid(),number:i+1,name:line};
  });
  const importPaste=()=>{ if(!target) return alert("ยังไม่มีรายวิชา"); if(!targetReady) return alert("กำลังโหลดรายชื่อเดิมของวิชานี้ ลองใหม่อีกครั้ง");
    const parsed=parseNames(pasteText); if(!parsed.length) return;
    setStudents(p=>({...p,[target]:parsed})); persist.replaceStudents(target,parsed); app.syncCount(target,parsed.length); setPasteText(""); alert("นำเข้า "+parsed.length+" รายชื่อสำเร็จ"); };
  const importFile=(e)=>{ const file=e.target.files[0]; if(!file||!target) return; if(!targetReady){ e.target.value=""; return alert("กำลังโหลดรายชื่อเดิมของวิชานี้ ลองใหม่อีกครั้ง"); }
    const reader=new FileReader();
    reader.onload=(ev)=>{ const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{header:1}); const parsed=[];
      rows.forEach((r,i)=>{ if(!r||!r.length) return; const first=String(r[0]!=null?r[0]:"").trim();
        if(i===0 && !/^\d+$/.test(first)) return;
        if(/^\d+$/.test(first) && r[1]) parsed.push({id:uid(),number:Number(first),name:String(r[1]).trim()});
        else if(first) parsed.push({id:uid(),number:parsed.length+1,name:first}); });
      if(parsed.length){ setStudents(p=>({...p,[target]:parsed})); persist.replaceStudents(target,parsed); app.syncCount(target,parsed.length); alert("นำเข้าจากไฟล์ "+parsed.length+" รายชื่อสำเร็จ"); }
      else alert("ไม่พบข้อมูลในไฟล์"); };
    reader.readAsArrayBuffer(file); e.target.value=""; };
  const currentList=students[target]||[];
  const setStuStatus=(id,status)=>{ setStudents(p=>({...p,[target]:(p[target]||[]).map(s=>s.id===id?{...s,status}:s)})); persist.setStudentStatus(id,status); };
  const removeStudent=(id)=>{ setStudents(p=>({...p,[target]:(p[target]||[]).filter(s=>s.id!==id)})); persist.deleteStudent(id); app.syncCount(target,Math.max(0,currentList.length-1)); };
  return <div style={{display:"grid",gap:14}}>
    <h2 style={{margin:0,fontSize:19,color:C.navy}}>ตั้งค่าระบบ</h2>
    <TermPanels app={app}/>
    <div style={panel}>
      <div style={panelHead}><Upload size={18}/> นำเข้ารายชื่อนักเรียน</div>
      <Field label="เลือกรายวิชา"><select style={inputStyle} value={target} onChange={e=>setTarget(e.target.value)}>
        {subjects.map(s=><option key={s.id} value={s.id}>{s.name} ({s.room})</option>)}
      </select></Field>
      <Field label="วางรายชื่อ (1 บรรทัด/คน — รองรับ “เลขที่,ชื่อ” หรือชื่ออย่างเดียว)">
        <textarea style={{...inputStyle,minHeight:110,resize:"vertical"}} value={pasteText} onChange={e=>setPasteText(e.target.value)} placeholder={"1,เด็กชายสมชาย ใจดี\n2,เด็กหญิงสมหญิง รักเรียน"}/>
      </Field>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <Btn variant="primary" onClick={importPaste}><Upload size={15}/>นำเข้าจากข้อความ</Btn>
        <Btn variant="ghost" onClick={()=>fileRef.current&&fileRef.current.click()}><Upload size={15}/>นำเข้าจากไฟล์ .xlsx / .csv</Btn>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" onChange={importFile} style={{display:"none"}}/>
      </div>
      {currentList.length>0 && <div style={{marginTop:14}}>
        <div style={{fontSize:13,fontWeight:600,color:SUB,marginBottom:6}}>รายชื่อปัจจุบัน ({currentList.length} คน · สถานะปกติ {currentList.filter(isNormalStu).length} คน)</div>
        <div style={{...tableWrap,maxHeight:240}}><table style={tableStyle}>
          <thead><tr><th style={{...th,width:44}}>#</th><th style={{...th,textAlign:"left"}}>ชื่อ-สกุล</th><th style={{...th,width:118}}>สถานะ</th><th style={{...th,width:56}}></th></tr></thead>
          <tbody>{currentList.map(s=><tr key={s.id} className="tl-row">
            <td style={{...td,textAlign:"center",color:SUB}}>{s.number}</td><td style={{...td,opacity:isNormalStu(s)?1:.55}}>{s.name}</td>
            <td style={{...td,textAlign:"center",padding:"6px 8px"}}><select value={s.status||"normal"} onChange={e=>setStuStatus(s.id,e.target.value)} style={{fontFamily:"inherit",fontSize:13.5,fontWeight:600,padding:"5px 6px",borderRadius:8,border:"1px solid "+C.border,color:stuStatusOf(s).color,background:stuStatusOf(s).bg,cursor:"pointer"}}>{STU_STATUS.map(o=><option key={o.v} value={o.v}>{o.label}</option>)}</select></td>
            <td style={{...td,textAlign:"center"}}><button onClick={()=>removeStudent(s.id)} style={{background:"none",border:"none",color:"#c0392b",cursor:"pointer"}}><Trash2 size={15}/></button></td>
          </tr>)}</tbody>
        </table></div>
      </div>}
    </div>
    <div style={panel}>
      <div style={panelHead}><ImageIcon size={18}/> โลโก้ระบบ (ใช้เป็น favicon ด้วย)</div>
      <Field label="ลิงก์รูปโลโก้ (URL)"><input style={inputStyle} value={logoInput} onChange={e=>setLogoInput(e.target.value)} placeholder="https://.../logo.png"/></Field>
      <div style={{display:"flex",gap:12,alignItems:"center"}}>
        <Btn variant="primary" onClick={()=>{ const u=logoInput.trim(); setLogoUrl(u); persist.setLogo(u); }}><Save size={15}/>บันทึกโลโก้</Btn>
        {logoInput && <img src={logoInput} alt="preview" style={{width:44,height:44,borderRadius:8,objectFit:"cover",border:"1px solid "+C.border}}/>}
      </div>
    </div>
    <div style={{...panel,fontSize:13,color:SUB,lineHeight:1.6}}>
      <div style={panelHead}><Cloud size={18}/> สถานะฐานข้อมูล</div>
      {FB ? "เชื่อมต่อ Firestore แล้ว — ข้อมูลถูกบันทึกอัตโนมัติ" : "ยังไม่ได้เชื่อมต่อ Firestore (กำลังรันในโหมดทดลอง) เมื่อเปิดผ่าน GitHub Pages ระบบจะเชื่อมต่ออัตโนมัติ"}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
